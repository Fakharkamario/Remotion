      <style>

        #room-bg {

        #room-plant {

        #room-pill {

        #room-pill-press {
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, #e3f8da 0%, #b5ec9f 55%, #8fe27a 100%);
          opacity: 0;
        }
        #room-pill-icon {
          position: relative;
          flex: none;

          height: 48px;
          border-radius: 50%;
          background: #24402a;
          display: grid;
          place-items: center;
        }
        #room-pill-text {
          position: relative;
          font-size: 38px;
          font-weight: 500;
          letter-spacing: -0.02em;
          color: #1e3a1f;
          white-space: nowrap;
        }
        #room-pill-text span {
          display: inline-block;
        }
      </style>

      <div data-hf-id="hf-vnhw" id="root" data-composition-id="room" data-width="1920" data-height="1080">
        <div data-hf-id="hf-82pf" id="room-cam" data-layout-allow-overflow="">
          <img data-hf-id="hf-poam" id="room-bg" src="assets/art/room-living.svg" alt="">
          <div data-hf-id="hf-bf2s" id="room-plant">
            <img data-hf-id="hf-zsgu" id="room-dying-img" src="assets/art/plant-dying.svg" alt="">
            <img data-hf-id="hf-44mi" id="room-glow-img" src="assets/art/plant-glow.svg" alt="">
          </div>
          <div data-hf-id="hf-9q0h" id="room-frag-a" class="room-frag" style="left: 1010px; top: 760px; width: 170px; height: 40px"></div>
          <div data-hf-id="hf-aysi" id="room-frag-b" class="room-frag" style="left: 1400px; top: 640px; width: 64px; height: 44px"></div>
          <div data-hf-id="hf-f1zk" id="room-frag-c" class="room-frag" style="left: 1150px; top: 470px; width: 14px; height: 70px"></div>
          <div data-hf-id="hf-hps9" id="room-ghost">An</div>
          <div data-hf-id="hf-odmc" id="room-pill">
            <div data-hf-id="hf-g2b0" id="room-pill-bg"></div>
            <div data-hf-id="hf-m4me" id="room-pill-press"></div>
            <div data-hf-id="hf-kjfi" id="room-pill-icon">
              <svg data-hf-id="hf-4md6" width="26" height="26" viewBox="0 0 26 26" fill="none">
                <circle data-hf-id="hf-chz1" cx="11" cy="11" r="7" stroke="#f3f2ec" stroke-width="3" />
                <line data-hf-id="hf-go8k" x1="16.5" y1="16.5" x2="22" y2="22" stroke="#f3f2ec" stroke-width="3" stroke-linecap="round" />
              </svg>
            </div>
            <div data-hf-id="hf-q8is" id="room-pill-text"><span data-hf-id="hf-ms68">A</span><span data-hf-id="hf-tjdp">n</span><span data-hf-id="hf-zhz4">a</span><span data-hf-id="hf-ubzr">l</span><span data-hf-id="hf-pymg">y</span><span data-hf-id="hf-orpd">z</span><span data-hf-id="hf-xwr0">e</span></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const PUNCH = 1.4667; // 3.167s in the master edit

          // ---- camera: settle-in, slow push, hard punch-in cut, slow drift ----
          gsap.set("#room-cam", { transformOrigin: "0 0" });
          const wide = (s) => ({ scale: s, x: 960 * (1 - s), y: 560 * (1 - s) });
          tl.fromTo("#room-cam", wide(1.05), { ...wide(1.0), duration: 0.12, ease: "power2.out" }, 0);
          tl.to("#room-cam", { ...wide(1.07), duration: PUNCH - 0.12, ease: "sine.inOut" }, 0.12);
          // punch-in: the cut is instantaneous, then the camera keeps creeping in
          tl.set("#room-cam", { scale: 1.62, x: -735, y: -405 }, PUNCH);
          tl.to("#room-cam", { scale: 1.68, x: -800, y: -432, duration: 2.4667 - PUNCH, ease: "sine.out" }, PUNCH);

          // gentle leaf sway (finite)
          gsap.set("#room-plant", { transformOrigin: "50% 78%" });
          tl.fromTo("#room-plant", { rotation: -0.7 }, { rotation: 0.7, duration: 1.23, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

          // ---- analysis glow sweeps over the plant ----
          tl.to("#room-glow-img", { opacity: 1, duration: 0.18, ease: "power2.out" }, 0.5);
          tl.to("#room-glow-img", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 0.9);

          // ---- glowing UI fragments assemble into the pill ----
          tl.fromTo("#room-frag-a", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.08, ease: "power2.out" }, 0.53);
          tl.to("#room-frag-a", { x: 80, y: -110, scaleX: 0.4, opacity: 0, duration: 0.2, ease: "power2.in" }, 0.62);
          tl.fromTo("#room-frag-b", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.08, ease: "power2.out" }, 0.56);
          tl.to("#room-frag-b", { x: -90, opacity: 0, duration: 0.2, ease: "power2.in" }, 0.68);
          tl.fromTo("#room-frag-c", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.08, ease: "power2.out" }, 0.55);
          tl.to("#room-frag-c", { y: 120, opacity: 0, duration: 0.18, ease: "power2.in" }, 0.64);
          tl.fromTo("#room-ghost", { opacity: 0, y: 0 }, { opacity: 1, duration: 0.06 }, 0.6);
          tl.to("#room-ghost", { y: -78, x: 50, opacity: 0, duration: 0.16, ease: "power2.in" }, 0.68);

          tl.fromTo(
            "#room-pill",
            { opacity: 0, scale: 0.86, x: -24 },
            { opacity: 1, scale: 1, x: 0, duration: 0.22, ease: "back.out(1.6)" },
            0.6
          );
          tl.to("#room-pill-bg", { opacity: 0.9, duration: 0.35, ease: "power2.out" }, 0.75);

          // typed label: each new letter flashes green, then settles to ink
          const letters = document.querySelectorAll("#room-pill-text span");
          letters.forEach((el, i) => {
            const at = 0.68 + (i < 2 ? i * 0.03 : 0.1 + (i - 2) * 0.045);
            tl.fromTo(el, { opacity: 0, color: "#5bd94a" }, { opacity: 1, duration: 0.03 }, at);
            tl.to(el, { color: "#1e3a1f", duration: 0.2, ease: "power1.out" }, at + 0.08);
          });

          // ---- press: green fill sweeps across, pill dips ----
          tl.fromTo("#room-pill-press", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.14, ease: "power2.out" }, 1.82);
          tl.to("#room-pill", { scale: 0.95, duration: 0.08, ease: "power2.in" }, 1.82);
          tl.to("#room-pill", { scale: 1, duration: 0.24, ease: "back.out(2.5)" }, 1.905);
          tl.to("#room-pill-press", { opacity: 0, duration: 0.25, ease: "power1.inOut" }, 2.02);

          window.__timelines["room"] = tl;
        })();
      </script>
    </template>
