<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>gigi launch</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/ref-keys.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f7f7f8; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f7f7f8; font-family: "Inter", system-ui, sans-serif; color: #0d0d0f; }
      .layer { position: absolute; inset: 0; }
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }

      /* background: near-white with slow, soft grey light */
      #bg { background: radial-gradient(120% 90% at 50% 40%, #ffffff 0%, #f6f6f7 55%, #ececee 100%); }
      .blob { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(90px); }
      #grain { opacity: .035; mix-blend-mode: multiply; }

      /* chat world (camera-transformed) */
      #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
      .bub { position: absolute; left: 0; top: 0; height: 176px; border-radius: 88px; white-space: nowrap;
        background: linear-gradient(180deg, #ffffff 0%, #fbfbfc 100%);
        box-shadow: 0 1px 1px rgba(10,10,14,.04), 0 12px 34px rgba(10,10,14,.075), 0 2px 6px rgba(10,10,14,.04), inset 0 0 0 1.5px rgba(10,10,14,.045);
        font-size: 76px; font-weight: 500; letter-spacing: -0.022em; line-height: 176px; color: #101013; transform-origin: 50% 50%; }
      .bub-probe { font-size: 76px; font-weight: 500; letter-spacing: -0.022em; }
      .bub .tail { position: absolute; left: -12px; bottom: 0; width: 52px; height: 44px; overflow: visible; }
      .bub .tail path { fill: #fbfbfc; }
      .bub .txt { position: absolute; left: 56px; top: 0; }
      .bub .w { display: inline-block; white-space: pre; }
      .bub .dots { position: absolute; left: 50%; top: 50%; display: flex; gap: 16px; transform: translate(-50%, -50%); }
      .bub .dots i { width: 30px; height: 30px; border-radius: 50%; background: #2a2a2e; display: block; }
      .bub.blue { background: linear-gradient(180deg, #5dabff 0%, #4498fb 55%, #3a8ff6 100%); color: #fff; transform-origin: 50% 50%;
        box-shadow: 0 14px 36px rgba(40,120,240,.26), 0 3px 8px rgba(40,120,240,.18), inset 0 1.5px 0 rgba(255,255,255,.22); }
      .bub.blue .tail { left: auto; right: -12px; transform: scaleX(-1); }
      .bub.blue .tail path { fill: #3b90f6; }
      .bub.blue .dots i { background: #fff; }
      .meta { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; font-size: 25px; font-weight: 500; color: #8b8b92; letter-spacing: -0.005em; display: flex; align-items: center; gap: 12px; }
      .meta .av { width: 38px; height: 38px; border-radius: 50%; background: #0d0d0f; color: #fff; font-size: 20px; font-weight: 700; display: grid; place-items: center; letter-spacing: 0; }
      #badge { position: absolute; left: -42px; top: -42px; width: 84px; height: 84px; border-radius: 50%; background: #fff; display: grid; place-items: center;
        box-shadow: 0 8px 22px rgba(10,10,14,.12), 0 1px 3px rgba(10,10,14,.08); }
      #badge img { width: 50px; height: 50px; }
      #badge::after { content: ""; position: absolute; left: -14px; bottom: -6px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(10,10,14,.1); }

      /* held message (screen space) */
      #held { position: absolute; left: 0; top: 0; }

      /* board */
      #board { position: absolute; left: 0; top: 0; }
      .col { position: absolute; top: 121px; width: 760px; height: 1240px; border-radius: 48px;
        background: linear-gradient(180deg, #ffffff 0%, #f7f7f8 60%, #f2f2f4 100%);
        box-shadow: 0 1px 1px rgba(10,10,14,.03), 0 18px 50px rgba(10,10,14,.06), inset 0 0 0 1.5px rgba(10,10,14,.05); }
      .col .hd { position: absolute; left: 40px; right: 34px; top: 34px; height: 56px; display: flex; align-items: center; gap: 16px; font-size: 31px; font-weight: 650; letter-spacing: -0.015em; color: #0d0d0f; }
      .col .hd .dot { width: 16px; height: 16px; border-radius: 50%; background: #0d0d0f; }
      .col .hd .dot.ring { background: transparent; box-shadow: inset 0 0 0 3.5px #0d0d0f; }
      .col .hd .dot.half { background: linear-gradient(90deg, #0d0d0f 50%, transparent 50%); box-shadow: inset 0 0 0 3px #0d0d0f; }
      .col .hd .cnt { min-width: 40px; height: 36px; padding: 0 12px; border-radius: 18px; background: #efeff1; color: #6d6d74; font-size: 22px; font-weight: 600; display: grid; place-items: center; }
      .col .hd .sp { flex: 1; }
      .col .hd svg { width: 34px; height: 34px; color: #9a9aa1; }
      .col .rule { position: absolute; left: 40px; right: 40px; top: 118px; height: 1.5px; background: #ececef; }
      .col .ghost { position: absolute; left: 24px; right: 24px; height: 150px; border-radius: 30px; border: 2px dashed #e4e4e8; }
      #card { position: absolute; left: 24px; top: 146px; width: 712px; height: 318px; border-radius: 34px; background: #fff; padding: 34px 38px;
        box-shadow: 0 1px 1px rgba(10,10,14,.04), 0 16px 40px rgba(10,10,14,.09), inset 0 0 0 1.5px rgba(10,10,14,.05); transform-origin: 50% 50%; }
      #card .tags { display: flex; gap: 12px; }
      #card .tag { height: 40px; padding: 0 18px; border-radius: 20px; font-size: 21px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      #card .tag.dark { background: #0d0d0f; color: #fff; }
      #card .tag.lite { background: #f0f0f2; color: #55555c; }
      #card .ttl { margin-top: 24px; font-size: 40px; font-weight: 650; letter-spacing: -0.022em; color: #0d0d0f; white-space: nowrap; }
      #card .bar { margin-top: 26px; height: 10px; border-radius: 5px; background: #eeeef0; overflow: hidden; }
      #card .bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: #0d0d0f; }
      #card .ft { margin-top: 24px; display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 500; color: #7c7c83; }
      #card .ft svg { width: 26px; height: 26px; }
      #card .ft .sp { flex: 1; }
      #card .ft .av { width: 44px; height: 44px; border-radius: 50%; background: #0d0d0f; color: #fff; font-size: 20px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 3px #fff; }

      /* cursor */
      #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #cursor svg { position: absolute; left: -6px; top: -4px; width: 62px; height: 70px; overflow: visible; filter: drop-shadow(0 6px 10px rgba(0,0,0,.22)); }
      #cursor .tagn { position: absolute; left: 44px; top: 58px; height: 42px; padding: 0 18px; border-radius: 21px; background: #0d0d0f; color: #fff; font-size: 22px; font-weight: 600; display: flex; align-items: center; white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
      #ripple { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; box-shadow: inset 0 0 0 3px #0d0d0f; }

      /* end line */
      #endline { position: absolute; left: 0; top: 0; white-space: nowrap; }
      .wm { position: relative; font-size: 236px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
      .wm .gh { color: #e3e3e6; }
      .wm .fill { position: absolute; left: 0; top: 0; background: linear-gradient(180deg, #2b2b30 0%, #050506 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="9.7667" data-width="1920" data-height="1080">
      <div class="fontwarm"><span style="font-weight:500">Aa</span><span style="font-weight:650">Aa</span><span style="font-weight:800">Aa</span></div>
      <div id="stage" class="layer"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
