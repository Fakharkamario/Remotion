            gr.addColorStop(0, `rgba(255,236,220,${0.75 * fl})`); gr.addColorStop(0.45, `rgba(255,200,170,${0.35 * fl})`); gr.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = gr; ctx.fillRect(0, 0, K.W, K.H);
            gr = ctx.createRadialGradient(cx - 200 * s, cy + 80 * s, 0, cx - 200 * s, cy + 80 * s, 480 * s);
            gr.addColorStop(0, `rgba(60,240,170,${0.6 * fl})`); gr.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = gr; ctx.fillRect(0, 0, K.W, K.H);
            ctx.restore();
          }
        }

        // ================================================================ cursor
        // [frame, x, y, pixel size, pointing left]
        const CUR = [[66, 1005, 10, 22], [67, 970, 195, 10], [68, 965, 295, 8], [69, 960, 365, 7], [70, 960, 405, 6.5], [71, 970, 440, 6.5], [72, 970, 465, 6.5], [73, 970, 490, 6.5], [74, 970, 505, 6.5], [75, 965, 520, 6.5], [76, 970, 525, 6.5], [77, 970, 535, 6.5], [80, 975, 530, 6.5], [81, 980, 545, 6.5], [83, 970, 540, 6.5], [84, 965, 540, 7], [85, 979, 566, 8.5], [86, 845, 500, 8.5], [87, 770, 460, 8.5], [88, 740, 440, 8.5], [89, 720, 435, 8.5], [90, 710, 425, 8.5], [91, 705, 425, 8.5], [94, 720, 425, 8.5], [95, 740, 420, 8.5], [96, 760, 420, 8.5], [97, 785, 410, 8.5], [98, 825, 400, 8.5], [99, 870, 390, 8.5], [100, 920, 385, 8.5], [101, 980, 365, 8.5], [102, 1035, 350, 8.5], [103, 1075, 315, 8.5], [104, 1270, 280, 8], [105, 1600, 635, 7, 1], [106, 1190, 1010, 7, 1], [107, 800, 1025, 7, 1], [108, 580, 885, 6.5, 1], [109, 470, 725, 6.5, 1], [110, 410, 570, 6.5, 1], [111, 380, 470, 6.5, 1], [112, 375, 390, 6.5, 1], [113, 360, 340, 6.5, 1], [114, 360, 305, 6.5, 1], [115, 360, 255, 6.5, 1], [116, 365, 185, 6.5, 1], [117, 415, 75, 6.5, 1]];
        function cursor(ctx, f) {
          if (f < 66 || f > 117) return;
          const [, x, y, px, left] = at(CUR, f);
          const glowR = f < 105 ? 330 : 230;
          K.ember(ctx, x, y + 40, glowR, "#F2501E", f < 69 ? 0.75 : 0.6);
          K.ember(ctx, x, y + 30, glowR * 0.45, "#FF9A50", 0.35);
          K.tglow(ctx, (g) => {
            // pixel trail
            if (f >= 67 && f <= 70) K.pixelCloud(g, x + 5, y - 85 + (f - 67) * 6, 46, 13, 300 + f, C.orange2, 1);
            if (f >= 86 && f <= 88) K.pixelCloud(g, x + 120 - (f - 86) * 30, y + 10, 30, 12, 310 + f, C.orange2, 1);
            if (f >= 100 && f <= 104) K.pixelCloud(g, x - 30, y + 30, 34, 14, 320 + f, C.orange2, 0.9);
            if (left && f >= 106) {
              K.pixelCloud(g, x + 60, y + 100, 30, 14, 330 + f, C.orange2, 0.9);
              if (f >= 110) K.pixelCloud(g, x + 30, y + 230, 26, 14, 340 + f, C.orange, 0.8);
            }
            K.hand(g, x, y, px, { rot: left ? -Math.PI / 2 : 0, alpha: 1 });
          }, { blur: 14, alpha: 0.8, color: "#FF6A1E" });
        }

        // ============================================================ pixel letters
        // [frame, char, x, y, cell]
        const PL = [
          [116, "N", 1385, 275, 82], [117, "O", 165, 675, 60], [118, "A", 330, 925, 44], [119, "V", 575, 0, 50], [119, "N", 1040, 1010, 40],
          [120, "A", 330, 380, 44], [120, "O", 880, 400, 56], [120, "N", 1205, 700, 64], [121, "$", 1135, 745, 44], [122, "A", 975, 490, 32], [122, "N", 565, 930, 40],
        ];
        const SQ = { 117: [[440, 600, 60]], 118: [[700, 1000, 70], [900, 1040, 60]], 119: [[1030, 420, 60], [1110, 560, 54]], 121: [[905, 500, 90], [1430, 1010, 110]], 122: [[950, 420, 70], [960, 790, 70]] };
        function pixels(ctx, f) {
          if (f < 116) return;
          K.tglow(ctx, (g) => {
            PL.forEach(([a, ch, x, y, c], i) => { if (a === f) K.pixelLetter(g, ch, x, y, c, "#FF8A4A", { seed: 7 + i, drop: 0.05 }); });
            (SQ[f] || []).forEach(([x, y, s]) => { g.fillStyle = "#FF6A2E"; g.fillRect(x - s / 2, y - s / 2, s, s); });
          }, { blur: 22, alpha: 0.9, color: "#FF5A1A" });
        }

        K.mount("market", 21, 102, (ctx, f, cv) => {
          if (f <= 43) {
            table(ctx, f);
            const df = K.step([[21, 2], [22, 1], [23, 0], [41, 1.5], [42, 3], [43, 6]])(f);
            K.defocus(cv, df);
            K.bloom(cv, f <= 23 ? 0.55 : 0.32, 70);
            K.vignette(ctx, 0.5);
            K.grain(ctx, f, 0.07);
            return;
          }
          K.fill(ctx, "#110705");
          if (f === 44) {
            // near black: the field's grid only hints through
            K.ember(ctx, 960, 540, 900, "#3A1A10", 0.4);
            ctx.save(); ctx.strokeStyle = "rgba(120,90,70,0.25)"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(560, 0); ctx.lineTo(600, 1080); ctx.stroke(); ctx.restore();
            K.vignette(ctx, 0.6);
            K.grain(ctx, f, 0.06);
            return;
          }
          if (f <= 65) {
            // the streaming field
            const cy = camY(f), cx = camX(f);
            gridBg(ctx, cx, cy, 1, 0, 1);
            K.ember(ctx, 960, 560, 900, "#7A2A10", 0.18);
            const fade = f === 45 ? 0.55 : 1;
            const fieldA = 1 - K.inv(62, 66, f);
            K.tglow(ctx, (g) => {
              g.globalAlpha = fade * fieldA;
              FIELD.forEach((t) => {
                const x = t.x + cx * t.d, y = ((t.y + cy * t.d) % 2430 + 2430) % 2430 - 300;
                if (x < -200 || x > 2120 || y < -200 || y > 1280) return;
                K.token(g, t.n, x, y, t.s, { outline: t.n === "bolt" ? "#9C8CF0" : GREEN, rot: t.r, badgeGlyph: t.n === "bolt" ? "+" : null, badgeFill: t.n === "bolt" ? "#2A2260" : null });
              });
              NEAR.forEach((t) => { const p = nearPos(t, f); if (p) K.token(g, t[0], p[0], p[1], t[1], { outline: GREEN, rot: 0.02 }); });
              // the big chevron tile rises in and joins the pile
              const CH = { 61: [590, 1010, 430], 62: [610, 697, 400], 63: [647, 350, 385], 64: [727, 325, 335], 65: [817, 637, 265] };
              if (CH[f]) K.token(g, "chev", CH[f][0], CH[f][1], CH[f][2], { outline: GREEN, rot: -0.03 });
            }, { blur: 14, alpha: 0.55, color: "#FF7A2A" });
            if (f >= 61) cluster(ctx, f, 0);
            if (f === 45) {
              // a sliver of the page still overhead
              ctx.save(); ctx.fillStyle = "rgba(14,8,6,0.92)"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1920, 0); ctx.lineTo(1920, 470); ctx.lineTo(0, 390); ctx.fill();
              ctx.strokeStyle = "rgba(120,90,70,0.5)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 390); ctx.lineTo(1920, 470); ctx.stroke();
              K.text(ctx, "List 1  ⌄", -20, 485, { size: 46, weight: 500, color: "rgba(240,225,215,0.75)", ls: 0 });
              ctx.restore();
            }
            K.bloom(cv, 0.25, 60);
            K.vignette(ctx, 0.55);
            K.grain(ctx, f, 0.07);
            return;
          }
          // pile, panel, cursor
          const cam = CAM[f];
          gridBg(ctx, cam[2] + camX(65), cam[3] + camY(65), cam[0], cam[1], 1);
          const hot = K.step([[0, 0], [77, 1], [85, 0]])(f);
          cluster(ctx, f, hot);
          panel(ctx, f);
          cursor(ctx, f);
          pixels(ctx, f);
          K.bloom(cv, 0.3, 70);
          K.vignette(ctx, 0.55);
          K.grain(ctx, f, 0.07);
        }, 0);
      })();
    </script>
  </div>
</template>
