<template id="watch-template">
  <div data-composition-id="watch" data-width="1920" data-height="1080" data-duration="1.04">
    <div class="full cream"></div>
    <div id="wa-cam" class="full">
      <div id="wa-pl"></div>
      <div id="wa-line" class="line"></div>
    </div>

    <style>
      #wa-cam { transform-origin: 960px 540px; }
      #wa-line { top: 506px; font-size: 64px; letter-spacing: -0.015em; }
      #wa-line .serif { font-size: 1.08em; }
      #wa-pl { position: absolute; left: 0; top: 0; width: 54px; height: 54px; }
      #wa-pl svg { width: 100%; height: 100%; display: block; overflow: visible; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C;
        document.getElementById("wa-pl").innerHTML = FX.plane(C.orange, 1.6);

        const s = FX.line(document.getElementById("wa-line"), ["Replay", "the", "whole", { t: "session", cls: "serif" }]);
        FX.wordIn(tl, s[0], 0.0, { dy: 0, lead: 0, open: 0.01, hold: 0.06, settle: 0.04 });
        FX.wordIn(tl, s[1], 0.2, { dy: 0.15, lead: 0.05, open: 0.1, hold: 0.12, settle: 0.04 });
        FX.wordIn(tl, s[2], 0.26, { dy: 0.15, lead: 0.05, open: 0.1, hold: 0.12, settle: 0.04 });
        FX.wordIn(tl, s[3], 0.4, { dy: 0.25, lead: 0.05, open: 0.12, hold: 0.2, settle: 0.06, to: null });
        tl.to(s[3].firstElementChild, { color: "#c76a48", duration: 0.2 }, 0.6);

        // camera starts very close on the first word and pulls back as the line completes
        tl.fromTo("#wa-cam", { scale: 3.4, x: 210 }, { scale: 2.55, x: 120, duration: 0.2, ease: "power2.out" }, 0);
        tl.to("#wa-cam", { scale: 1.75, x: 40, duration: 0.2, ease: "power2.out" }, 0.2);
        tl.to("#wa-cam", { scale: 1.0, x: 0, duration: 0.22, ease: "power2.out" }, 0.4);
        tl.to("#wa-cam", { scale: 0.98, duration: 0.42, ease: "none" }, 0.62);

        // the paper plane drifts in over the words, turning as it goes, then shrinks away
        const pl = document.getElementById("wa-pl");
        tl.set(pl, { x: 560, y: 380, rotation: 45, scale: 1 }, 0);
        tl.to(pl, { x: 790, y: 395, rotation: -10, duration: 0.2, ease: "none" }, 0);
        tl.to(pl, { x: 1070, y: 440, rotation: -25, scale: 0.7, duration: 0.2, ease: "none" }, 0.2);
        tl.to(pl, { x: 1150, y: 468, rotation: -40, scale: 0.35, duration: 0.2, ease: "none" }, 0.4);
        tl.to(pl, { scale: 0, duration: 0.1 }, 0.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["watch"] = tl;
      })();
    </script>
  </div>
</template>
