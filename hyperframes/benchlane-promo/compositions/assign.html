<template id="assign-template">

        <div class="ov">

            <div class="sh-cats"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <div class="sh-cards"><span style="--a:#d9a066;--b:#7d9a4f"></span><span style="--a:#e7c38b;--b:#c55a3a"></span><span style="--a:#8fb36b;--b:#e0b25a"></span><span style="--a:#c86f4e;--b:#f0d3a2"></span></div>

        </div>
      </div>
    </div>

    <div id="as-cur" class="cursor"></div>
    <div id="as-tag" class="tag you">You</div>

    <style>
      .as-word { position: absolute; top: 512px; font-size: 44px; color: #16110D; white-space: nowrap; letter-spacing: -0.01em; }
      #as-w1 { left: 552px; }
      #as-w2 { left: 1224px; }
      #as-tile { position: absolute; left: 832px; top: 394px; width: 292px; height: 292px; border-radius: 64px; background: #fdf6ef;
        border: 3px solid #f2d9cb; box-shadow: 0 18px 30px rgba(150, 80, 50, 0.16), inset 0 -6px 0 rgba(240, 210, 192, 0.6); transform-origin: 50% 50%; }
      #as-tile .ico { position: absolute; left: 22%; top: 22%; width: 56%; height: 56%; }
      #as-tile .ico svg { width: 100%; height: 100%; display: block; }

      #as-plane { position: absolute; left: 140px; top: -40px; width: 1640px; height: 600px; border-radius: 26px; background: #fbf3ea;
        border: 2px solid #ecdfd3; box-shadow: 0 30px 60px rgba(120, 70, 40, 0.1); transform-origin: 50% 0%; }

      #as-win { position: absolute; left: 176px; top: 96px; width: 1568px; height: 900px; border-radius: 22px; overflow: hidden; background: #fbf5ee;
        border: 2px solid #ece0d5; box-shadow: 0 20px 50px rgba(120, 70, 40, 0.12); opacity: 0; transform-origin: 50% 40%; }
      #as-win .hdr { height: 88px; background: #120d0a; color: #efe6de; display: flex; align-items: center; padding-left: 36px; font-size: 22px; gap: 12px; }
      #as-win .hdr i { width: 32px; height: 32px; border-radius: 50%; background: #EA5E39; display: block; }
      #as-win .hdr span { color: #8b7f77; }
      #as-win .hdr em { font-style: normal; font-size: 15px; color: #c9e46a; border: 1.5px solid #c9e46a; border-radius: 99px; padding: 2px 12px; }
      #as-win .pg { padding: 22px 48px; }
      #as-win .crumb { font-size: 16px; color: #9a8f86; border-bottom: 1px solid #ece2d8; padding-bottom: 14px; }
      #as-win .ttl { font-size: 36px; font-weight: 500; margin-top: 26px; letter-spacing: -0.01em; }
      #as-win .sub { font-size: 20px; color: #6d625a; margin-top: 12px; }
      #as-win .ov { position: relative; margin-top: 34px; height: 640px; border-radius: 18px; background: #f2ebe3; padding: 26px 32px; overflow: hidden; }
      #as-win .ovh { font-size: 22px; color: #EA5E39; }
      #as-win .ovt { font-size: 17px; line-height: 1.75; color: #3c332d; margin-top: 14px; }
      #as-win .shot { position: absolute; left: 32px; right: 32px; top: 250px; height: 420px; background: #fff; border-radius: 16px; padding: 22px 30px; }
      .sh-top { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; color: #e0603f; }
      .sh-top i { width: 30px; height: 30px; border-radius: 9px; background: #e0603f; display: block; }
      .sh-top .srch { margin-left: auto; margin-right: auto; font-size: 17px; font-weight: 400; color: #8f857d; border: 1.5px solid #e6dcd3; border-radius: 99px; padding: 14px 140px 14px 30px; }
      .sh-top .btn { width: 44px; height: 44px; border-radius: 50%; background: #e0603f; }
      .sh-cats { display: flex; gap: 40px; margin: 30px 10px 0; }
      .sh-cats span { width: 54px; height: 54px; border-radius: 14px; background: #f1e9e1; }
      .sh-cards { display: flex; gap: 22px; margin-top: 30px; }
      .sh-cards span { flex: 1; height: 160px; border-radius: 14px; background: linear-gradient(135deg, var(--a), var(--b)); }
      #as-mos { position: absolute; inset: 230px 0 0 0; }
      #as-mos canvas { position: absolute; inset: 0; }
      #as-ring { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      #as-ring svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

      #as-close { opacity: 0; }
      #as-cl-cam { transform-origin: 1000px 420px; }
      #as-close .band { position: absolute; left: -40px; top: 228px; width: 1760px; height: 330px; background: #0f0b08; border-radius: 0 44px 0 0; overflow: hidden; }
      #as-close .warm { position: absolute; inset: 0; opacity: 0; background: linear-gradient(90deg, rgba(15, 11, 8, 0) 30%, rgba(110, 45, 25, 0.75) 80%, rgba(70, 30, 18, 0.6) 100%); }
      #as-close .strip { position: absolute; left: -40px; top: 558px; width: 1760px; height: 132px; background: #efe8e0; border-right: 2px solid #e7ddd3; }
      #as-close .big { position: absolute; left: 14px; top: 860px; font-size: 76px; color: #4b4039; }
      #as-pill { position: absolute; left: 1086px; top: 392px; height: 172px; width: 1060px; border-radius: 30px; background: #fff;
        overflow: hidden; display: flex; align-items: center; justify-content: center; }
      #as-pill span { font-size: 60px; color: #1d1712; white-space: nowrap; letter-spacing: -0.01em; }
      #as-av { position: absolute; left: 1086px; top: 392px; }
      .av { position: absolute; top: -95px; width: 190px; height: 190px; border-radius: 50%; background: #fbf5ef; display: flex; align-items: center; justify-content: center;
        border: 4px solid #2a1c15; opacity: 0; }
      .av > div { width: 70%; height: 70%; display: flex; align-items: center; justify-content: center; font-size: 120px; font-weight: 300; color: #fff; line-height: 1; }
      .av svg { width: 100%; height: 100%; }
      .av.a1 { left: -330px; }
      .av.a2 { left: -130px; }
      .av.a3 { left: 70px; background: #4a3027; border-color: #4a3027; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C;
        const root = document.getElementById("as-stage").parentElement;
        const $ = (s) => root.querySelector(s);
        $(".av.a1 > div").innerHTML = FX.icons.ripple;
        $(".av.a2 > div").innerHTML = FX.icons.atom.replace('stroke="#fff"', 'stroke="#1b1410"').replace('fill="#fff"', 'fill="#1b1410"');

        // clipboard glyph (original) for the project tile
        $("#as-tile .ico").innerHTML = `<svg viewBox="0 0 100 100" fill="none" stroke="#EA5E39" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
          <rect x="18" y="16" width="64" height="74" rx="12"/><path d="M38 10h24v14H38z" fill="#EA5E39"/><path d="M34 54l11 11 22-22"/></svg>`;

        const cur = $("#as-cur"), tag = $("#as-tag");
        cur.innerHTML = FX.cursor("#16110D", "#16110D");
        tl.set(cur, { x: 1314, y: 888, scale: 1, transformOrigin: "0 0" }, 0);
        tl.set(tag, { x: 1520, y: 1030, transformOrigin: "0 0" }, 0);

        // ---- cursor glides to the tile, clicks
        tl.to(cur, { x: 1060, y: 606, duration: 0.5, ease: "power2.out" }, 0.02);
        tl.to(tag, { x: 1096, y: 650, duration: 0.62, ease: "power2.out" }, 0.04);
        tl.to("#as-tile", { scale: 0.95, rotation: -4, duration: 0.06, ease: "power2.out" }, 0.55);
        tl.to("#as-tile", { scale: 1, rotation: -3, duration: 0.1, ease: "power2.out" }, 0.62);

        // ---- tile swells, words make room
        tl.to("#as-tile", { scale: 1.85, rotation: 0, y: -40, duration: 0.42, ease: "power2.inOut" }, 0.66);
        tl.to("#as-w1", { x: -92, duration: 0.42, ease: "power2.inOut" }, 0.66);
        tl.to("#as-w2", { x: 84, duration: 0.42, ease: "power2.inOut" }, 0.66);
        tl.to(cur, { x: 1180, y: 690, scale: 1.6, duration: 0.42, ease: "power2.inOut" }, 0.66);
        tl.to(tag, { x: 1240, y: 760, scale: 1.7, duration: 0.42, ease: "power2.inOut" }, 0.66);

        // ---- the brief window drops in from above in perspective
        tl.set("#as-win3d", { opacity: 1 }, 0.98);
        tl.fromTo("#as-plane", { rotationX: -58, y: -560, scale: 0.95 }, { rotationX: 0, y: 136, scale: 1, height: 860, duration: 0.42, ease: "power2.out" }, 0.98);
        tl.set("#as-w1", { color: C.orange }, 1.12);
        tl.to("#as-w1", { opacity: 0, duration: 0.08 }, 1.14);
        tl.set("#as-w2", { color: C.orange }, 1.22);
        tl.to("#as-w2", { opacity: 0, duration: 0.1 }, 1.25);
        tl.to("#as-tile", { scale: 1.42, y: -150, duration: 0.42, ease: "power2.out" }, 1.08);
        tl.to(cur, { x: 1096, y: 530, scale: 1.3, duration: 0.42, ease: "power2.out" }, 1.08);
        tl.to(tag, { x: 1130, y: 570, scale: 1.4, duration: 0.42, ease: "power2.out" }, 1.08);

        // ---- flat window; tile becomes a pixel ring that blooms into the page
        tl.set("#as-win", { opacity: 1, scale: 1.0 }, 1.4);
        tl.set(["#as-win3d", "#as-stage"], { opacity: 0 }, 1.4);
        tl.set("#as-win .pg", { opacity: 0 }, 0);
        tl.set("#as-win .pg", { opacity: 1 }, 1.72);
        const ring = $("#as-ring");
        ring.innerHTML = FX.pixelRing(1096, 504, 36, 9, 4, C.orange, 8, 0);
        tl.set(ring, { opacity: 1, scale: 0.7 }, 1.48);
        tl.to(ring, { scale: 1.45, duration: 0.19, ease: "none" }, 1.5);
        tl.set(ring.querySelectorAll("rect"), { attr: { fill: "#dff04a" } }, 1.65);
        tl.set(ring, { opacity: 0 }, 1.72);
        tl.to(cur, { x: 1010, y: 650, scale: 0.75, duration: 0.3, ease: "power2.out" }, 1.48);
        tl.to(tag, { x: 1050, y: 676, scale: 0.75, duration: 0.3, ease: "power2.out" }, 1.48);

        // ---- page content resolves
        tl.fromTo("#as-win .ttl", { color: C.orange }, { color: C.ink, duration: 0.08 }, 1.95);
        tl.from("#as-win .sub", { opacity: 0, duration: 0.05 }, 1.8);
        tl.set(["#as-win .ovh", "#as-win .ovt"], { opacity: 0 }, 0);
        tl.set(["#as-win .ovh", "#as-win .ovt"], { opacity: 1 }, 1.84);
        tl.fromTo("#as-win .ovt", { color: C.orange }, { color: "#3c332d", duration: 0.08 }, 1.98);
        tl.set("#as-win .shot", { opacity: 0 }, 0);
        tl.set("#as-win .shot", { opacity: 1 }, 2.02);
        const mos = $("#as-mos");
        const mk = (seed, cut) =>
          FX.mosaic(1500, 420, 30, seed, (x, y, r) => {
            const k = x / 1500;
            if (k < cut) return null;
            const a = Math.min(1, (k - cut) * 2.4) * (0.55 + r() * 0.45);
            return `rgba(${235 + Math.round(r() * 15)},${120 + Math.round(r() * 60)},${100 + Math.round(r() * 50)},${a.toFixed(2)})`;
          });
        const m1 = mos.appendChild(mk(3, 0.0)), m2 = mos.appendChild(mk(4, 0.35)), m3 = mos.appendChild(mk(5, 0.7));
        tl.set([m1, m2, m3], { opacity: 0 }, 0);
        tl.set(m1, { opacity: 1 }, 1.84);
        tl.set(m1, { opacity: 0 }, 2.02);
        tl.set(m2, { opacity: 1 }, 2.02);
        tl.set(m2, { opacity: 0 }, 2.14);
        tl.set(m3, { opacity: 1 }, 2.14);
        tl.to(m3, { opacity: 0, duration: 0.12 }, 2.24);
        tl.to("#as-win", { scale: 1.04, y: -8, duration: 0.33, ease: "power1.out" }, 1.74);
        tl.to("#as-win", { scale: 1.11, x: -28, y: -2, duration: 0.57, ease: "sine.in" }, 2.07);
        tl.to(cur, { x: 1500, y: 1040, duration: 0.55, ease: "power1.inOut" }, 2.05);
        tl.to(tag, { x: 1540, y: 1080, duration: 0.55, ease: "power1.inOut" }, 2.08);

        // ---- whip into the header
        tl.to("#as-win", { scale: 2.8, x: 380, y: 260, duration: 0.07, ease: "power2.in" }, 2.62);
        tl.set("#as-win", { opacity: 0 }, 2.69);
        tl.set([cur, tag], { opacity: 0 }, 2.64);
        tl.set("#as-close", { opacity: 1 }, 2.69);
        tl.fromTo("#as-cl-cam", { scale: 1.18, x: 40, y: -40 }, { scale: 1.0, x: 0, y: 0, duration: 0.16, ease: "power2.out" }, 2.69);
        tl.to("#as-cl-cam", { y: 70, x: -60, scale: 1.04, duration: 0.6, ease: "power1.out" }, 2.85);
        tl.to("#as-cl-cam", { y: 40, x: -70, scale: 1.0, duration: 0.85, ease: "sine.inOut" }, 3.45);

        // pill opens from the centre
        tl.set("#as-pill", { xPercent: -50, yPercent: -50 }, 0);
        tl.fromTo("#as-pill", { width: 500 }, { width: 1060, duration: 0.18, ease: "power2.out" }, 2.69);

        // white cursor comes in and clicks
        const c2 = document.createElement("div");
        c2.className = "cursor";
        c2.innerHTML = FX.cursor("#fff", "#16110D");
        root.querySelector("#as-cl-cam").appendChild(c2);
        tl.set(c2, { x: 1500, y: 980, scale: 1.25, transformOrigin: "0 0", opacity: 0 }, 0);
        tl.set(c2, { opacity: 1 }, 2.9);
        tl.to(c2, { x: 1170, y: 520, duration: 0.5, ease: "power2.out" }, 2.9);
        tl.to("#as-pill", { scale: 0.97, duration: 0.05 }, 3.45);
        tl.to("#as-pill", { scale: 1, duration: 0.06 }, 3.5);
        tl.to("#as-pill", { backgroundColor: "#f3a185", duration: 0.05 }, 3.47);
        tl.to("#as-pill span", { color: "rgba(255,255,255,0.55)", duration: 0.05 }, 3.47);
        tl.to("#as-pill", { backgroundColor: C.orange, duration: 0.05 }, 3.56);
        tl.to("#as-pill span", { color: "#fff", duration: 0.05 }, 3.56);

        // pill collapses into agent avatars
        tl.to("#as-pill span", { opacity: 0, duration: 0.03 }, 3.64);
        tl.to("#as-pill", { width: 380, x: -140, height: 190, borderRadius: 95, duration: 0.06, ease: "power2.in" }, 3.64);
        tl.set("#as-pill", { opacity: 0 }, 3.7);
        const avs = root.querySelectorAll(".av");
        tl.set(avs[0], { opacity: 1, backgroundColor: C.orange, scale: 0.95 }, 3.7);
        tl.set(avs[1], { opacity: 1, backgroundColor: C.orange, scale: 0.95 }, 3.7);
        tl.set(avs[0].firstElementChild, { opacity: 0 }, 0);
        tl.set(avs[1].firstElementChild, { opacity: 0 }, 0);
        tl.to(avs[0], { backgroundColor: "#fbf5ef", scale: 1, duration: 0.05 }, 3.74);
        tl.set(avs[0].firstElementChild, { opacity: 1 }, 3.76);
        tl.to(avs[1], { backgroundColor: "#fbf5ef", scale: 1, duration: 0.05 }, 3.8);
        tl.set(avs[1].firstElementChild, { opacity: 1 }, 3.82);
        tl.set(avs[2].firstElementChild, { opacity: 0 }, 0);
        tl.fromTo(avs[2], { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.06 }, 3.8);
        tl.set(avs[2].firstElementChild, { opacity: 1 }, 3.86);
        tl.to("#as-close .warm", { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.66);
        tl.to(c2, { x: 1110, y: 540, duration: 0.6, ease: "sine.inOut" }, 3.7);

        window.__timelines = window.__timelines || {};
        window.__timelines["assign"] = tl;
      })();
    </script>
  </div>
</template>
