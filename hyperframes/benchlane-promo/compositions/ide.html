<template id="ide-template">
  <div data-composition-id="ide" data-width="1920" data-height="1080" data-duration="2.53">
    <div class="full dark"></div>
    <div id="id-cam" class="full">
      <div id="id-side">
        <div class="rail"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="tree"></div>
      </div>
      <div id="id-ed">
        <div class="tabs"><span class="on">usePantryScan.ts</span><span>useCamera.ts</span></div>
        <div class="code"><div id="id-hl"></div><div id="id-lines"></div></div>
      </div>
      <div id="id-ag">
        <div class="head"><div class="bot"></div><div class="tips"><b>Getting started</b><br>Run /init to create a<br>FORGE.md file with<br>project notes</div><div class="ver"><b>forge-cli</b> v3.4.0</div></div>
        <div class="log"><div id="id-log"></div></div>
        <div class="in">&gt;</div>
      </div>
    </div>

    <style>
      #id-cam { transform-origin: 960px 400px; font-family: "JetBrains Mono", monospace; }
      #id-side { position: absolute; left: 0; top: 0; width: 380px; bottom: 0; background: #0f0b09; border-right: 1.5px solid rgba(255, 255, 255, 0.06); }
      #id-side .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 52px; border-right: 1px solid rgba(255, 255, 255, 0.05); padding-top: 18px; }
      #id-side .rail i { display: block; width: 20px; height: 20px; margin: 0 auto 22px; border: 2px solid #4a423d; border-radius: 5px; }
      #id-side .tree { position: absolute; left: 66px; top: 16px; font-size: 19px; line-height: 2; color: #a1968e; white-space: pre; }
      #id-side .tree .m { color: #e3c64a; }
      #id-side .tree .d { color: #e86a4a; }
      #id-ed { position: absolute; left: 400px; top: 14px; width: 760px; bottom: 0; background: #130e0b; border: 1.5px solid rgba(255, 255, 255, 0.07); border-radius: 12px 12px 0 0; overflow: hidden; }
      #id-ed .tabs { height: 44px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 14px; color: #6f665f; display: flex; gap: 28px; padding-left: 20px; align-items: center; }
      #id-ed .tabs .on { color: #e7ded6; }
      #id-ed .code { position: absolute; left: 0; right: 0; top: 45px; bottom: 0; overflow: hidden; }
      #id-lines { padding: 14px 0 0 0; font-size: 18px; line-height: 34px; color: #d8cfc7; white-space: pre; }
      #id-lines .ln { display: inline-block; width: 54px; text-align: right; color: #4f4741; margin-right: 22px; }
      #id-lines .k { color: #c792ea; } #id-lines .s { color: #c3e88d; } #id-lines .f { color: #82aaff; } #id-lines .c { color: #5c544e; } #id-lines .n { color: #f78c6c; }
      #id-hl { position: absolute; left: 0; right: 0; top: 0; height: 34px; background: rgba(255, 255, 255, 0.05); }
      #id-ag { position: absolute; left: 1180px; top: 14px; width: 726px; bottom: 0; background: #130e0b; border: 1.5px solid rgba(255, 255, 255, 0.07); border-radius: 12px 12px 0 0; overflow: hidden; }
      #id-ag .head { margin: 14px; height: 200px; border: 1.5px solid rgba(234, 94, 57, 0.55); border-radius: 10px; position: relative; }
      #id-ag .bot { position: absolute; left: 40px; top: 30px; width: 160px; height: 137px; }
      #id-ag .bot svg { width: 100%; height: 100%; }
      #id-ag .tips { position: absolute; left: 330px; top: 22px; font-size: 16px; line-height: 1.55; color: #8f857e; border-left: 1px solid rgba(234, 94, 57, 0.4); padding-left: 20px; }
      #id-ag .tips b { color: #e86a4a; font-weight: 400; }
      #id-ag .ver { position: absolute; left: 96px; bottom: 10px; font-size: 11px; color: #5d5650; }
      #id-ag .ver b { color: #c4573a; font-weight: 400; }
      #id-ag .log { position: absolute; left: 0; right: 0; top: 226px; bottom: 74px; overflow: hidden; }
      #id-log { padding: 8px 26px; font-size: 17px; line-height: 31px; color: #8f857e; white-space: pre; }
      #id-log .y::before { content: "\25CF  "; color: #e3c64a; } #id-log .g::before { content: "\25CF  "; color: #63c76a; }
      #id-log .p::before { content: "> "; color: #b9a4f7; } #id-log .o::before { content: "\2731  "; color: #e86a4a; }
      #id-log b { color: #e9e0d8; font-weight: 400; }
      #id-log .sub { padding-left: 26px; color: #6b625b; }
      #id-ag .in { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 48px; border: 1.5px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #7c726b; font-size: 15px; line-height: 46px; padding-left: 16px; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C;
        document.querySelector("#id-ag .bot").innerHTML = FX.mascot(C.orange);
        document.querySelector("#id-side .tree").innerHTML = [
          "▾ WORKSPACE", "  › api", "  › web", "  › scripts", "  › tests", '  › <span class="m">vision</span>', "  › infra", "    .env.example", '    <span class="d">.gitignore</span>', "    BACKLOG.md", "    FORGE.md", "    README.md",
        ].join("\n");

        const K = (s) => `<span class="k">${s}</span>`, S = (s) => `<span class="s">${s}</span>`, Fn = (s) => `<span class="f">${s}</span>`, N = (s) => `<span class="n">${s}</span>`, Cm = (s) => `<span class="c">${s}</span>`;
        const code = [
          `${K("import")} { useRef, useState, useTransition } ${K("from")} ${S("'react'")};`,
          `${K("import")} { detectItems } ${K("from")} ${S("'../vision/detect'")};`,
          `${K("import")} { matchRecipes } ${K("from")} ${S("'../lib/recipes'")};`,
          `${K("import type")} { PantryItem } ${K("from")} ${S("'./types'")};`,
          ``,
          `${K("export const")} ${Fn("usePantryScan")} = () => {`,
          `  ${K("const")} frameRef = ${Fn("useRef")}&lt;Blob | ${K("null")}&gt;(${K("null")});`,
          `  ${K("const")} [items, setItems] = ${Fn("useState")}&lt;PantryItem[]&gt;([]);`,
          `  ${K("const")} [isPending, startTransition] = ${Fn("useTransition")}();`,
          ``,
          `  ${Cm("// debounce frames so the model isn't flooded")}`,
          `  ${K("const")} ${Fn("onFrame")} = ${K("async")} (frame: Blob) =&gt; {`,
          `    frameRef.current = frame;`,
          `    ${K("await")} ${Fn("sleep")}(${N("350")});`,
          `    ${K("if")} (frameRef.current !== frame) ${K("return")};`,
          `    ${K("const")} found = ${K("await")} ${Fn("detectItems")}(frame);`,
          `    ${Fn("startTransition")}(() =&gt; {`,
          `      ${Fn("setItems")}((prev) =&gt; ${Fn("merge")}(prev, found));`,
          `    });`,
          `  };`,
          ``,
          `  ${K("const")} recipes = ${Fn("matchRecipes")}(items, { maxMinutes: ${N("30")} });`,
          ``,
          `  ${K("return")} {`,
          `    items, recipes, isPending, onFrame,`,
          `  };`,
          `};`,
          ``,
          `${K("function")} ${Fn("merge")}(a: PantryItem[], b: PantryItem[]) {`,
          `  ${K("const")} seen = ${K("new")} ${Fn("Set")}(a.map((i) =&gt; i.id));`,
          `  ${K("return")} [...a, ...b.${Fn("filter")}((i) =&gt; !seen.${Fn("has")}(i.id))];`,
          `}`,
          ``,
          `${K("const")} ${Fn("sleep")} = (ms: ${K("number")}) =&gt; ${K("new")} ${Fn("Promise")}((r) =&gt; ${Fn("setTimeout")}(r, ms));`,
        ];
        document.getElementById("id-lines").innerHTML = code.map((l, i) => `<div><span class="ln">${i + 1}</span>${l}</div>`).join("");

        const log = [
          ["", ""], ["o", "ok — adding a camera hook and a vision call."], ["sub", "dev server needs HTTPS for the camera"], ["", ""],
          ["y", "Bash <b>npm i -D @vitejs/plugin-basic-ssl</b>"], ["sub", "added 1 package, 0 vulnerabilities"], ["", ""],
          ["y", "Update <b>vite.config.ts</b>"], ["sub", "+ import basicSsl from '@vitejs/plugin-basic-ssl'"], ["sub", "+ plugins: [react(), basicSsl()]"], ["", ""],
          ["", "done — dev server now runs on"], ["", "https://localhost:5173"], ["", ""],
          ["p", "add pantry scanner — camera → vision model."], ["", "  skip auth for now"], ["", ""],
          ["y", "Bash <b>mkdir -p src/hooks src/vision</b>"], ["sub", "created · 2 dirs"], ["", ""], ["sub", "Thinking"], ["", ""],
          ["y", "Update <b>src/hooks/usePantryScan.ts</b>"], ["sub", "+ debounce frames → 350ms"], ["sub", "+ merge detected items by id"], ["", ""], ["g", "<b>typecheck passed</b>"], ["", ""],
        ];
        document.getElementById("id-log").innerHTML = log.map(([c, t]) => `<div class="${c}">${t || " "}</div>`).join("");
        const logLines = Array.from(document.getElementById("id-log").children);
        tl.set(logLines.slice(14), { opacity: 0 }, 0);
        logLines.slice(14).forEach((el, i) => tl.set(el, { opacity: 1 }, 0.25 + i * 0.13));
        tl.fromTo("#id-log", { y: 0 }, { y: -250, duration: 2.3, ease: "none" }, 0.2);

        // editor: selection band walks down while the file scrolls
        tl.set("#id-hl", { y: 14 + 34 * 9 }, 0);
        [11, 12, 15, 16, 17, 21, 22, 24].forEach((ln, i) => tl.set("#id-hl", { y: 14 + 34 * ln }, 0.2 + i * 0.27));
        tl.fromTo("#id-lines", { y: 0 }, { y: -170, duration: 2.4, ease: "sine.inOut" }, 0.1);

        // slow push-in, then a quicker one before the cut
        tl.fromTo("#id-cam", { scale: 1 }, { scale: 1.04, duration: 1.9, ease: "none" }, 0);
        tl.to("#id-cam", { scale: 1.1, y: -40, duration: 0.6, ease: "power2.in" }, 1.93);

        window.__timelines = window.__timelines || {};
        window.__timelines["ide"] = tl;
      })();
    </script>
  </div>
</template>
