<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />

    <script src="assets/vendor/gsap.min.js"></script>

    <style>
      @font-face { font-family: "MD Nichrome"; src: url("assets/fonts/MDNichrome-Black.woff2") format("woff2"); font-weight: 900; font-display: block; }
      @font-face { font-family: "Altform"; src: url("assets/fonts/altform-regular.woff2") format("woff2"); font-weight: 400 500; font-display: block; }
      @font-face { font-family: "Altform"; src: url("assets/fonts/altform-semibold.woff2") format("woff2"); font-weight: 600 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #060606; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #060606; font-family: Altform, sans-serif; color: #EDEFF2; }
      .layer { position: absolute; inset: 0; }
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }

      /* reference: a dark, out-of-focus chart behind, warm light from the upper left */
      #bg { background:
        radial-gradient(ellipse 50% 55% at 8% 10%, rgba(120,92,34,0.42), rgba(0,0,0,0) 70%),
        radial-gradient(ellipse 45% 50% at 100% 100%, rgba(40,34,22,0.35), rgba(0,0,0,0) 70%),
        linear-gradient(180deg, #0A0908 0%, #060606 100%); }
      #chartbg { position: absolute; left: -200px; top: 0; width: 2400px; height: 1080px; filter: blur(9px); opacity: 0.32; }

      #car { position: absolute; left: 960px; top: 520px; width: 0; height: 0; }
      .card { position: absolute; left: 0; top: 0; width: 400px; height: 430px; margin: -215px 0 0 -200px; border-radius: 30px; padding: 46px 34px 0; text-align: center;
        background: linear-gradient(180deg, #2A2A2D 0%, #1C1C1F 55%, #161618 100%); border: 1.5px solid rgba(255,255,255,0.10);
        box-shadow: 0 40px 90px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08); transform-origin: 50% 50%; }
      .card .ic { width: 56px; height: 56px; margin: 0 auto; }
      .card .ic svg { width: 56px; height: 56px; fill: none; stroke: #F4F2EE; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .card h3 { margin-top: 18px; font-size: 44px; font-weight: 600; color: #F6F5F2; letter-spacing: -0.005em; }
      .card .sp { display: block; width: 300px; height: 64px; margin: 22px auto 0; overflow: visible; }
      .card .sp .base { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 3; }
      .card .sp .ln { fill: none; stroke: url(#spg); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .card .tk { margin-top: 16px; font-size: 26px; color: #B9BCC2; letter-spacing: 0.01em; }
      .card .st { position: absolute; left: 0; right: 0; bottom: 40px; font-size: 28px; font-weight: 600; color: #4CD98A; }
      .card .st i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: #4CD98A; margin-right: 10px; vertical-align: 3px; box-shadow: 0 0 10px rgba(76,217,138,0.8); }

      #frame { position: absolute; left: 0; top: 0; overflow: visible; }
      #frame rect { fill: none; stroke: rgba(242,200,110,0.75); stroke-width: 2; }
      #flabel { position: absolute; display: flex; align-items: center; gap: 12px; font-size: 20px; letter-spacing: 0.24em; font-weight: 600; color: #EDE6D6; white-space: nowrap; }
      #flabel img { height: 30px; }

      #vig { background: radial-gradient(ellipse 80% 82% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.7) 100%); pointer-events: none; }
      #grain { background-size: 320px 320px; mix-blend-mode: overlay; opacity: 0.12; pointer-events: none; }
    </style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="4.966667" data-width="1920" data-height="1080">
      <div class="fontwarm"><span style="font-family:'MD Nichrome';font-weight:900">Aa</span><span style="font-weight:400">Aa</span><span style="font-weight:600">Aa</span></div>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
