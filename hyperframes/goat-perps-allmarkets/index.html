<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>GOAT Funded Perps: all markets</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      @font-face { font-family: "MD Nichrome"; src: url("assets/fonts/MDNichrome-Black.woff2") format("woff2"); font-weight: 900; font-display: block; }
      @font-face { font-family: "Altform"; src: url("assets/fonts/altform-regular.woff2") format("woff2"); font-weight: 400 500; font-display: block; }
      @font-face { font-family: "Altform"; src: url("assets/fonts/altform-semibold.woff2") format("woff2"); font-weight: 600 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #060606; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #060606; font-family: Altform, sans-serif; color: #EDEFF2; }
      .layer { position: absolute; inset: 0; }
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }

      /* reference: a dark, out-of-focus chart behind, warm light from the upper left */
      #bg { background:
        radial-gradient(ellipse 50% 55% at 8% 10%, rgba(120,92,34,0.42), rgba(0,0,0,0) 70%),
        radial-gradient(ellipse 45% 50% at 100% 100%, rgba(40,34,22,0.35), rgba(0,0,0,0) 70%),
        linear-gradient(180deg, #0A0908 0%, #060606 100%); }
      #chartbg { position: absolute; left: -200px; top: 0; width: 2400px; height: 1080px; filter: blur(9px); opacity: 0.32; }

      #car { position: absolute; left: 960px; top: 500px; width: 0; height: 0; }
      /* the reference's cards: matte grey, crisp, a thin bar, a value, a status line; no glow */
      .card { --hl: 0; position: absolute; left: 0; top: 0; width: 470px; height: 530px; margin: -265px 0 0 -235px; border-radius: 26px; padding: 50px 40px 0; text-align: center; overflow: hidden;
        background: linear-gradient(180deg, rgb(calc(40 + 22 * var(--hl)), calc(40 + 22 * var(--hl)), calc(42 + 22 * var(--hl))) 0%, rgb(calc(27 + 18 * var(--hl)), calc(27 + 18 * var(--hl)), calc(29 + 18 * var(--hl))) 45%, rgb(calc(19 + 14 * var(--hl)), calc(19 + 14 * var(--hl)), calc(21 + 14 * var(--hl))) 100%);
        border: 1.5px solid rgba(255,255,255,0.07);
        box-shadow: 0 34px 80px rgba(0,0,0,0.7), 0 8px 18px rgba(0,0,0,0.45), inset 0 1.5px 0 rgba(255,255,255,0.20), inset 0 -40px 60px rgba(0,0,0,0.28); transform-origin: 50% 50%; }
      /* the panel surface: frosted grain, a soft sheen from the upper left, a specular line along the top edge */
      .card .tex { position: absolute; inset: 0; border-radius: inherit; background-size: 180px 180px; mix-blend-mode: overlay; opacity: 0.55; pointer-events: none; }
      .card .sheen { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: radial-gradient(ellipse 90% 55% at 22% 0%, rgba(255,255,255,0.10), rgba(255,255,255,0) 70%),
                    linear-gradient(158deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 38%); background-size: 140% 100%; }
      .card .edge { position: absolute; left: 22px; right: 22px; top: 0; height: 1.5px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.45) 30%, rgba(255,255,255,0.25) 70%, rgba(255,255,255,0)); pointer-events: none; }
      .card .ic, .card h3, .card .bar, .card .val, .card .chk { position: relative; z-index: 1; }
      .card .st { z-index: 1; }
      .card .ic { width: 58px; height: 58px; margin: 0 auto; }
      .card .ic svg { width: 58px; height: 58px; fill: none; stroke: #F2F2F2; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .card h3 { margin-top: 20px; font-size: 47px; font-weight: 600; color: #F4F4F4; letter-spacing: -0.005em; white-space: nowrap; }
      .card .bar { position: relative; width: 370px; height: 10px; margin: 30px auto 0; border-radius: 6px; background: #3B3B3D; overflow: hidden; }
      .card .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
      .card .val { margin-top: 22px; font-size: 37px; color: #C8C8CA; white-space: nowrap; }
      .card .chk { width: 74px; height: 74px; margin: 26px auto 0; }
      .card .st { position: absolute; left: 0; right: 0; bottom: 62px; font-size: 40px; font-weight: 500; color: #3FD07F; }

      #vig { background: radial-gradient(ellipse 80% 82% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.7) 100%); pointer-events: none; }
      #grain { background-size: 320px 320px; mix-blend-mode: overlay; opacity: 0.17; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="4.966667" data-width="1920" data-height="1080">
      <div class="fontwarm"><span style="font-family:'MD Nichrome';font-weight:900">Aa</span><span style="font-weight:400">Aa</span><span style="font-weight:600">Aa</span></div>
      <div id="stage" class="layer"></div>
      <audio id="voiceover" src="assets/voiceover.m4a" data-start="0" data-duration="4.966667" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
