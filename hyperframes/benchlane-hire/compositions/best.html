<template id="best-template">
  <div data-composition-id="best" data-width="1920" data-height="1080" data-duration="1.4333">
    <div class="full cream"></div>
    <div id="be-pill">
      <svg id="be-svg" xmlns="http://www.w3.org/2000/svg"><path id="be-base" fill="none" stroke-width="3" /><path id="be-dark" fill="none" stroke-width="3" /></svg>
      <div id="be-line" class="line"></div>
    </div>

    <style>
      /* outline centred on y 539.5, 118 px tall; text baseline at y 554.5 */
      #be-pill { position: absolute; left: 0; top: 480.5px; height: 118px; }
      #be-svg { position: absolute; left: 0; top: 0; width: 2000px; height: 118px; overflow: visible; }
      #be-svg path { stroke-linecap: round; stroke-linejoin: round; }
      #be-line { position: absolute; top: 24.8px; font-size: 57px; letter-spacing: -0.005em; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C;
        const CUT = 75, at = (n) => FX.at(n, CUT);
        const root = document.getElementById("be-pill").parentElement;
        const $ = (s) => root.querySelector(s);
        const pill = $("#be-pill"), base = $("#be-base"), dark = $("#be-dark");

        // Inter 57 px / Newsreader italic advance widths (measured in Chromium with the bundled fonts)
        const SP = 16.03, WW = [112.81, 121.13, 227.5];
        const words = FX.words($("#be-line"), ["with", "hard", { t: "evidence.", cls: "serif" }]);
        const text = (n) => WW.slice(0, n).reduce((a, b) => a + b, 0) + SP * (n - 1);
        const H = 118, R0 = 33, IN = 1.5, CX = 959.5;

        // a rounded rect traced twice from top-centre, clockwise, so any segment [a, b] (fractions, b < 2) is one dash
        const geo = (W) => {
          const r = R0 - IN, x0 = IN, x1 = W - IN, y0 = IN, y1 = H - IN, m = W / 2;
          const loop = `H${x1 - r}A${r} ${r} 0 0 1 ${x1} ${y0 + r}V${y1 - r}A${r} ${r} 0 0 1 ${x1 - r} ${y1}H${x0 + r}A${r} ${r} 0 0 1 ${x0} ${y1 - r}V${y0 + r}A${r} ${r} 0 0 1 ${x0 + r} ${y0}H${m}`;
          const P = 2 * (x1 - x0 - 2 * r) + 2 * (y1 - y0 - 2 * r) + 2 * Math.PI * r;
          return { d: `M${m} ${y0}` + loop + loop, P };
        };
        const dash = (P, segs) => {
          let s = "", pos = 0;
          segs.filter(([a, b]) => b > a + 1e-4).forEach(([a, b]) => {
            s += `${((a - pos) * P).toFixed(2)} ${((b - a) * P).toFixed(2)} `;
            pos = b;
          });
          return s ? `0 ${s}${(2 * P).toFixed(0)}` : `0 ${(2 * P).toFixed(0)}`;
        };

        // ---- measured off the reference, as smooth curves over every frame
        // (perimeter positions in 96ths, clockwise from top centre)
        const pad = FX.curve([[75, 23.5], [77, 41.5], [78, 45.5], [79, 47.5], [80, 51]]);
        const offHard = FX.curve([[82, 0.32], [83, 0.106], [84, 0.035], [85, 0.018], [87, 0]]);
        const offEv = FX.curve([[88, 0.43], [89, 0.2], [90, 0.108], [92, 0.05], [93, 0.025], [94, 0.017], [95, 0]]);
        // dark stroke [tail, head] drawing round the orange outline
        const draw = FX.curve([[77, 21, 21], [78, 21, 23], [79, 21, 24], [80, 22, 27], [82, 23, 30], [83, 24, 35], [84, 25, 40], [85, 26, 47], [87, 27, 54],
          [88, 30, 65], [89, 32, 76], [90, 34, 87], [92, 36, 98], [93, 37, 107], [94, 39, 115], [95, 40, 122], [97, 41, 128]]);
        // from 98 the outline is one stroke [tail, head] chasing itself round, with an orange sliver left until 102
        const snake = FX.curve([[98, 34.3, 129.75], [99, 35.3, 129.75], [100, 36.8, 129.75], [102, 39.1, 129.8], [103, 42.3, 130], [104, 46.5, 130.3],
          [105, 51.6, 130.7], [107, 57.2, 131.2], [108, 62.5, 131.8], [109, 68, 132.7], [110, 71, 133.8], [112, 77.5, 135.2], [113, 79.6, 136.9],
          [114, 83, 139.1], [115, 86.8, 141.9], [117, 93.2, 146.6]]);
        const sliver = FX.curve([[98, 36, 42], [99, 36, 42], [100, 39, 42], [102, 41.6, 42], [103, 42, 42]]);
        // exit: outline fades from ink to tan while its ends pull in (px, scaled to this pill's width)
        const strokeCol = FX.colors([[103, C.ink], [104, "#241f1a"], [105, "#312a23"], [107, "#423930"], [108, "#6c564c"], [109, "#9c7666"], [110, "#9f7967"],
          [112, "#a88573"], [113, "#b08a78"], [114, "#a87f6c"], [115, "#a07a66"], [117, "#9a7562"]]);
        const shrink = FX.curve([[107, 0, 0], [108, 0.5, 0], [109, 3, 1], [110, 5.5, 3], [112, 12, 6], [113, 18.5, 6], [114, 29.5, 6], [115, 49, 6], [117, 93.5, 6]]);
        // word fades on the way out (opacity), and the last word's tint
        const fade = [
          FX.curve([[107, 1], [108, 0.55], [109, 0.4], [110, 0.3], [112, 0]]),
          FX.curve([[108, 1], [109, 0.85], [110, 0.75], [112, 0.5], [113, 0.3], [114, 0]]),
          FX.curve([[109, 1], [110, 1], [112, 0.75], [113, 0.6], [114, 0.45], [115, 0.3], [117, 0]]),
        ];
        const lastTint = FX.colors([[109, C.ink], [110, "#6b4a3f"], [112, "#a5776a"]]);

        const Wfull = text(3) + 102; // final pill width (51 px padding each side)
        const kR = (Wfull / 2 + CX - 1088.5) / 93.5; // pull the right end in to where the reference's bracket ends
        for (let g = 75; g <= 117; g++) {
          const n = g < 82 ? 1 : g < 88 ? 2 : 3;
          const p = pad(g)[0];
          let W = text(n) + 2 * p;
          let off = 0;
          if (g >= 82 && g < 88) off = offHard(g)[0] * (SP + WW[1]) / 2;
          if (g >= 88) off = offEv(g)[0] * (SP + WW[2]) / 2;
          let left = CX - W / 2 + off;
          const [srr, sll] = g >= 107 ? shrink(g) : [0, 0];
          const sl = sll * kR, sr = srr * kR;
          left += sl;
          W -= sl + sr;
          const { d, P } = geo(W);
          const t = at(g);
          FX.put(tl, pill, { x: left }, t);
          FX.put(tl, $("#be-line"), { x: p - sl }, t);
          FX.put(tl, base, { attr: { d } }, t);
          FX.put(tl, dark, { attr: { d } }, t);
          if (g < 98) {
            const seg = g >= 78 ? [draw(g).map((v) => v / 96)] : [];
            FX.put(tl, base, { attr: { stroke: C.stroke, "stroke-dasharray": dash(P, [[0, 1]]) } }, t);
            FX.put(tl, dark, { attr: { stroke: C.ink, "stroke-dasharray": dash(P, seg) } }, t);
          } else {
            const [a, b] = snake(g).map((v) => v / 96);
            const sv = g <= 102 ? sliver(g).map((v) => v / 96) : null;
            FX.put(tl, base, { attr: { stroke: C.stroke, "stroke-dasharray": dash(P, sv ? [sv] : []) } }, t);
            FX.put(tl, dark, { attr: { stroke: g >= 103 ? strokeCol(g) : C.ink, "stroke-dasharray": dash(P, sv ? [[a, sv[0]], [sv[1], b]] : [[a, b]]) } }, t);
          }
          if (g >= 107) fade.forEach((fc, i) => FX.put(tl, words[i], { opacity: fc(g)[0] }, t));
          if (g >= 109) FX.put(tl, words[2], { color: lastTint(g) }, t);
        }

        // words: the first lands in the accent and blends to ink; the others land in ink
        FX.land(tl, words[0], 75, 80, CUT, { rise: 0.04 });
        FX.land(tl, words[1], 82, null, CUT, { from: C.ink, rise: 0.04 });
        FX.land(tl, words[2], 88, null, CUT, { from: C.ink, rise: 0.04 });

        tl.set({}, {}, 1.4333);
        window.__timelines = window.__timelines || {};
        window.__timelines["best"] = tl;
      })();
    </script>
  </div>
</template>
