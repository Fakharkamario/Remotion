<template id="calendar-template">
  <div data-composition-id="calendar" data-width="1920" data-height="1080" data-duration="2.5">
    <div class="full cream"></div>
    <div id="ca-row" data-layout-allow-overlap data-layout-allow-occlusion><div id="ca-line" class="line" data-layout-allow-overlap data-layout-allow-occlusion></div></div>
    <div id="ca-and" class="ca-side">and</div>
    <div id="ca-hire" class="ca-side">hire</div>
    <div id="ca-field" class="full" data-layout-allow-overlap data-layout-allow-occlusion></div>

    <style>
      /* baseline at y 558, centred on x 960 */
      #ca-row { position: absolute; left: 0; right: 0; top: 509.7px; display: flex; justify-content: center; }
      #ca-line { position: relative; font-size: 56px; letter-spacing: -0.005em; }
      .ca-side { position: absolute; left: 0; top: 504.5px; font-size: 62px; line-height: 1; white-space: nowrap; color: #16110D; letter-spacing: -0.005em; }
      /* cards are drawn at scale 1 (315 x 110) and placed by their centre */
      .ca-card { position: absolute; left: -157.5px; top: -55px; width: 315px; height: 110px; border-radius: 9px; transform-origin: 50% 50%; }
      .ca-card .fill { position: absolute; inset: 0; border-radius: inherit; }
      .ca-card .viv { position: absolute; inset: 0; border-radius: inherit; opacity: 0; }
      .ca-card .bar { position: absolute; left: 15px; top: 17px; bottom: 17px; width: 4.5px; border-radius: 3px; }
      .ca-card b { position: absolute; left: 33px; top: 22px; font-size: 21px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; }
      .ca-card small { position: absolute; left: 33px; top: 58px; display: flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 450; white-space: nowrap; opacity: 0.85; }
      .ca-card small svg { width: 14px; height: 14px; display: block; }
      .ca-card.p .fill { background: rgba(196, 170, 245, 0.42); }
      .ca-card.p .viv { background: #7D5CF0; }
      .ca-card.p .bar { background: #8562E1; }
      .ca-card.p b, .ca-card.p small { color: #8A62E6; }
      .ca-card.o .fill { background: rgba(244, 170, 145, 0.45); }
      .ca-card.o .viv { background: #EC6A3F; }
      .ca-card.o .bar { background: #EA6A44; }
      .ca-card.o b, .ca-card.o small { color: #E0603A; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C, M = window.MOTION;
        const at = (n) => FX.at(n, 0);
        const root = document.getElementById("ca-field").parentElement;
        const $ = (s) => root.querySelector(s);

        // ---------------------------------------------------------------- "so you interview less"
        // laid out in full; each word appears in place in the accent and inks a few frames later
        const w = FX.words($("#ca-line"), ["so", "you", "interview", "less"]);
        w.forEach((el) => ["overlap", "occlusion"].forEach((k) => el.setAttribute("data-layout-allow-" + k, "")));
        [[0, 3], [2, 5], [4, 8], [5, 9]].forEach(([on, ink], i) => {
          FX.put(tl, w[i], { opacity: 0, color: C.text }, 0);
          FX.put(tl, w[i], { opacity: 1 }, at(on));
          FX.put(tl, w[i], { color: C.ink }, at(ink));
        });
        // the line drifts with the field (x offset of the line, measured)
        FX.track(tl, $("#ca-line"), [[0, 22], [2, 20], [3, 15], [4, 11], [5, 8], [7, 5], [8, 4], [9, 2], [10, 1], [12, 1], [13, 0], [20, 0], [25, -2], [30, -4], [35, -7], [37, -9],
          [40, -13], [42, -17], [43, -24], [44, -40]], 0, ([x]) => ({ x }));
        FX.put(tl, $("#ca-line"), { opacity: 0 }, at(45));

        // ------------------------------------------------------------------- "and … hire"
        // "and" lands centred, "hire" joins it, then each jumps out to its side and drifts apart as the cards squeeze in
        const and = $("#ca-and"), hire = $("#ca-hire");
        FX.put(tl, [and, hire], { opacity: 0 }, 0);
        FX.track(tl, and, [[45, 905.3, 1, C.text], [50, 841.5], [52, 330], [53, 327], [54, 325], [55, 322, 1, C.ink], [69, 321], [70, 320], [72, 318], [73, 314], [74, 302]], 0,
          ([x, o, c]) => Object.assign({ x }, o != null ? { opacity: o } : {}, c ? { color: c } : {}));
        FX.track(tl, hire, [[50, 968.3, 1, C.text], [52, 968.3, 1, C.ink], [54, 1468, 1, C.text], [55, 1476], [57, 1480], [58, 1481, 1, C.ink], [69, 1483], [70, 1484], [72, 1487],
          [73, 1491], [74, 1503]], 0, ([x, o, c]) => Object.assign({ x }, o != null ? { opacity: o } : {}, c ? { color: c } : {}));

        // ------------------------------------------------------------------------ card field
        // per-frame tracks from scripts/gen_motion.py: [x, y, scale, blur, on]; far cards first so near ones overlap them
        const clock = () => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.4"/><path d="M8 4.6V8l2.3 1.5" stroke-linecap="round"/></svg>`;
        const field = $("#ca-field");
        const OK = "data-layout-allow-overlap data-layout-allow-occlusion";
        const cards = M.cards.slice().sort((a, b) => b.z - a.z);
        // the pull-back turns the cards vivid and smears them sideways before the cut
        const viv = [[63, 0, 1, 0], [64, 0.1, 1.02, 0.2], [65, 0.18, 1.04, 0.4], [67, 0.32, 1.1, 0.9], [68, 0.45, 1.16, 1.3], [69, 0.6, 1.25, 1.8], [70, 0.7, 1.32, 2.2],
          [72, 0.8, 1.42, 2.8], [73, 0.88, 1.5, 3.2], [74, 0.95, 1.6, 3.6]];
        const vivAt = (g) => {
          if (g < 63) return [0, 1, 0];
          let r = viv[0];
          for (const v of viv) if (v[0] <= g) r = v;
          return r.slice(1);
        };
        cards.forEach((c) => {
          const d = document.createElement("div");
          d.className = "ca-card " + c.c;
          // cards cross each other and the words on purpose, as in the reference
          d.setAttribute("data-layout-allow-overlap", "");
          d.setAttribute("data-layout-allow-occlusion", "");
          d.innerHTML = `<div class="fill"></div><div class="viv"></div><i class="bar"></i><b ${OK}>${c.t}</b><small ${OK}>${clock()}${c.tm}</small>`;
          field.appendChild(d);
          const vv = d.querySelector(".viv");
          c.tr.forEach(([x, y, s, b, on], g) => {
            if (g > 0 && FX.held(g)) return;
            const [vo, sx, vb] = vivAt(g);
            const t = at(g);
            FX.put(tl, d, { x, y, scaleX: s * sx, scaleY: s, filter: `blur(${(b + vb).toFixed(2)}px)`, visibility: on ? "visible" : "hidden" }, t);
            if (g >= 63) FX.put(tl, vv, { opacity: vo }, t);
          });
        });
        FX.put(tl, field, { opacity: 0 }, at(75));

        tl.set({}, {}, 2.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["calendar"] = tl;
      })();
    </script>
  </div>
</template>
