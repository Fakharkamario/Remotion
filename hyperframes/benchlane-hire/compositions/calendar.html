<template id="calendar-template">
  <div data-composition-id="calendar" data-width="1920" data-height="1080" data-duration="2.5">
    <div class="full cream"></div>
    <div id="ca-row" data-layout-allow-overlap data-layout-allow-occlusion><div id="ca-line" class="line" data-layout-allow-overlap data-layout-allow-occlusion></div></div>
    <div id="ca-and" class="ca-side" data-layout-allow-overlap data-layout-allow-occlusion>and</div>
    <div id="ca-hire" class="ca-side" data-layout-allow-overlap data-layout-allow-occlusion>hire</div>
    <svg id="ca-defs" width="0" height="0" aria-hidden="true"></svg>
    <div id="ca-field" class="full" data-layout-allow-overlap data-layout-allow-occlusion></div>

    <style>
      /* baseline at y 558, centred on x 960 */
      #ca-row { position: absolute; left: 0; right: 0; top: 509.7px; display: flex; justify-content: center; }
      #ca-line { position: relative; font-size: 56px; letter-spacing: -0.005em; }
      .ca-side { position: absolute; left: 0; top: 504.5px; font-size: 62px; line-height: 1; white-space: nowrap; color: #16110D; letter-spacing: -0.005em; }
      #ca-defs { position: absolute; }
      /* cards are drawn at scale 1 (315 x 110), placed by their centre. Each is frosted glass: the layers behind it
         show through blurred. Motion blur is an SVG filter per card on the glass and on its contents (never on the
         card itself, which would cut the glass off from what is behind it). */
      .ca-card { position: absolute; left: -157.5px; top: -55px; width: 315px; height: 110px; border-radius: 10px; transform-origin: 50% 50%; }
      .ca-card .fill, .ca-card .viv { position: absolute; inset: 0; border-radius: inherit; }
      .ca-card .fill { backdrop-filter: blur(9px) saturate(1.25); -webkit-backdrop-filter: blur(9px) saturate(1.25);
        box-shadow: 0 10px 28px -8px rgba(110, 70, 50, 0.16), inset 0 0 0 1px rgba(255, 255, 255, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
      .ca-card .viv { opacity: 0; }
      .ca-card .ct { position: absolute; inset: 0; }
      .ca-card .bar { position: absolute; left: 15px; top: 17px; bottom: 17px; width: 4.5px; border-radius: 3px; }
      .ca-card b { position: absolute; left: 33px; top: 22px; font-size: 21px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; }
      .ca-card small { position: absolute; left: 33px; top: 58px; display: flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 450; white-space: nowrap; opacity: 0.85; }
      .ca-card small svg { width: 14px; height: 14px; display: block; }
      .ca-card.p .fill { background: linear-gradient(180deg, rgba(204, 182, 250, 0.5), rgba(190, 164, 244, 0.4)); }
      .ca-card.p .viv { background: linear-gradient(180deg, #8A6CF4, #7553EC); }
      .ca-card.p .bar { background: #8562E1; }
      .ca-card.p b, .ca-card.p small { color: #8A62E6; }
      .ca-card.o .fill { background: linear-gradient(180deg, rgba(248, 184, 160, 0.52), rgba(240, 162, 136, 0.42)); }
      .ca-card.o .viv { background: linear-gradient(180deg, #F0784C, #E86136); }
      .ca-card.o .bar { background: #EA6A44; }
      .ca-card.o b, .ca-card.o small { color: #E0603A; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C, M = window.MOTION;
        const at = (n) => FX.at(n, 0);
        const root = document.getElementById("ca-field").parentElement;
        const $ = (s) => root.querySelector(s);
        const OK = "data-layout-allow-overlap data-layout-allow-occlusion";

        // ---------------------------------------------------------------- "so you interview less"
        // laid out in full; each word lands in place in the accent and blends to ink a few frames later
        const w = FX.words($("#ca-line"), ["so", "you", "interview", "less"]);
        w.forEach((el) => ["overlap", "occlusion"].forEach((k) => el.setAttribute("data-layout-allow-" + k, "")));
        [[0, 3], [2, 5], [4, 8], [5, 9]].forEach(([on, ink], i) => FX.land(tl, w[i], on, ink, 0));
        // the line drifts with the field (x offset of the line, measured), on a smooth curve
        const drift = FX.curve([[0, 22], [2, 20], [3, 15], [4, 11], [5, 8], [7, 5], [8, 4], [9, 2], [10, 1], [12, 1], [13, 0], [20, 0], [25, -2], [30, -4],
          [35, -7], [37, -9], [40, -13], [42, -17], [43, -24], [44, -40]]);
        for (let g = 0; g <= 44; g++) FX.put(tl, $("#ca-line"), { x: drift(g)[0] }, at(g));
        tl.to($("#ca-line"), { opacity: 0, duration: 1 / 30, ease: "none" }, at(45));

        // ------------------------------------------------------------------- "and … hire"
        // "and" lands centred, "hire" joins it, then each jumps out to its side (cuts, as in the reference)
        // and they ease apart as the cards squeeze in; colours blend instead of switching
        const and = $("#ca-and"), hire = $("#ca-hire");
        FX.put(tl, [and, hire], { opacity: 0 }, 0);
        FX.put(tl, and, { x: 905.3, color: C.text }, 0);
        FX.put(tl, hire, { x: 968.3, color: C.text }, 0);
        tl.to(and, { opacity: 1, duration: 2 / 30, ease: "none" }, at(45));
        FX.put(tl, and, { x: 841.5 }, at(50));
        tl.to(hire, { opacity: 1, duration: 2 / 30, ease: "none" }, at(50));
        tl.to(hire, { color: C.ink, duration: 2 / 30, ease: "power1.inOut" }, at(52));
        FX.put(tl, and, { x: 330 }, at(52));
        FX.put(tl, hire, { x: 1468, color: C.text }, at(54));
        tl.to(and, { color: C.ink, duration: 3 / 30, ease: "power1.inOut" }, at(55));
        tl.to(hire, { color: C.ink, duration: 3 / 30, ease: "power1.inOut" }, at(58));
        // once they have jumped out to the sides the two words sit above the cards, clear of the cluster
        FX.put(tl, [and, hire], { zIndex: 5 }, at(56));
        const andX = FX.curve([[52, 330], [53, 327], [54, 325], [55, 322], [68, 322], [69, 321], [70, 320], [72, 318], [73, 314], [74, 302]]);
        const hireX = FX.curve([[54, 1468], [55, 1476], [57, 1480], [58, 1481], [68, 1482], [69, 1483], [70, 1484], [72, 1487], [73, 1491], [74, 1503]]);
        for (let g = 53; g <= 74; g++) FX.put(tl, and, { x: andX(g)[0] }, at(g));
        for (let g = 55; g <= 74; g++) FX.put(tl, hire, { x: hireX(g)[0] }, at(g));

        // ------------------------------------------------------------------------ card field
        // per-frame tracks from scripts/gen_motion.py: [x, y, scale, blur x, blur y, on]; far cards first so near ones overlap them
        const clock = () => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.4"/><path d="M8 4.6V8l2.3 1.5" stroke-linecap="round"/></svg>`;
        const field = $("#ca-field"), defs = $("#ca-defs");
        const cards = M.cards.slice().sort((a, b) => b.z - a.z);
        // the pull-back turns the cards vivid and smears them sideways before the cut: [vivid, stretch x, extra blur x]
        const viv = FX.curve([[62, 0, 1, 0], [64, 0.1, 1.02, 1], [66, 0.25, 1.06, 2.5], [68, 0.45, 1.16, 4.5], [70, 0.7, 1.32, 7], [72, 0.8, 1.42, 9], [74, 0.95, 1.6, 12]]);
        cards.forEach((c, i) => {
          defs.insertAdjacentHTML("beforeend", `<filter id="ca-mb${i}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>`);
          const blur = defs.lastElementChild.firstElementChild;
          const d = document.createElement("div");
          d.className = "ca-card " + c.c;
          // cards cross each other and the words on purpose, as in the reference
          d.setAttribute("data-layout-allow-overlap", "");
          d.setAttribute("data-layout-allow-occlusion", "");
          const f = `style="filter:url(#ca-mb${i})"`;
          d.innerHTML = `<div class="fill" ${f}></div><div class="viv" ${f}></div><div class="ct" ${f}><i class="bar"></i><b ${OK}>${c.t}</b><small ${OK}>${clock()}${c.tm}</small></div>`;
          field.appendChild(d);
          const vv = d.querySelector(".viv");
          c.tr.forEach(([x, y, s, bx, by, on], g) => {
            const [vo, sx, vb] = g >= 62 ? viv(g) : [0, 1, 0];
            const t = at(g);
            FX.put(tl, d, { x, y, scaleX: s * sx, scaleY: s, visibility: on ? "visible" : "hidden" }, t);
            // the filter works in the card's own (unscaled) space, so screen-space blur is divided by the scale
            const k = 1 / Math.max(0.05, s);
            FX.put(tl, blur, { attr: { stdDeviation: `${((bx + vb) * k / sx).toFixed(2)} ${(by * k).toFixed(2)}` } }, t);
            if (g >= 62) FX.put(tl, vv, { opacity: vo }, t);
          });
        });
        FX.put(tl, field, { opacity: 0 }, at(75));

        tl.set({}, {}, 2.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["calendar"] = tl;
      })();
    </script>
  </div>
</template>
