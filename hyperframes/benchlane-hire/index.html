<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/fx.js"></script>
    <script src="assets/motion.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Newsreader"; font-style: italic; src: url("assets/fonts/newsreader-italic-latin.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FDF6EF; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FDF6EF;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif; color: #16110D; -webkit-font-smoothing: antialiased; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .full { position: absolute; inset: 0; }
      .cream { background: #FDF6EF; }
      .serif { font-family: "Newsreader", Georgia, serif; font-style: italic; letter-spacing: -0.005em; font-size: 1.08em; }
      /* a line is laid out in full from the start; words are shown in place */
      .line { position: absolute; left: 0; top: 0; display: flex; align-items: baseline; white-space: nowrap; line-height: 1; transform-origin: 0 0; }
      .line .w { display: inline-block; white-space: pre; }
      .line .sp { white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.1" data-width="1920" data-height="1080">
      <div id="calendar-comp" class="clip" data-composition-id="calendar" data-composition-src="compositions/calendar.html" data-start="0" data-duration="2.5" data-track-index="0"></div>

      <div id="final-comp" class="clip" data-composition-id="final" data-composition-src="compositions/final.html" data-start="5.5" data-duration="2.6" data-track-index="3"></div>
      <audio id="soundtrack" src="assets/audio.m4a" data-start="0" data-duration="8.1" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 8.1);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
