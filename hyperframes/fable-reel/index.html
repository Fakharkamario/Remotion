<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Fable 5.2 reel</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/plan.js"></script>
    <script src="assets/words.js"></script>
    <script src="assets/scene.js"></script>
    <link rel="stylesheet" href="assets/scene.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="57.5333" data-width="1080" data-height="1920">
      <div class="fontwarm">
        <span style="font-family:Jakarta;font-weight:600">Aa</span><span style="font-family:Jakarta;font-weight:700">Aa</span><span style="font-family:Jakarta;font-weight:800">Aa</span>
        <span style="font-family:Archivo;font-weight:900">Aa</span><span style="font-family:Serif4;font-weight:600">Aa</span><span style="font-family:Anton">Aa</span><span style="font-family:Montserrat;font-weight:900">Aa</span>
      </div>
      <div id="bg" class="layer"></div>
      <div id="darkBg" class="layer"></div>
      <div id="insetFrame"></div>
      <div id="camShell" class="layer">
        <div id="cam">
          <video id="aroll" src="assets/aroll.mp4" data-start="0" data-duration="57.5333" data-track-index="0" muted playsinline></video>
        </div>
      </div>
      <div id="ui" class="layer"></div>
      <div id="cap" class="layer"></div>
      <div id="burn" class="layer"></div>
      <div id="flash" class="layer"></div>
      <!-- b-roll: HyperFrames seeks each from its data-start; scene.js moves them into their cards -->
      <div id="brollPark" style="position:absolute;left:0;top:0;width:0;height:0;overflow:hidden">
        <video id="b_bench" src="assets/broll/bench.mp4" data-start="7.12" data-duration="1.25" data-track-index="1" muted playsinline></video>
        <video id="b_pixar" src="assets/broll/pixar.mp4" data-start="16.16" data-duration="3.38" data-track-index="2" muted playsinline></video>
        <video id="b_hist" src="assets/broll/hist.mp4" data-start="22.24" data-duration="3.12" data-track-index="3" muted playsinline></video>
        <video id="b_future" src="assets/broll/future.mp4" data-start="25.34" data-duration="2.28" data-track-index="4" muted playsinline></video>
        <video id="b_tokyoA" src="assets/broll/tokyoA.mp4" data-start="42.83" data-duration="2.12" data-track-index="5" muted playsinline></video>
        <video id="b_tokyoB" src="assets/broll/tokyoB.mp4" data-start="44.95" data-duration="4.68" data-track-index="6" muted playsinline></video>
      </div>
      <audio id="soundtrack" src="assets/audio.m4a" data-start="0" data-duration="57.5333" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount({
        bg: $("bg"), darkBg: $("darkBg"), insetFrame: $("insetFrame"),
        camShell: $("camShell"), cam: $("cam"), aroll: $("aroll"),
        ui: $("ui"), cap: $("cap"), flash: $("flash"), burn: $("burn"),
        broll: { bench: $("b_bench"), pixar: $("b_pixar"), hist: $("b_hist"), future: $("b_future"), tokyoA: $("b_tokyoA"), tokyoB: $("b_tokyoB") },
      });
    </script>
  </body>
</html>
