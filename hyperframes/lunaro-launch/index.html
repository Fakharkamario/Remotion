<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>LUNARO Launch</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/art.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-wght.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5ede4;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5ede4;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        color: #111111;
        -webkit-font-smoothing: antialiased;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Full-frame drawn scenes and their glitch slices */
      .scene,
      .slice {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .slice {
        visibility: hidden;
      }
      .scene-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Kinetic type: centred rows of collapsible words */
      .beat {
        position: absolute;
        inset: 0;
        visibility: hidden;
      }
      .line {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        margin-top: -0.62em;
        line-height: 1.24;
        display: flex;
        justify-content: center;
        align-items: baseline;
        white-space: nowrap;
        font-weight: 500;
        letter-spacing: -0.012em;
      }
      .w {
        display: inline-block;
        min-width: 0;
        max-width: 0;
        overflow: visible;
        white-space: nowrap;
      }
      .wi {
        display: inline-block;
        margin-left: 0.26em;
        opacity: 0;
        white-space: nowrap;
      }
      .ch {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="38.65"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="reel-comp"
        class="clip"
        data-composition-id="reel"
        data-composition-src="compositions/reel.html"
        data-start="22.4"
        data-duration="10.85"
        data-track-index="0"
      ></div>
      <div
        id="typography-comp"
        class="clip"
        style="z-index: 2"
        data-composition-id="typography"
        data-composition-src="compositions/typography.html"
        data-start="0"
        data-duration="23.45"
        data-track-index="1"
      ></div>
      <div
        id="logo-comp"
        class="clip"
        style="z-index: 3"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="33.05"
        data-duration="4.6"
        data-track-index="2"
      ></div>

      <audio
        id="soundtrack"
        src="assets/soundtrack.m4a"
        data-start="0"
        data-duration="38.65"
        data-track-index="3"
        data-volume="1"
      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 38.65);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
