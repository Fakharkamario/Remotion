<template id="process-template">
  <div data-composition-id="process" data-width="1920" data-height="1080" data-duration="3">
    <div id="ps-cam" class="full">
      <div id="ps-kicker" class="mono">HOW A LAUNCH GETS MADE</div>
      <div id="ps-rail"><div id="ps-fill"></div></div>
      <div id="ps-nodes"></div>
      <div id="ps-head"></div>
    </div>

    <style>
      #ps-kicker { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 22px; letter-spacing: 0.32em; color: #8E8C95; }
      #ps-rail { position: absolute; left: 260px; width: 1400px; top: 539px; height: 2px; background: rgba(245, 243, 238, 0.14); overflow: hidden; }
      #ps-fill { position: absolute; inset: 0; background: linear-gradient(90deg, #FF5B2E, #FFB547); transform-origin: 0 50%; }
      .ps-node { position: absolute; top: 540px; width: 0; height: 0; }
      .ps-dot { position: absolute; left: -46px; top: -46px; width: 92px; height: 92px; border-radius: 28px; background: #121217;
        box-shadow: inset 0 0 0 2px rgba(245, 243, 238, 0.12); display: flex; align-items: center; justify-content: center; color: #6E6C76; }
      .ps-dot svg { width: 40px; height: 40px; }
      .ps-label { position: absolute; left: -150px; width: 300px; top: 72px; text-align: center; font-size: 38px; font-weight: 600; letter-spacing: -0.02em; }
      .ps-step { position: absolute; left: -150px; width: 300px; top: -100px; text-align: center; font-size: 18px; letter-spacing: 0.2em; color: #6E6C76; }
      #ps-head { position: absolute; left: 260px; top: 540px; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #FFB547;
        box-shadow: 0 0 0 6px rgba(255, 181, 71, 0.18), 0 0 40px 10px rgba(255, 91, 46, 0.55); }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const root = document.getElementById("ps-cam").closest("[data-composition-id]");
        const $ = (s) => root.querySelector(s);
        const steps = [["Brief", "brief"], ["Script", "script"], ["Design", "design"], ["Animate", "animate"], ["Ship", "ship"]];
        const X0 = 260, X1 = 1660, xs = steps.map((_, i) => X0 + 80 + (i * (X1 - X0 - 160)) / 4);

        $("#ps-nodes").innerHTML = steps
          .map(([label, ic], i) => `<div class="ps-node" style="left:${xs[i]}px"><div class="ps-step mono">0${i + 1}</div><div class="ps-dot">${FX.icon(ic)}</div><div class="ps-label">${label}</div></div>`)
          .join("");
        const nodes = Array.from(root.querySelectorAll(".ps-node"));

        // kicker types on, rail draws, nodes pop in
        FX.put(tl, $("#ps-kicker"), { opacity: 0, y: 14 }, 0);
        tl.to($("#ps-kicker"), { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
        FX.put(tl, $("#ps-rail"), { scaleX: 0, transformOrigin: "50% 50%" }, 0);
        tl.to($("#ps-rail"), { scaleX: 1, duration: 0.55, ease: "expo.out" }, 0.05);
        FX.put(tl, $("#ps-fill"), { scaleX: 0 }, 0);
        nodes.forEach((n, i) => {
          const dot = n.querySelector(".ps-dot"), lab = n.querySelector(".ps-label"), st = n.querySelector(".ps-step");
          FX.put(tl, dot, { scale: 0 }, 0);
          FX.put(tl, [lab, st], { opacity: 0, y: 16 }, 0);
          tl.to(dot, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 0.15 + i * 0.06);
          tl.to([st, lab], { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.22 + i * 0.06);
        });

        // the playhead runs the rail with a beat on each stop; each node lights as it's reached
        const P = (x) => (x - X0) / (X1 - X0);
        FX.put(tl, $("#ps-head"), { x: 0, scale: 0 }, 0);
        tl.to($("#ps-head"), { scale: 1, duration: 0.25, ease: "back.out(3)" }, 0.55);
        let t = 0.7;
        xs.forEach((x, i) => {
          const d = i === 0 ? 0.22 : 0.34;
          tl.to($("#ps-head"), { x: x - X0, duration: d, ease: "power3.inOut" }, t);
          tl.to($("#ps-fill"), { scaleX: P(x), duration: d, ease: "power3.inOut" }, t);
          const dot = nodes[i].querySelector(".ps-dot");
          tl.to(dot, { backgroundColor: "#FF5B2E", color: "#FFFFFF", boxShadow: "inset 0 0 0 2px rgba(255,255,255,0.0), 0 18px 50px rgba(255,91,46,0.45)", duration: 0.16, ease: "power1.out" }, t + d - 0.04);
          tl.fromTo(dot, { scale: 1 }, { scale: 1.16, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.out", immediateRender: false }, t + d - 0.04);
          t += d + 0.05;
        });

        // the camera eases in over the run, then the rail snaps shut into the last node and it launches up
        FX.put(tl, $("#ps-cam"), { scale: 1.06 }, 0);
        tl.to($("#ps-cam"), { scale: 1, duration: 2.4, ease: "power1.out" }, 0);
        tl.to(nodes.slice(0, 4).map((n) => n), { opacity: 0, x: 60, duration: 0.25, stagger: 0.02, ease: "power2.in" }, 2.55);
        tl.to([$("#ps-rail"), $("#ps-kicker"), $("#ps-head")], { opacity: 0, duration: 0.2 }, 2.55);
        tl.to(nodes[4], { y: -900, duration: 0.38, ease: "power3.in" }, 2.62);

        tl.set({}, {}, 3);
        window.__timelines = window.__timelines || {};
        window.__timelines["process"] = tl;
      })();
    </script>
  </div>
</template>
