<template id="offer-template">
  <div data-composition-id="offer" data-width="1920" data-height="1080" data-duration="3">
    <div id="of-glow" class="full"></div>
    <div class="center">
      <div id="of-stack">
        <div id="of-line"><span id="of-pre">Launch-ready in</span><span id="of-num">60</span><span id="of-days">days.</span></div>
        <div id="of-fine" class="mono">FIXED SCOPE · FIXED PRICE · STUDIO-GRADE SOUND</div>
      </div>
    </div>

    <style>
      #of-glow { background: radial-gradient(700px 320px at 50% 50%, rgba(140, 123, 255, 0.22), rgba(140, 123, 255, 0) 70%); opacity: 0; }
      #of-stack { display: flex; flex-direction: column; align-items: center; }
      #of-line { display: flex; align-items: baseline; gap: 26px; font-size: 104px; font-weight: 640; letter-spacing: -0.04em; line-height: 1; }
      #of-num { display: inline-block; min-width: 1.25em; text-align: center; font-weight: 820; font-size: 1.5em; font-variant-numeric: tabular-nums;
        background: linear-gradient(100deg, #FF5B2E, #FFB547 45%, #C9F45B); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #of-fine { margin-top: 50px; font-size: 22px; letter-spacing: 0.26em; color: #8E8C95; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const root = document.getElementById("of-line").closest("[data-composition-id]");
        const $ = (s) => root.querySelector(s);

        FX.put(tl, $("#of-pre"), { opacity: 0, x: -60, filter: "blur(12px)" }, 0);
        tl.to($("#of-pre"), { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.05);
        FX.put(tl, $("#of-num"), { opacity: 0, scale: 0.6 }, 0);
        tl.to($("#of-num"), { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.25);
        FX.put(tl, $("#of-days"), { opacity: 0, x: 60, filter: "blur(12px)" }, 0);
        tl.to($("#of-days"), { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.35);

        // the day count rolls down from 60 and lands on 14 with a bump
        const ease = gsap.parseEase("expo.out");
        FX.each(0.25, 1.35, (f, t, k) => tl.set($("#of-num"), { textContent: String(Math.round(60 - 46 * ease(k))) }, t));
        tl.fromTo($("#of-num"), { scale: 1 }, { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.out", immediateRender: false }, 1.35);
        FX.put(tl, $("#of-glow"), { opacity: 0 }, 0);
        tl.to($("#of-glow"), { opacity: 1, duration: 0.5 }, 1.3);

        FX.put(tl, $("#of-fine"), { opacity: 0, y: 20 }, 0);
        tl.to($("#of-fine"), { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.45);

        tl.to($("#of-stack"), { scale: 0.92, opacity: 0, filter: "blur(16px)", duration: 0.35, ease: "power2.in" }, 2.62);
        tl.to($("#of-glow"), { opacity: 0, duration: 0.3 }, 2.65);

        tl.set({}, {}, 3);
        window.__timelines = window.__timelines || {};
        window.__timelines["offer"] = tl;
      })();
    </script>
  </div>
</template>
