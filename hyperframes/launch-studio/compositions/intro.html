<template id="intro-template">
  <div data-composition-id="intro" data-width="1920" data-height="1080" data-duration="2">
    <div id="in-glow" class="full"></div>
    <div id="in-group" class="center">
      <div id="in-lock">
        <div id="in-mark"></div>
        <div id="in-word"></div>
      </div>
    </div>
    <div id="in-flash" class="full"></div>

    <style>
      #in-glow { background: radial-gradient(640px 360px at 50% 52%, rgba(255, 91, 46, 0.22), rgba(255, 91, 46, 0) 70%); opacity: 0; }
      #in-lock { display: flex; align-items: center; gap: 30px; }
      #in-mark { width: 116px; height: 116px; }
      #in-mark svg { width: 100%; height: 100%; display: block; }
      #in-word { font-size: 104px; font-weight: 640; letter-spacing: -0.035em; line-height: 1; display: flex; }
      #in-word .ch { min-width: 0.2em; text-align: center; }
      #in-flash { background: #F5F3EE; opacity: 0; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const root = document.getElementById("in-lock").closest("[data-composition-id]");
        const $ = (s) => root.querySelector(s);
        $("#in-mark").innerHTML = FX.mark();
        const chars = FX.chars($("#in-word"), "Launch Studio");

        // the mark spins up out of a point, overshoots, settles
        FX.put(tl, $("#in-mark"), { scale: 0, rotation: -120, transformOrigin: "50% 50%" }, 0);
        tl.to($("#in-mark"), { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.2)" }, 0.1);
        FX.put(tl, $("#in-glow"), { opacity: 0 }, 0);
        tl.to($("#in-glow"), { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.15);

        // the wordmark is centred with the mark from the start; letters scramble through glyphs and lock left to right
        chars.forEach((c, i) => {
          if (c.classList.contains("sp")) return;
          const final = c.textContent;
          FX.put(tl, c, { opacity: 0, y: 18 }, 0);
          const t0 = 0.32 + i * 0.035;
          tl.to(c, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t0);
          FX.scramble(tl, c, final, t0, t0 + 0.28 + i * 0.03, 7 + i * 13);
        });

        // hold, then the lockup rushes the camera: scale up through the mark into a soft flash
        FX.put(tl, $("#in-group"), { scale: 1, filter: "blur(0px)" }, 0);
        tl.to($("#in-group"), { scale: 0.94, duration: 0.5, ease: "sine.inOut" }, 1.15);
        tl.to($("#in-group"), { scale: 9, filter: "blur(18px)", opacity: 0, duration: 0.34, ease: "power3.in" }, 1.66);
        FX.put(tl, $("#in-flash"), { opacity: 0 }, 0);
        tl.to($("#in-flash"), { opacity: 0.16, duration: 0.12, ease: "power1.in" }, 1.86);

        tl.set({}, {}, 2);
        window.__timelines = window.__timelines || {};
        window.__timelines["intro"] = tl;
      })();
    </script>
  </div>
</template>
