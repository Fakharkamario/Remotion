<template id="verbs-template">
  <div data-composition-id="verbs" data-width="1920" data-height="1080" data-duration="4">
    <!-- four one-second cuts, each word with its own move -->
    <div id="vb-1" class="vb center"><div class="vb-word" id="vb-script"></div><div id="vb-caret"></div></div>
    <div id="vb-2" class="vb center"><div class="vb-word" id="vb-design"></div><div id="vb-swatch"></div></div>
    <div id="vb-3" class="vb center"><div class="vb-word" id="vb-animate"></div><div id="vb-keys"></div></div>
    <div id="vb-4" class="vb center"><div class="vb-word" id="vb-ship"></div><div id="vb-trail"></div></div>

    <style>
      .vb { opacity: 0; }
      .vb-word { font-size: 210px; font-weight: 760; letter-spacing: -0.05em; line-height: 1; display: flex; position: relative; }
      #vb-caret { width: 12px; height: 190px; background: #FF5B2E; margin-left: 10px; border-radius: 3px; }
      #vb-swatch { position: absolute; left: 50%; top: 680px; display: flex; gap: 18px; transform: translateX(-50%); }
      #vb-swatch i { width: 70px; height: 70px; border-radius: 20px; display: block; }
      #vb-keys { position: absolute; left: 50%; top: 690px; width: 900px; height: 40px; transform: translateX(-50%); }
      #vb-keys .ln { position: absolute; left: 0; right: 0; top: 19px; height: 2px; background: rgba(245, 243, 238, 0.18); }
      #vb-keys .kf { position: absolute; top: 6px; width: 28px; height: 28px; margin-left: -14px; background: #FFB547; transform: rotate(45deg); border-radius: 5px; }
      #vb-trail { position: absolute; left: 0; top: 520px; height: 40px; width: 1920px; transform-origin: 100% 50%;
        background: linear-gradient(90deg, rgba(255, 91, 46, 0), rgba(255, 91, 46, 0.9) 70%, #FFB547); border-radius: 20px; filter: blur(6px); }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const root = document.getElementById("vb-1").closest("[data-composition-id]");
        const $ = (s) => root.querySelector(s);
        const C = FX.C;
        const show = (el, a, b) => { FX.put(tl, el, { opacity: 0 }, 0); tl.set(el, { opacity: 1 }, a); tl.set(el, { opacity: 0 }, b); };
        show($("#vb-1"), 0.0, 1.0);
        show($("#vb-2"), 1.0, 2.0);
        show($("#vb-3"), 2.0, 3.0);
        show($("#vb-4"), 3.0, 4.0);

        // 1 · Script. — typed, caret blinks, then the whole line nudges up
        const s = FX.chars($("#vb-script"), "Script.");
        s.forEach((c, i) => { FX.put(tl, c, { display: "none" }, 0); tl.set(c, { display: "inline-block" }, 0.04 + i * 0.065); });
        FX.each(0.5, 1.0, (f, t) => tl.set($("#vb-caret"), { opacity: Math.floor(f / 5) % 2 ? 0 : 1 }, t));
        tl.fromTo($("#vb-1"), { y: 0 }, { y: -10, duration: 1, ease: "none", immediateRender: false }, 0);

        // 2 · Design. — letters drop on springs in a cascade, swatches pop under it
        const d = FX.chars($("#vb-design"), "Design.");
        d.forEach((c, i) => {
          FX.put(tl, c, { y: -260, rotation: (i % 2 ? 1 : -1) * 20, opacity: 0 }, 0);
          tl.to(c, { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(2.6)" }, 1.02 + i * 0.04);
        });
        [C.orange, C.amber, C.lime, C.sky, C.violet, C.pink].forEach((col) => ($("#vb-swatch").innerHTML += `<i style="background:${col}"></i>`));
        const sw = Array.from(root.querySelectorAll("#vb-swatch i"));
        sw.forEach((el, i) => {
          FX.put(tl, el, { scale: 0 }, 0);
          tl.to(el, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 1.3 + i * 0.04);
        });

        // 3 · Animate. — each letter rides a travelling wave; keyframes tick along the curve editor line
        const a = FX.chars($("#vb-animate"), "Animate.");
        FX.each(2.0, 3.0, (f, t, k) => {
          a.forEach((c, i) => {
            const ph = k * Math.PI * 3 - i * 0.55;
            const amp = 46 * Math.min(1, k * 4) * (1 - Math.max(0, (k - 0.7) / 0.3));
            tl.set(c, { y: Math.sin(ph) * amp, rotation: Math.cos(ph) * amp * 0.12, opacity: Math.min(1, k * 10 - i * 0.4 + 1) }, t);
          });
        });
        $("#vb-keys").innerHTML = '<div class="ln"></div>' + [0, 1, 2, 3, 4, 5, 6].map((i) => `<div class="kf" style="left:${i * 150}px"></div>`).join("");
        const kf = Array.from(root.querySelectorAll("#vb-keys .kf"));
        kf.forEach((el, i) => {
          FX.put(tl, el, { scale: 0, rotation: 45 }, 0);
          tl.to(el, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 2.1 + i * 0.07);
        });

        // 4 · Ship. — slides in, holds, then launches right on a hot trail
        const sh = FX.chars($("#vb-ship"), "Ship.");
        FX.put(tl, $("#vb-ship"), { x: -500, skewX: 18, opacity: 0, filter: "blur(16px)" }, 0);
        tl.to($("#vb-ship"), { x: 0, skewX: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 3.0);
        tl.to($("#vb-ship"), { x: -40, duration: 0.25, ease: "power2.out" }, 3.45);
        tl.to($("#vb-ship"), { x: 1500, skewX: -24, filter: "blur(14px)", duration: 0.3, ease: "power4.in" }, 3.68);
        FX.put(tl, $("#vb-trail"), { scaleX: 0, opacity: 0 }, 0);
        tl.to($("#vb-trail"), { scaleX: 1, opacity: 1, duration: 0.18, ease: "power3.in" }, 3.76);
        tl.to($("#vb-trail"), { opacity: 0, duration: 0.08 }, 3.92);
        sh.forEach((c) => c);

        tl.set({}, {}, 4);
        window.__timelines = window.__timelines || {};
        window.__timelines["verbs"] = tl;
      })();
    </script>
  </div>
</template>
