<template id="results-template">
  <div data-composition-id="results" data-width="1920" data-height="1080" data-duration="3.4">
    <div id="rs-title"></div>
    <div id="rs-row"></div>

    <style>
      #rs-title { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 70px; font-weight: 640; letter-spacing: -0.035em; }
      #rs-title .serif { color: #FF5B2E; font-size: 1.1em; }
      #rs-row { position: absolute; left: 0; right: 0; top: 420px; display: flex; justify-content: center; gap: 36px; }
      .rs-card { width: 470px; height: 340px; border-radius: 30px; padding: 40px 42px; position: relative; overflow: hidden;
        background: linear-gradient(160deg, #18181F, #0E0E13); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 40px 80px rgba(0, 0, 0, 0.5); }
      .rs-card .glow { position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; filter: blur(30px); opacity: 0.55; }
      .rs-num { font-size: 132px; font-weight: 760; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; position: relative; }
      .rs-num small { font-size: 0.42em; font-weight: 640; letter-spacing: -0.02em; margin-left: 10px; color: #A6A4AD; }
      .rs-lab { margin-top: 26px; font-size: 32px; color: #A6A4AD; letter-spacing: -0.01em; position: relative; }
      .rs-bar { position: absolute; left: 42px; right: 42px; bottom: 40px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .rs-bar i { position: absolute; inset: 0; transform-origin: 0 50%; border-radius: 3px; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const root = document.getElementById("rs-row").closest("[data-composition-id]");
        const $ = (s) => root.querySelector(s);
        const C = FX.C;

        // sample figures, meant to be swapped for real campaign numbers
        const stats = [
          { to: 38, pre: "+", suf: "%", lab: "more trial sign-ups", col: C.orange, bar: 0.72 },
          { to: 2.1, pre: "", suf: "M", dec: 1, lab: "launch-day views", col: C.violet, bar: 0.86 },
          { to: 14, pre: "", suf: "days", lab: "from brief to premiere", col: C.lime, bar: 0.5 },
        ];
        $("#rs-row").innerHTML = stats
          .map((s) => `<div class="rs-card"><div class="glow" style="background:${s.col}"></div><div class="rs-num">${s.pre}<span class="v">0</span><small>${s.suf}</small></div><div class="rs-lab">${s.lab}</div><div class="rs-bar"><i style="background:${s.col}"></i></div></div>`)
          .join("");
        const cards = Array.from(root.querySelectorAll(".rs-card"));

        const tw = FX.words($("#rs-title"), ["Launches", "that", { t: "land.", cls: "serif" }]);
        tw.forEach((w, i) => {
          FX.put(tl, w, { opacity: 0, y: 40, filter: "blur(12px)" }, 0);
          tl.to(w, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.05 + i * 0.1);
        });

        cards.forEach((c, i) => {
          const s = stats[i], num = c.querySelector(".rs-num .v"), bar = c.querySelector(".rs-bar i");
          const t0 = 0.3 + i * 0.14;
          FX.put(tl, c, { opacity: 0, y: 180, rotationX: -30, transformPerspective: 1200, transformOrigin: "50% 100%" }, 0);
          tl.to(c, { opacity: 1, y: 0, rotationX: 0, duration: 0.7, ease: "expo.out" }, t0);
          FX.put(tl, bar, { scaleX: 0 }, 0);
          tl.to(bar, { scaleX: s.bar, duration: 1.1, ease: "power3.out" }, t0 + 0.2);
          // count up frame by frame
          const ease = gsap.parseEase("power3.out");
          FX.each(t0 + 0.1, t0 + 1.2, (f, t, k) => {
            tl.set(num, { textContent: FX.num(s.to * ease(k), s.dec) }, t);
          });
        });

        // out: cards tip forward and fall in sequence
        tl.to(cards, { y: -120, opacity: 0, filter: "blur(12px)", duration: 0.35, stagger: 0.05, ease: "power2.in" }, 2.95);
        tl.to(tw, { y: -60, opacity: 0, filter: "blur(12px)", duration: 0.3, stagger: 0.03, ease: "power2.in" }, 2.9);

        tl.set({}, {}, 3.4);
        window.__timelines = window.__timelines || {};
        window.__timelines["results"] = tl;
      })();
    </script>
  </div>
</template>
