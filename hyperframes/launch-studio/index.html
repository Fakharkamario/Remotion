<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Launch Studio</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/fx.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Newsreader"; font-style: italic; src: url("assets/fonts/newsreader-italic-latin.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07070A; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #07070A;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif; color: #F5F3EE; -webkit-font-smoothing: antialiased; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .full { position: absolute; inset: 0; }
      .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .serif { font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .ch, .w { display: inline-block; white-space: pre; will-change: transform; }
      .ws { white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="intro-comp"   class="clip" data-composition-id="intro"   data-composition-src="compositions/intro.html"   data-start="0"    data-duration="2"   data-track-index="0"></div>
      <div id="wall-comp"    class="clip" data-composition-id="wall"    data-composition-src="compositions/wall.html"    data-start="2"    data-duration="2.6" data-track-index="1"></div>
      <div id="premiere-comp" class="clip" data-composition-id="premiere" data-composition-src="compositions/premiere.html" data-start="4.6" data-duration="2.4" data-track-index="2"></div>
      <div id="process-comp" class="clip" data-composition-id="process" data-composition-src="compositions/process.html" data-start="7"    data-duration="3"   data-track-index="3"></div>
      <div id="frames-comp"  class="clip" data-composition-id="frames"  data-composition-src="compositions/frames.html"  data-start="10"   data-duration="2.6" data-track-index="4"></div>
      <div id="formats-comp" class="clip" data-composition-id="formats" data-composition-src="compositions/formats.html" data-start="12.6" data-duration="3.4" data-track-index="5"></div>
      <div id="results-comp" class="clip" data-composition-id="results" data-composition-src="compositions/results.html" data-start="16"   data-duration="3.4" data-track-index="6"></div>
      <div id="verbs-comp"   class="clip" data-composition-id="verbs"   data-composition-src="compositions/verbs.html"   data-start="19.4" data-duration="4"   data-track-index="7"></div>
      <div id="offer-comp"   class="clip" data-composition-id="offer"   data-composition-src="compositions/offer.html"   data-start="23.4" data-duration="3"   data-track-index="8"></div>
      <div id="outro-comp"   class="clip" data-composition-id="outro"   data-composition-src="compositions/outro.html"   data-start="26.4" data-duration="3.6" data-track-index="9"></div>
      <audio id="soundtrack" src="assets/audio.m4a" data-start="0" data-duration="30" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 30);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
