<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>benchlane replay</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/fx.js"></script>
    <script src="assets/motion.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Newsreader"; font-style: italic; src: url("assets/fonts/newsreader-italic-latin.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FDF6EF; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FDF6EF;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif; color: #16110D; -webkit-font-smoothing: antialiased; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .full { position: absolute; inset: 0; }
      .cream { background: #FDF6EF; }
      .serif { font-family: "Newsreader", Georgia, serif; font-style: italic; letter-spacing: -0.005em; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .line { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: baseline; white-space: nowrap; line-height: 1; }
      .slot { display: inline-grid; grid-template-columns: 1fr; }
      .slot > .w { min-width: 0; display: inline-block; white-space: pre; padding-right: 0.26em; }
      .slot > .w.last { padding-right: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.9" data-width="1920" data-height="1080">
      <div id="title-comp" class="clip" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="1.0333" data-track-index="0"></div>
      <div id="replay-comp" class="clip" data-composition-id="replay" data-composition-src="compositions/replay.html" data-start="1.0333" data-duration="5.4" data-track-index="1"></div>
      <div id="review-comp" class="clip" data-composition-id="review" data-composition-src="compositions/review.html" data-start="6.4333" data-duration="2.1" data-track-index="2"></div>
      <div id="checklist-comp" class="clip" data-composition-id="checklist" data-composition-src="compositions/checklist.html" data-start="8.5333" data-duration="1.3667" data-track-index="3"></div>
      <audio id="soundtrack" src="assets/audio.m4a" data-start="0" data-duration="9.9" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 9.9);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
