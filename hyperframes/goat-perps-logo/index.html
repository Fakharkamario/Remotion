<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>GOAT Funded Perps logo reveal</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/three.min.js"></script>
    <script src="assets/logo.js"></script>
    <script src="assets/reveal.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .layer { position: absolute; inset: 0; }
      /* the room (measured on the reference: near black, a warm haze from the upper left) */
      #room { background: radial-gradient(ellipse 70% 80% at 18% 8%, rgba(52,34,12,1) 0%, rgba(26,17,7,1) 40%, rgba(8,6,4,1) 75%, #050403 100%); }
      #room::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 30% 34% at 50% 50%, rgba(236,139,27,0.10), rgba(0,0,0,0) 70%); }
      #logo { width: 1920px; height: 1080px; }
      #logoglow { width: 1920px; height: 1080px; mix-blend-mode: screen; filter: blur(18px); }
      #lflash { background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(255,246,230,1), rgba(255,220,170,0.4) 50%, rgba(0,0,0,0) 80%); mix-blend-mode: screen; opacity: 0; }
      #vig { background: radial-gradient(ellipse 80% 82% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
      #grain { background-size: 320px 320px; mix-blend-mode: overlay; opacity: 0.14; }
      .bar { position: absolute; left: 0; right: 0; height: 62px; background: #000; }
      .bar.top { top: 0; } .bar.bot { bottom: 0; height: 58px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="1.8" data-width="1920" data-height="1080">
      <div id="stage" class="layer"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
