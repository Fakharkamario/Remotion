<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>reverse thinking</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/cutouts.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      @font-face { font-family: "Noto Sans TC"; src: url("assets/fonts/noto-sans-tc-subset-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1b1b1b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1b1b1b; font-family: "Noto Sans TC", system-ui, sans-serif; }
      .layer { position: absolute; inset: 0; }
      .camlayer { transform-origin: 0 0; will-change: transform; }
      #cam video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      #cut img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
      #wash { background: #fff; opacity: 0; pointer-events: none; }
      /* keeps the font weights loaded before the first frame is drawn */
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }
    </style>
    <link rel="stylesheet" href="assets/scene.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="14.7333" data-width="1920" data-height="1080">
      <div class="fontwarm">
        <span style="font-weight:300">你的</span><span style="font-weight:400">你的</span><span style="font-weight:500">你的</span><span style="font-weight:700">你的</span><span style="font-weight:900">你的</span>
      </div>
      <svg width="0" height="0" style="position:absolute">
        <filter id="smear" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="smearBlur" stdDeviation="0 0" /></filter>
      </svg>
      <!-- the take, then words that sit behind him, then his cutout, then everything in front -->
      <div id="cam" class="layer camlayer">
        <video id="aroll" src="assets/aroll.mp4" data-start="0" data-duration="14.7333" data-track-index="0" muted playsinline></video>
      </div>
      <div id="behind" class="layer"></div>
      <div id="cut" class="layer camlayer"></div>
      <div id="front" class="layer"></div>
      <div id="wash" class="layer"></div>
      <div id="stage" class="layer"></div>
      <audio id="soundtrack" src="assets/audio.m4a" data-start="0" data-duration="14.7333" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount({
        cam: document.getElementById("cam"),
        behind: document.getElementById("behind"),
        cut: document.getElementById("cut"),
        front: document.getElementById("front"),
        wash: document.getElementById("wash"),
        stage: document.getElementById("stage"),
      });
    </script>
  </body>
</html>
