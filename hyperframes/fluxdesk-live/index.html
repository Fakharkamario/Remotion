<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>fluxdesk live</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <script src="assets/brand.js"></script>
    <script src="assets/scene-open.js"></script>
    <script src="assets/scene-line.js"></script>
    <script src="assets/scene-forge.js"></script>
    <script src="assets/scene-logo.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0A0201; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0A0201; font-family: "Inter", system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .stage { position: absolute; inset: 0; }
      /* keeps the canvas fonts loaded before the first frame is drawn */
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="5.833333" data-width="1920" data-height="1080">
      <div class="fontwarm"><span style="font-weight:500">Aa</span><span style="font-weight:560">Aa</span><span style="font-weight:600">Aa</span></div>
      <div id="open-comp" class="clip" data-composition-id="open" data-composition-src="compositions/open.html" data-start="0.000000" data-duration="0.566667" data-track-index="0"></div>
      <div id="line-comp" class="clip" data-composition-id="line" data-composition-src="compositions/line.html" data-start="0.566667" data-duration="1.033333" data-track-index="1"></div>
      <div id="forge-comp" class="clip" data-composition-id="forge" data-composition-src="compositions/forge.html" data-start="1.600000" data-duration="1.800000" data-track-index="2"></div>
      <div id="logo-comp" class="clip" data-composition-id="logo" data-composition-src="compositions/logo.html" data-start="3.400000" data-duration="2.433333" data-track-index="3"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 5.833333);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
