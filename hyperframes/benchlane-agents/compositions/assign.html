    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const cur = $("#as-cur"), tag = $("#as-tag");
        cur.innerHTML = FX.cursor("#16110D", "#16110D");
        tl.set([cur, tag], { transformOrigin: "0 0" }, 0);
        // Cursor tip and "You" tag (top-left, scale) measured off the reference on every other frame;
        // odd frames are interpolated. Glide in, press on the tile (squish), ride the swell, slip out bottom-left.
        const CUR = [[0, 1316, 874, 1], [2, 1248, 811, 1], [4, 1137, 709, 1], [6, 1100, 674, 1], [8, 1051, 629, 1], [10, 1024, 604, 1], [12, 1016, 597, 1], [14, 1008, 589, 1],
          [16, 1007, 588, 1], [18, 1007, 588, 0.87], [20, 1007, 588, 0.8], [22, 1007, 588, 0.8], [24, 1011, 589, 0.85], [26, 1015, 590, 0.95], [28, 1033, 593, 1.28], [30, 1045, 568, 1.51],
          [32, 1048, 543, 1.51], [34, 1049, 496, 1.56], [36, 1049, 482, 1.56], [38, 1048, 466, 1.54], [40, 1044, 462, 1.46], [42, 1040, 464, 1.41], [44, 1020, 484, 1.05], [46, 1008, 495, 0.92],
          [48, 987, 517, 0.82], [50, 952, 552, 0.82], [52, 924, 579, 0.82], [54, 836, 658, 0.82], [56, 769, 718, 0.82], [58, 608, 868, 0.82], [60, 490, 981, 0.82], [62, 452, 1018, 0.82], [64, 410, 1090, 0.82]];
        const TAG = [[0, 1466, 1008, 1], [2, 1417, 963, 1], [4, 1288, 843, 1], [6, 1226, 786, 1], [8, 1139, 706, 1], [10, 1090, 660, 1], [12, 1075, 646, 1], [14, 1056, 628, 1],
          [16, 1051, 623, 1], [18, 1047, 620, 1], [22, 1048, 621, 1], [24, 1054, 626, 1.09], [26, 1062, 633, 1.19], [28, 1096, 658, 1.59], [30, 1119, 659, 1.86], [32, 1123, 647, 1.9],
          [34, 1126, 599, 1.93], [36, 1126, 571, 1.92], [38, 1123, 534, 1.9], [40, 1116, 517, 1.82], [42, 1109, 514, 1.74], [44, 1073, 517, 1.32], [46, 1059, 520, 1.14], [48, 1044, 527, 1.02],
          [50, 1024, 546, 1], [52, 1007, 563, 1], [54, 952, 618, 1], [56, 908, 662, 1], [58, 771, 799, 1], [60, 607, 963, 1], [62, 547, 1023, 1], [64, 500, 1100, 1]];
        const track = (el, K, dx) => {
          for (let k = 0; k < K.length - 1; k++) {
            const [f0, x0, y0, s0] = K[k], [f1, x1, y1, s1] = K[k + 1];
            for (let f = f0; f < f1; f++) {
              const u = (f - f0) / (f1 - f0), sc = s0 + (s1 - s0) * u;
              tl.set(el, { x: x0 + (x1 - x0) * u - dx * sc, y: y0 + (y1 - y0) * u - dx * sc, scale: sc }, F(f));
            }
          }
          const L = K[K.length - 1];
          tl.set(el, { x: L[1] - dx * L[3], y: L[2] - dx * L[3], scale: L[3], opacity: 0 }, F(L[0]));
        };
        track(cur, CUR, 3);
        track(tag, TAG, 0);

        // ---- cursor glides to the tile, clicks
        tl.to("#as-tile", { scale: 0.95, rotation: -4, duration: 0.06, ease: "power2.out" }, 0.55);
        tl.to("#as-tile", { scale: 1, rotation: -3, duration: 0.1, ease: "power2.out" }, 0.62);

        // ---- tile swells, words make room
        // tile swells then shrinks into the incoming window (scale / centre measured off the reference glyph)
        const TS = [[23, 1, 0], [24, 1.058, -2], [25, 1.148, -5], [26, 1.148, -5], [27, 1.316, -11], [28, 1.535, -21], [29, 1.7, -36], [30, 1.806, -50], [31, 1.806, -50],
          [32, 1.877, -73], [33, 1.877, -97], [34, 1.87, -112], [35, 1.86, -128], [36, 1.86, -128], [37, 1.826, -130], [38, 1.77, -133], [39, 1.703, -135], [40, 1.594, -137],
          [41, 1.594, -137], [42, 1.445, -132], [43, 1.206, -124], [44, 0.774, -104]];
        TS.forEach(([f, sc, dy]) => tl.set("#as-tile", { scale: sc, y: dy, rotation: f < 30 ? -3 * (30 - f) / 7 : 0 }, F(f)));
        tl.set("#as-tile", { opacity: 0 }, F(45));
        tl.to("#as-w1", { x: -114, duration: F(8), ease: "power2.inOut" }, F(23));
        tl.to("#as-w2", { x: 97, duration: F(8), ease: "power2.inOut" }, F(23));

        // ---- the brief window drops in from above in perspective
        tl.set("#as-win3d", { opacity: 1 }, 0.98);
        tl.fromTo("#as-plane", { rotationX: -58, y: -560, scale: 0.95 }, { rotationX: 0, y: 10, scale: 0.857, height: 860, duration: F(13), ease: "sine.inOut" }, F(30));
        tl.set("#as-w1", { color: C.orange, opacity: 0.85 }, F(34));
        tl.set("#as-w1", { opacity: 0.45 }, F(36));
        tl.set("#as-w1", { opacity: 0 }, F(37));
        tl.set("#as-w2", { color: C.orange, opacity: 0.85 }, F(37));
        tl.set("#as-w2", { opacity: 0.45 }, F(39));
        tl.set("#as-w2", { opacity: 0 }, F(40));

        // ---- flat window; tile becomes a pixel ring that blooms into the page
        tl.set("#as-win", { opacity: 1 }, F(44));
        tl.set(["#as-win3d", "#as-w1", "#as-w2"], { opacity: 0 }, F(44));
        // window path measured off the reference header bar: [frame, top, left, width] (whip at the end)
        const WP = [[44, 14, 183, 1553], [45, 51, 199, 1521], [47, 82, 217, 1486], [48, 104, 228, 1463], [49, 111, 220, 1479], [50, 111, 207, 1505], [52, 107, 194, 1532],
          [53, 101, 181, 1558], [54, 93, 168, 1583], [55, 87, 158, 1603], [57, 82, 151, 1618], [58, 80, 147, 1625], [59, 79, 147, 1625], [60, 79, 147, 1626], [62, 78, 146, 1627],
          [63, 77, 146, 1627], [64, 77, 145, 1628], [65, 77, 143, 1630], [67, 77, 139, 1634], [68, 77, 133, 1639], [69, 78, 125, 1646], [70, 79, 114, 1656], [72, 81, 100, 1668],
          [73, 83, 83, 1683], [74, 87, 60, 1703], [75, 93, 31, 1729], [77, 98, -16, 1771], [78, 107, -74, 1824], [79, 121, -135, 1876], [80, 154, -362, 2084]];
        tl.set("#as-win", { transformOrigin: "0 0" }, 0);
        WP.forEach(([f, y, x, w]) => tl.set("#as-win", { x: x - 178, y: y - 98, scale: w / 1563 }, F(f)));
        tl.set("#as-win .pg", { opacity: 0 }, 0);
        tl.set("#as-win .pg", { opacity: 1 }, 1.72);
        // Pixel ring, measured off the reference in screen space: [frames, x, y, w, h, top/bottom band, side band, colour].
        // 30px grid, 21px squares, notched outer corners and filled inner corners.
        const LIME = "#dcef3a";
        const RING = [[[45, 46], 568, 414, 783, 235, 1, 2, C.orange], [[47], 507, 368, 906, 371, 2, 3, C.orange], [[48], 411, 315, 1098, 510, 4, 5, C.orange],
          [[49], 264, 216, 1392, 729, 6, 8, C.orange], [[50, 51], 200, 202, 1517, 775, 4, 7, LIME], [[52], 188, 200, 1541, 787, 1, 1, LIME]];
        const ringHost = $("#as-ring");
        RING.forEach(([fs, x, y, w, h, bt, bs, col]) => {
          const cols = Math.round(w / 30), rows = Math.round(h / 30), px = w / cols, py = h / rows, sq = 21;
          let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
          for (let j = 0; j < rows; j++)
            for (let i = 0; i < cols; i++) {
              const edgeI = i === 0 || i === cols - 1, edgeJ = j === 0 || j === rows - 1;
              if (edgeI && edgeJ) continue; // notched outer corner
              const band = j < bt || j >= rows - bt || i < bs || i >= cols - bs;
              const innerCorner = (i === bs || i === cols - bs - 1) && (j === bt || j === rows - bt - 1);
              const lastBorder = bt === 1 && bs === 1 && (i < 2 || i >= cols - 2) && (j < 3 || j >= rows - 3);
              if (!band && !innerCorner && !lastBorder) continue;
              svg += `<rect x="${(i * px + (px - sq) / 2).toFixed(1)}" y="${(j * py + (py - sq) / 2).toFixed(1)}" width="${sq}" height="${sq}" fill="${col}"/>`;
            }
          const wrap = document.createElement("div");
          wrap.innerHTML = svg + "</svg>";
          const el = wrap.firstElementChild;
          el.style.left = x + "px";
          el.style.top = y + "px";
          ringHost.appendChild(el);
          tl.set(el, { opacity: 1 }, F(fs[0]));
          tl.set(el, { opacity: 0 }, F(fs[fs.length - 1] + 1));
        });

        // header fills in: bare white dot, then orange name, then the breadcrumb and badge settle

        tl.set("#as-win .pg", { opacity: 1 }, F(52));

        tl.set("#as-win .ovt", { opacity: 1, color: C.orange }, F(58));
        tl.set("#as-win .sub", { color: "#6d625a" }, F(60));
        tl.set("#as-win .ovt", { color: "#3c332d" }, F(60));
        tl.set("#as-win .shot", { opacity: 1 }, F(60));

        // pixelated peach gradient that sweeps over the mock and drains off to the right
        const mos = $("#as-mos");
        const W = 1500, H = 420;
        const mk = (seed, fn) => FX.mosaic(W, H, 30, seed, (x, y, r) => {
          const a = fn(x / W, y / H) * (0.82 + r() * 0.18);

          return `rgba(${236 + Math.round(r() * 8)},${128 + Math.round(r() * 26)},${100 + Math.round(r() * 22)},${Math.min(1, a).toFixed(2)})`;
        });
        const cl = (v) => Math.max(0, Math.min(1, v));
        const wave = (c, amp) => (u, v) => cl(1 - Math.abs(u - c) * 2.4) * amp;
        const MOS = [
          [56, 58, (u, v) => cl(0.55 - u * 2.2) * cl((v - 0.35) * 2)],

          [60, 62, wave(0.32, 0.95)],
          [62, 64, wave(0.48, 0.9)],
          [64, 67, wave(0.64, 0.8)],
          [67, 70, wave(0.8, 0.65)],
          [70, 72, wave(0.94, 0.4)],
        ];
        MOS.forEach(([a, b, fn], k) => {
          const c = mos.appendChild(mk(11 + k, fn));
          tl.set(c, { opacity: 0 }, 0);

          tl.set(c, { opacity: 0 }, F(b));

        // ---- whip into the header

        tl.set("#as-close", { opacity: 1 }, F(82));
