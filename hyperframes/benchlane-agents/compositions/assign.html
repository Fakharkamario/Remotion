    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C;
        const F = (n) => n / 30; // reference frames from the cut, 30 fps
        const root = document.getElementById("as-stage").parentElement;
        const $ = (s) => root.querySelector(s);
        $(".av.a1 > div").innerHTML = FX.icons.ripple;
        $(".av.a2 > div").innerHTML = FX.icons.atom.replace('stroke="#fff"', 'stroke="#1b1410"').replace('fill="#fff"', 'fill="#1b1410"');

        // clipboard glyph (original) for the project tile
        $("#as-tile .ico").innerHTML = `<svg viewBox="0 0 100 100" fill="none" stroke="#EA5E39" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">

        const cur = $("#as-cur"), tag = $("#as-tag");
        cur.innerHTML = FX.cursor("#16110D", "#16110D");
        tl.set(cur, { x: 1314, y: 888, scale: 1, transformOrigin: "0 0" }, 0);
        tl.set(tag, { x: 1520, y: 1030, transformOrigin: "0 0" }, 0);

        // ---- cursor glides to the tile, clicks
        tl.to(cur, { x: 1060, y: 606, duration: 0.5, ease: "power2.out" }, 0.02);
        tl.to(tag, { x: 1096, y: 650, duration: 0.62, ease: "power2.out" }, 0.04);
        tl.to("#as-tile", { scale: 0.95, rotation: -4, duration: 0.06, ease: "power2.out" }, 0.55);
        tl.to("#as-tile", { scale: 1, rotation: -3, duration: 0.1, ease: "power2.out" }, 0.62);

        // ---- tile swells, words make room
        // tile swells then shrinks into the incoming window (scale / centre measured off the reference glyph)
        const TS = [[23, 1, 0], [24, 1.058, -2], [25, 1.148, -5], [26, 1.148, -5], [27, 1.316, -11], [28, 1.535, -21], [29, 1.7, -36], [30, 1.806, -50], [31, 1.806, -50],
          [32, 1.877, -73], [33, 1.877, -97], [34, 1.87, -112], [35, 1.86, -128], [36, 1.86, -128], [37, 1.826, -130], [38, 1.77, -133], [39, 1.703, -135], [40, 1.594, -137],
          [41, 1.594, -137], [42, 1.445, -132], [43, 1.206, -124], [44, 0.774, -104]];
        TS.forEach(([f, sc, dy]) => tl.set("#as-tile", { scale: sc, y: dy, rotation: f < 30 ? -3 * (30 - f) / 7 : 0 }, F(f)));
        tl.set("#as-tile", { opacity: 0 }, F(45));
        tl.to("#as-w1", { x: -114, duration: F(8), ease: "power2.inOut" }, F(23));
        tl.to("#as-w2", { x: 97, duration: F(8), ease: "power2.inOut" }, F(23));
        tl.to(cur, { x: 1180, y: 690, scale: 1.6, duration: 0.42, ease: "power2.inOut" }, 0.66);
        tl.to(tag, { x: 1240, y: 760, scale: 1.7, duration: 0.42, ease: "power2.inOut" }, 0.66);

        // ---- the brief window drops in from above in perspective
        tl.set("#as-win3d", { opacity: 1 }, 0.98);
        tl.fromTo("#as-plane", { rotationX: -58, y: -560, scale: 0.95 }, { rotationX: 0, y: 10, scale: 0.857, height: 860, duration: F(13), ease: "sine.inOut" }, F(30));
        tl.set("#as-w1", { color: C.orange }, 1.12);
        tl.to("#as-w1", { opacity: 0, duration: 0.08 }, 1.14);
        tl.set("#as-w2", { color: C.orange }, 1.22);
        tl.to("#as-w2", { opacity: 0, duration: 0.1 }, 1.25);
        tl.to(cur, { x: 1096, y: 530, scale: 1.3, duration: 0.42, ease: "power2.out" }, 1.08);
        tl.to(tag, { x: 1130, y: 570, scale: 1.4, duration: 0.42, ease: "power2.out" }, 1.08);

        // ---- flat window; tile becomes a pixel ring that blooms into the page
        tl.set("#as-win", { opacity: 1 }, F(44));
        tl.set(["#as-win3d", "#as-w1", "#as-w2"], { opacity: 0 }, F(44));
        // window path measured off the reference header bar: [frame, top, left, width] (whip at the end)
        const WP = [[44, 14, 183, 1553], [45, 51, 199, 1521], [47, 82, 217, 1486], [48, 104, 228, 1463], [49, 111, 220, 1479], [50, 111, 207, 1505], [52, 107, 194, 1532],
          [53, 101, 181, 1558], [54, 93, 168, 1583], [55, 87, 158, 1603], [57, 82, 151, 1618], [58, 80, 147, 1625], [59, 79, 147, 1625], [60, 79, 147, 1626], [62, 78, 146, 1627],
          [63, 77, 146, 1627], [64, 77, 145, 1628], [65, 77, 143, 1630], [67, 77, 139, 1634], [68, 77, 133, 1639], [69, 78, 125, 1646], [70, 79, 114, 1656], [72, 81, 100, 1668],
          [73, 83, 83, 1683], [74, 87, 60, 1703], [75, 93, 31, 1729], [77, 98, -16, 1771], [78, 107, -74, 1824], [79, 121, -135, 1876], [80, 154, -362, 2084]];
        tl.set("#as-win", { transformOrigin: "0 0" }, 0);
        WP.forEach(([f, y, x, w]) => tl.set("#as-win", { x: x - 178, y: y - 98, scale: w / 1563 }, F(f)));
        tl.set("#as-win .pg", { opacity: 0 }, 0);
        tl.set("#as-win .pg", { opacity: 1 }, 1.72);
        const ring = $("#as-ring");
        ring.innerHTML = FX.pixelRing(1096, 504, 36, 9, 4, C.orange, 8, 0);
        tl.set(ring, { opacity: 1, scale: 0.7 }, 1.48);
        tl.to(ring, { scale: 1.45, duration: 0.19, ease: "none" }, 1.5);
        tl.set(ring.querySelectorAll("rect"), { attr: { fill: "#dff04a" } }, 1.65);
        tl.set(ring, { opacity: 0 }, 1.72);
        tl.to(cur, { x: 1010, y: 650, scale: 0.75, duration: 0.3, ease: "power2.out" }, 1.48);
        tl.to(tag, { x: 1050, y: 676, scale: 0.75, duration: 0.3, ease: "power2.out" }, 1.48);

        tl.fromTo("#as-win .ttl", { color: C.orange }, { color: C.ink, duration: 0.08 }, 1.95);
        tl.from("#as-win .sub", { opacity: 0, duration: 0.05 }, 1.8);
        tl.set(["#as-win .ovh", "#as-win .ovt"], { opacity: 0 }, 0);
        tl.set(["#as-win .ovh", "#as-win .ovt"], { opacity: 1 }, 1.84);
        tl.fromTo("#as-win .ovt", { color: C.orange }, { color: "#3c332d", duration: 0.08 }, 1.98);
        tl.set("#as-win .shot", { opacity: 0 }, 0);
        tl.set("#as-win .shot", { opacity: 1 }, 2.02);

            const a = Math.min(1, (k - cut) * 2.4) * (0.55 + r() * 0.45);
            return `rgba(${235 + Math.round(r() * 15)},${120 + Math.round(r() * 60)},${100 + Math.round(r() * 50)},${a.toFixed(2)})`;

        tl.set([m1, m2, m3], { opacity: 0 }, 0);
        tl.set(m1, { opacity: 1 }, 1.84);
        tl.set(m1, { opacity: 0 }, 2.02);
        tl.set(m2, { opacity: 1 }, 2.02);
        tl.set(m2, { opacity: 0 }, 2.14);
        tl.set(m3, { opacity: 1 }, 2.14);
        tl.to(m3, { opacity: 0, duration: 0.12 }, 2.24);
        tl.to(cur, { x: 1500, y: 1040, duration: 0.55, ease: "power1.inOut" }, 2.05);
        tl.to(tag, { x: 1540, y: 1080, duration: 0.55, ease: "power1.inOut" }, 2.08);

        // ---- whip into the header
        tl.set("#as-win", { opacity: 0 }, F(82));
        tl.set([cur, tag], { opacity: 0 }, F(79));
        tl.set("#as-close", { opacity: 1 }, F(82));
        // close-up camera, measured off the reference header band: [frame, top, bottom, right edge]
        const CAM = [[82, 170, 430, 1747], [83, 194, 483, 1732], [84, 209, 512, 1726], [85, 221, 534, 1720], [87, 232, 554, 1717], [88, 241, 570, 1714], [89, 250, 585, 1711],
          [90, 257, 597, 1710], [92, 264, 608, 1708], [93, 270, 618, 1707], [94, 275, 626, 1707], [95, 279, 633, 1706], [97, 283, 638, 1706], [98, 286, 643, 1706], [99, 288, 646, 1707],
          [100, 289, 648, 1708], [102, 289, 649, 1708], [103, 289, 650, 1709], [104, 289, 649, 1708], [105, 291, 647, 1700], [107, 291, 645, 1699], [108, 289, 645, 1701],
          [109, 286, 645, 1707], [110, 283, 645, 1713], [112, 280, 644, 1715], [113, 279, 642, 1717], [114, 276, 641, 1717], [115, 274, 639, 1717], [117, 272, 638, 1717],
          [118, 270, 635, 1714], [119, 268, 634, 1711], [120, 265, 632, 1705], [122, 264, 630, 1697], [123, 262, 629, 1687], [124, 260, 628, 1673], [125, 259, 627, 1655],
          [127, 257, 626, 1632], [128, 256, 625, 1601]];
        tl.set("#as-cl-cam", { transformOrigin: "0 0" }, 0);
        CAM.forEach(([f, t, b, r]) => {
          const sc = (b - t) / 330;
          tl.set("#as-cl-cam", { scale: sc, x: r - 1720 * sc, y: t - 228 * sc }, F(f));
        });

        // pill opens from the centre, empty first, then the label shows (clipped) as it widens
        tl.set("#as-pill", { xPercent: -50, yPercent: -50 }, 0);
        [[82, 717], [83, 864], [84, 970], [85, 1042], [87, 1085], [88, 1113], [89, 1126], [90, 1130]].forEach(([f, w]) => tl.set("#as-pill", { width: w }, F(f)));
        tl.set("#as-pill span", { opacity: 0 }, 0);
        tl.set("#as-pill span", { opacity: 1 }, F(83));

        // white cursor comes in and clicks
        const c2 = document.createElement("div");
        c2.className = "cursor";
        c2.innerHTML = FX.cursor("#fff", "#16110D");
        root.querySelector("#as-cl-cam").appendChild(c2);
        tl.set(c2, { x: 1500, y: 980, scale: 1.8, transformOrigin: "0 0", opacity: 0 }, 0);
        tl.set(c2, { opacity: 1 }, F(88));
        tl.to(c2, { x: 1170, y: 520, duration: 0.5, ease: "power2.out" }, F(88));
        tl.to("#as-pill", { scale: 0.97, duration: 0.05 }, 3.45);
        tl.to("#as-pill", { scale: 1, duration: 0.06 }, 3.5);
        tl.to("#as-pill", { backgroundColor: "#f3a185", duration: 0.05 }, 3.47);
        tl.to("#as-pill span", { color: "rgba(255,255,255,0.55)", duration: 0.05 }, 3.47);
        tl.to("#as-pill", { backgroundColor: C.orange, duration: 0.05 }, 3.56);
        tl.to("#as-pill span", { color: "#fff", duration: 0.05 }, 3.56);

        // pill collapses into agent avatars
        tl.to("#as-pill span", { opacity: 0, duration: 0.03 }, F(108));
        tl.to("#as-pill", { width: 380, x: -140, height: 190, borderRadius: 95, duration: F(1), ease: "power2.in" }, F(108));
        tl.set("#as-pill", { opacity: 0 }, F(109));
        const avs = root.querySelectorAll(".av");
        tl.set(avs[0], { opacity: 1, backgroundColor: C.orange, scale: 0.95 }, F(109));
        tl.set(avs[1], { opacity: 1, backgroundColor: C.orange, scale: 0.95 }, F(109));
        tl.set(avs[0].firstElementChild, { opacity: 0 }, 0);
        tl.set(avs[1].firstElementChild, { opacity: 0 }, 0);
        tl.to(avs[0], { backgroundColor: "#fbf5ef", scale: 1, duration: F(1) }, F(111));
        tl.set(avs[0].firstElementChild, { opacity: 1 }, F(112));
        tl.to(avs[1], { backgroundColor: "#fbf5ef", scale: 1, duration: F(1) }, F(112));
        tl.set(avs[1].firstElementChild, { opacity: 1 }, F(113));
        tl.set(avs[2].firstElementChild, { opacity: 0 }, 0);
        tl.fromTo(avs[2], { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: F(2) }, F(113));
        tl.set(avs[2].firstElementChild, { opacity: 1 }, F(116));
        tl.to("#as-close .warm", { opacity: 1, duration: 0.3, ease: "power1.out" }, F(108));
        tl.to(c2, { x: 1110, y: 540, duration: 0.6, ease: "sine.inOut" }, F(109));

        window.__timelines = window.__timelines || {};
        window.__timelines["assign"] = tl;
      })();
    </script>
  </div>
</template>
