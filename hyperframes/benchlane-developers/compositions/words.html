<template id="words-template">
  <div data-composition-id="words" data-width="1920" data-height="1080" data-duration="6.1667">
    <div class="full cream"></div>
    <div id="wd-dots" class="full"></div>
    <div id="wd-glyphs" class="full"></div>
    <div id="wd-conf" class="full"></div>
    <div id="wd-sq" class="full"></div>
    <div id="wd-l1" class="line wd-line"></div>
    <div id="wd-l2" class="line wd-line"></div>
    <div id="wd-l3" class="line wd-line"></div>
    <div id="wd-l3b" class="line wd-line"></div>
    <div id="wd-l4" class="line wd-line"></div>
    <div id="wd-ring" class="full"></div>
    <div id="wd-meet" class="full">
      <div id="wd-tl" class="wd-br"></div>
      <div id="wd-bl" class="wd-br"></div>
      <div id="wd-meet-t" class="serif">Meet</div>
    </div>

    <style>
      .wd-line { top: 507px; font-size: 48px; letter-spacing: -0.012em; }
      .wd-line .w { display: inline-block; white-space: pre; padding-right: 0.27em; opacity: 0; }
      .wd-line .w.last { padding-right: 0; }
      .wd-line .wi, .wd-line .dc { display: inline-block; }
      #wd-glyphs .row { position: absolute; left: 0; top: 0; font-family: "JetBrains Mono", monospace; font-size: 56px; font-weight: 650; color: #D66B4E; white-space: pre; letter-spacing: 0.04em; }
      #wd-glyphs .v { position: absolute; left: 0; top: 0; opacity: 0; }
      #wd-conf span { position: absolute; left: 0; top: 0; font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 300; opacity: 0; }
      #wd-l4 .t-b { display: none; }
      #wd-l1 .gw { font-family: "JetBrains Mono", monospace; font-weight: 600; letter-spacing: 0.08em; }
      #wd-l3 .br, #wd-l3b .br { padding-right: 1.3em; }
      #wd-l3 .br2, #wd-l3b .br2 { padding-left: 1.5em; }
      #wd-l3 .br > .wi, #wd-l3 .br2 > .wi { visibility: hidden; }
      #wd-l3b .w:not(.br):not(.br2) { visibility: hidden; }
      #wd-dots { opacity: 0; }
      #wd-ring { opacity: 0; }
      #wd-ring svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      #wd-meet { opacity: 0; }
      .wd-br { position: absolute; width: 230px; height: 286px; }
      .wd-br::before, .wd-br::after { content: ""; position: absolute; background: #EA5E39; }
      #wd-tl { left: 672px; top: 360px; }
      #wd-tl::before { left: 0; top: 0; width: 86px; height: 286px; }
      #wd-tl::after { left: 0; top: 0; width: 230px; height: 76px; }
      #wd-bl { left: 1027px; top: 434px; }
      #wd-bl::before { right: 0; top: 0; width: 86px; height: 286px; }
      #wd-bl::after { right: 0; bottom: 0; width: 230px; height: 76px; }
      #wd-meet-t { position: absolute; left: 896px; top: 470px; font-size: 118px; line-height: 1; color: #16110D; white-space: nowrap; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C;
        const B = 135; // reference frame where this scene starts
        const at = (n) => FX.at(n, B);
        const curve = (el, props) => FX.curve(tl, el, props, { base: B });
        const r = FX.rng(77);
        const SRC = 1 / 12; // glyphs re-roll every second source frame

        // Reveal: the word fades up in accent over two source frames, then settles to ink.
        const fadeIn = (el, a, ink) => {
          tl.set(el, { opacity: 0.45, color: C.orange }, at(a));
          tl.set(el, { opacity: 0.75 }, at(a) + 1 / 24);
          tl.set(el, { opacity: 1 }, at(a) + 2 / 24);
          tl.set(el, { color: C.ink }, at(ink));
        };

        // Builds a centred line; returns { ws: [.w], wi: [.wi] }
        const mkLine = (id, words, cls) => {
          const el = document.getElementById(id);
          el.innerHTML = words
            .map((w, i) => {
              const t = typeof w === "string" ? w : w.t;
              const c = (typeof w === "string" ? "" : w.cls || "") + (i === words.length - 1 ? " last" : "");
              return `<span class="w ${c}"><span class="wi">${t}</span></span>`;
            })
            .join("");
          const ws = Array.from(el.querySelectorAll(".w"));
          return { el, ws, wi: ws.map((w) => w.firstElementChild) };
        };

        // ------------------------------------------------- 1. glyph rows split, cross and collapse
        const gl = document.getElementById("wd-glyphs");
        const G = "&*[]<>#%&*<>";
        const rowText = (n) => Array.from({ length: n }, () => (r() < 0.15 ? " " : G[Math.floor(r() * G.length)])).join("");
        const ROWS = [
          { x: 643, y: 473, n: 9, dy: [[135, 0], [136, 0], [137, -27], [138, -35], [139, -38], [141, -39], [151, -39], [152, -30], [153, -10], [155, 0]],
            dx: [[143, 0], [145, 14], [147, 60], [149, 250], [151, 288], [152, 312], [155, 330]] },
          { x: 986, y: 556, n: 9, dy: [[135, 0], [136, 0], [137, 21], [138, 26], [139, 32], [141, 35], [151, 35], [152, 30], [153, 15], [155, 0]],
            dx: [[143, 0], [144, -60], [145, -190], [147, -320], [149, -360], [152, -362], [155, -362]] },
        ];
        ROWS.forEach((o) => {
          const row = document.createElement("div");
          row.className = "row";
          let html = "";
          for (let k = 0; k < 12; k++) html += `<span class="v">${rowText(o.n)}</span>`;
          row.innerHTML = html;
          gl.appendChild(row);
          tl.set(row, { x: o.x, y: o.y }, 0);
          const inner = document.createElement("div");
          inner.style.position = "absolute";
          while (row.firstChild) inner.appendChild(row.firstChild);
          row.appendChild(inner);
          curve(inner, { y: o.dy });
          curve(inner, { x: o.dx });
          const vs = Array.from(inner.children);
          let k = 0;
          for (let t = 0; t < at(152); t += SRC, k++) vs.forEach((v, i) => tl.set(v, { opacity: i === k % vs.length ? 1 : 0 }, t));
          tl.set(vs, { opacity: 0 }, at(152));
        });

        // -------------------------------------- 2. "Yet interviews still live in 2015." assembles
        const L1 = mkLine("wd-l1", ["Yet", "interviews", "still", "live", "in", "2015."]);
        // [appear frame, start dy (px), ink frame]
        const A1 = [[152, 16, 157], [153, 40, 158], [156, 6, 160], [154, -33, 159], [153, -45, 158], [152, -46, 157]];
        A1.forEach(([a, dy, ink], i) => {
          const w = L1.ws[i];
          tl.set(w, { opacity: 1, color: C.orange }, at(a));
          tl.set(w, { color: C.ink }, at(ink));
          curve(w, { y: [[a, dy], [a + 1, dy * 0.75], [a + 2, dy * 0.3], [a + 3, dy * 0.1], [a + 5, 0]] });
        });
        // the glyph rows break into placeholders for the words still resolving: one above "live", one below "still"
        const PH = [[3, "&<>&*[]", -0.95, 152, 154, "&<>&"], [2, "[]&<>&#", 0.85, 152, 156, "[]#"]];
        PH.forEach(([wi, g0, dy, a, b, g1]) => {
          L1.ws[wi].style.position = "relative";
          [[g0, a, a + 1], [g1, a + 1, b]].forEach(([g, t0, t1]) => {
            const ph = document.createElement("span");
            ph.className = "gw";
            ph.textContent = g;
            ph.style.cssText = "position:absolute;left:-0.4em;top:0;color:#EA5E39;opacity:0;font-family:'JetBrains Mono',monospace;font-weight:600;white-space:pre";
            L1.ws[wi].appendChild(ph);
            tl.set(ph, { y: dy + "em" }, 0);
            tl.set(ph, { opacity: 1 }, at(t0));
            tl.set(ph, { opacity: 0 }, at(t1));
          });
        });
        // placeholders show before their word does
        PH.forEach(([wi]) => tl.set(L1.ws[wi], { opacity: 1, color: "rgba(0,0,0,0)" }, at(152)));
        // slow push-in while it reads
        tl.set("#wd-l1", { transformOrigin: "960px 50%" }, 0);
        curve("#wd-l1", { scale: [[158, 1], [183, 1.021], [195, 1.028]] });
        // words blink out one by one, leaving their gaps
        // each flashes light accent for one frame, then is gone
        [[0, 178], [3, 182], [5, 184], [2, 187], [4, 189]].forEach(([i, f]) => {
          tl.set(L1.ws[i], { color: C.orange, opacity: 0.7 }, at(f));
          tl.set(L1.ws[i], { opacity: 0 }, at(f + 1));
        });
        // the survivor drifts right, accelerating, then breaks up in orange
        curve(L1.wi[1], { x: [[186, 0], [188, 1], [189, 3], [190, 4], [192, 5], [193, 8], [194, 11], [195, 15], [197, 22]] });
        tl.set(L1.ws[1], { color: C.orange }, at(195));
        tl.set(L1.ws[1], { opacity: 0 }, at(198));

        // ----------------------------------- 3. "Old-school coding quizzes" decodes in + confetti
        const L2 = mkLine("wd-l2", ["Old-school", "coding", "quizzes"]);
        [[198, 202], [202, 205], [205, 209]].forEach(([a, ink], i) => fadeIn(L2.ws[i], a, ink));
        // the line re-centres in jumps (one per word) with long tails; PAN2 = first word's offset from centre
        const PAN2 = 182;
        curve("#wd-l2", { x: [[[198, 0.2], [202, 0.33], [203, 0.45], [204, 0.46], [205, 0.875], [207, 0.92], [208, 0.94], [209, 0.957], [210, 0.966], [213, 0.983], [215, 0.991], [218, 0.996], [221, 1]], (v) => PAN2 * (1 - v)] });
        tl.set(L2.ws, { opacity: 0 }, at(223));

        const conf = document.getElementById("wd-conf");
        const chars = ["*", "\\", "}", "{", "*", "}", "\\", "}"];
        const cols = [C.ink, "#C9C43A", "#D9775A", C.ink, "#D9775A", "#C9C43A", "#D9775A", C.ink];
        for (let i = 0; i < 17; i++) {
          const sp = document.createElement("span");
          sp.textContent = chars[i % chars.length];
          sp.style.color = cols[(i * 3) % cols.length];
          conf.appendChild(sp);
          let t = at(198) + (i < 7 ? 0 : (1 + Math.floor(r() * 8)) * SRC);
          while (t < at(250)) {
            const wide = t > at(222);
            const ax = wide ? 900 : 430, ay = wide ? 470 : 175;
            const x = 960 + (r() * 2 - 1) * ax, y = 530 + (r() * 2 - 1) * ay;
            // keep clear of the line itself, as the reference does
            if (Math.abs(y - 540) < 70 && Math.abs(x - 960) < 470) continue;
            tl.set(sp, { x: x, y: y, opacity: 1 }, t);
            t += (2 + Math.floor(r() * 4)) * SRC;
          }
          tl.set(sp, { opacity: 0 }, at(250));
        }

        // -------------------------------------------------------- 4. "< can't reveal how >"
        // words live in wd-l3 (panned); the brackets live in an identical overlay (wd-l3b) that is not
        // panned, so their own measured paths are absolute.
        const W3 = [{ t: "&lt;", cls: "br" }, "can't", "reveal", "how", { t: "&gt;", cls: "br2" }];
        const L3 = mkLine("wd-l3", W3);
        const L3b = mkLine("wd-l3b", W3);
        [[1, 223, 227], [2, 227, 230], [3, 230, 234]].forEach(([i, a, ink]) => fadeIn(L3.ws[i], a, ink));
        curve("#wd-l3", { x: [[223, 115], [227, 83], [228, 56], [229, 53], [230, 46], [232, 30], [233, 23], [234, 18], [235, 14], [237, 11], [238, 9], [239, 6], [240, 5], [242, 3], [243, 2], [245, 1], [247, 0]] });
        // brackets: appear hugging the first word, get pushed out as words arrive, then converge into the cut
        tl.set([L3b.ws[0], L3b.ws[4]], { opacity: 1 }, at(223));
        curve(L3b.ws[0], { x: [[223, 148], [227, 94], [228, 67], [229, 64], [230, 37], [232, 21], [233, 14], [234, 9], [235, 5], [237, 3], [238, 1], [239, 0], [242, 0], [243, 1], [244, 4], [245, 7], [247, 11], [248, 18], [249, 36]] });
        curve(L3b.ws[4], { x: [[223, -165], [227, -45], [228, -45], [230, -13], [232, -6], [233, -3], [234, -1], [235, 0], [238, 2], [241, 1], [242, 0], [243, -1], [244, -3], [245, -6], [247, -9], [248, -15], [249, -29]] });
        tl.set(L3.ws, { opacity: 0 }, at(250));
        tl.set(L3b.ws, { opacity: 0 }, at(250));

        // --------------------------------------- 5. "developers truly build now" on a dot grid
        // faint, coarse dot grid that builds in over a few frames
        const host = document.getElementById("wd-dots");
        const dr = FX.rng(31);
        const layers = [252, 253, 255].map(() => {
          const c = FX.canvas(1920, 1080);
          c.style.position = "absolute";
          host.appendChild(c);
          return c;
        });
        for (let y = 8; y < 1080; y += 44) {
          for (let x = 8; x < 1920; x += 44) {
            const n = Math.sin(x * 0.004 + 1.3) * Math.sin(y * 0.006 + 0.4);
            if (dr() > 0.5 + n * 0.25) continue;
            const g = layers[Math.floor(dr() * 3)].getContext("2d");
            g.fillStyle = `rgba(214,170,145,${(0.1 + dr() * 0.08).toFixed(3)})`;
            g.fillRect(x, y, 28, 28);
          }
        }
        layers.forEach((c, i) => {
          tl.set(c, { opacity: 0 }, 0);
          tl.set(c, { opacity: 1 }, at([252, 253, 255][i]));
        });
        tl.set("#wd-dots", { opacity: 1 }, at(250));

        const L4 = mkLine("wd-l4", ["developers", { t: '<span class="t-a">truly</span><span class="t-b serif">truly</span>' }, "build", "now"]);
        // words pop in black, ~16px low, and settle within a few frames
        [250, 252, 253, 255].forEach((a, i) => {
          tl.set(L4.ws[i], { opacity: 1 }, at(a));
          curve(L4.wi[i], { y: [[a, 16], [a + 2, 8], [a + 3, 4], [a + 4, 2.5], [a + 5, 1], [a + 8, 0]] });
        });
        const ta = L4.ws[1].querySelector(".t-a"), tb = L4.ws[1].querySelector(".t-b");
        tl.set(tb, { display: "none", color: C.orange }, 0);
        tl.set(ta, { display: "none" }, at(262));
        tl.set(tb, { display: "inline" }, at(262));
        // then the words keep easing apart around "truly"
        const K = [[262, 0], [263, 6], [264, 9], [265, 11], [267, 12], [268, 14], [270, 16], [273, 18], [275, 20], [278, 21], [280, 23], [283, 24], [285, 25], [288, 27], [290, 29], [293, 31]];
        [[0, -1], [2, 0.7], [3, 0.95]].forEach(([i, m]) => curve(L4.ws[i], { x: [K, (v) => v * m] }));
        FX.squares(document.getElementById("wd-sq"), tl, [
          [1626, 660, 24, 24, [[at(257), at(280)]]],
          [486, 966, 24, 24, [[at(262), at(265)]]],
          [138, 618, 24, 24, [[at(265), at(294)]]],
          [1758, 48, 24, 24, [[at(280), at(294)]]],
        ]);

        // pixel ring bursts outward, ~1.22x per source frame
        const ring = document.getElementById("wd-ring");
        // [frame, width, height, cell, band rows]: cells grow slowly while the band thickens
        const RING = [[294, 937, 305, 15, 3], [295, 1114, 461, 19, 3], [297, 1382, 591, 22, 4], [298, 1713, 891, 25, 5], [299, 2000, 1150, 28, 5], [300, 2050, 1180, 30, 4]];
        RING.forEach(([fr, w, h, cell, band], i) => {
          const div = document.createElement("div");
          div.innerHTML = FX.pixelRing(w, h, cell, Math.max(3, Math.round(cell * 0.2)), band, C.orange, 5 + i, 0);
          div.style.opacity = 0;
          ring.appendChild(div);
          tl.set(div, { opacity: 1 }, at(fr));
          tl.set(div, { opacity: 0 }, at(RING[i + 1] ? RING[i + 1][0] : 302));
        });
        tl.set(ring, { opacity: 1 }, at(294));
        L4.ws.forEach((w) => tl.set(w, { color: C.orange }, at(294)));
        tl.set([ring, "#wd-dots"], { opacity: 0 }, at(302));
        tl.set(L4.ws, { opacity: 0 }, at(302));

        // -------------------------------------------------------------------- 6. Meet
        // corners spring apart (decaying), the group drifts left, then the right corner whips back in
        tl.set("#wd-meet", { opacity: 1 }, at(302));
        curve("#wd-tl", { x: [[302, 0], [303, -66], [304, -94], [305, -113], [307, -128], [308, -139], [309, -147], [310, -154], [312, -159], [313, -163], [314, -167], [315, -172], [317, -181], [318, -194], [319, -220]] });
        curve("#wd-bl", { x: [[302, 0], [303, 66], [304, 93], [305, 113], [307, 127], [308, 138], [309, 147], [310, 153], [312, 159], [313, 161], [314, 157], [315, 143], [317, 117], [318, 71], [319, -15]] });
        curve("#wd-meet-t", { x: [[302, 0], [303, -26], [304, -37], [305, -44], [307, -49], [308, -53], [309, -56], [310, -59], [312, -60], [313, -61], [314, -63], [315, -68], [317, -75], [318, -86]] });
        tl.set("#wd-meet-t", { color: C.orange }, at(318));
        tl.set("#wd-meet-t", { opacity: 0 }, at(319));

        // a fresh timeline seeked to 0 skips its zero-time sets; prime it so frame 0 is correct
        tl.seek(0.001).seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["words"] = tl;
      })();
    </script>
  </div>
</template>
