<template id="logo-dark-template">
  <div data-composition-id="logo-dark" data-width="1920" data-height="1080" data-duration="2.0">
    <div class="full dark"></div>
    <div id="ld-bg" class="full"></div>
    <div id="ld-lock">
      <div id="ld-mark"></div>
      <div id="ld-word"></div>
    </div>
    <div id="ld-line" class="line"></div>

    <style>
      #ld-bg { background: radial-gradient(42% 38% at 78% 82%, rgba(110, 38, 18, 0.55), rgba(110, 38, 18, 0) 70%),
          radial-gradient(40% 50% at 12% 18%, rgba(70, 22, 18, 0.45), rgba(70, 22, 18, 0) 70%); }
      #ld-lock { position: absolute; left: 0; right: 0; top: 488px; height: 104px; display: flex; justify-content: center; align-items: center; color: #fff; }
      #ld-mark { width: 104px; height: 104px; position: relative; flex: none; }
      #ld-mark svg { width: 100%; height: 100%; overflow: visible; display: block; }
      #ld-word { display: flex; white-space: pre; font-size: 104px; font-weight: 500; letter-spacing: -0.035em; line-height: 1; margin-left: 40px; }
      #ld-word .lt { display: inline-block; }
      #ld-line { top: 503px; font-size: 58px; color: #fff; letter-spacing: -0.01em; }
      #ld-line .serif { font-size: 1.08em; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C;

        tl.fromTo("#ld-bg", { x: 0, y: 0 }, { x: -60, y: -30, duration: 2, ease: "none" }, 0);

        const B = 320; // reference frame where this scene starts
        const at = (n) => FX.at(n, B);
        const curve = (el, props) => FX.curve(tl, el, props, { base: B });

        // Mark: two corners hold apart for a frame, merge oversized, then shrink into place with a long settle.
        const mk = document.getElementById("ld-mark");
        mk.innerHTML = FX.mark("#fff");
        const a = mk.querySelector(".mk-a"), b = mk.querySelector(".mk-b"), c = mk.querySelector(".mk-c");
        tl.set([a, b], { x: 0, y: 0 }, 0);
        tl.set(a, { x: 25, y: 11 }, 0);
        tl.set(b, { x: 89, y: -10 }, 0);
        tl.set(c, { opacity: 0 }, 0);
        tl.set(a, { x: -6, y: -4 }, at(322));
        tl.set(b, { x: 6, y: 4 }, at(322));
        tl.set([a, b], { x: 0, y: 0 }, at(323));
        tl.set(c, { opacity: 1 }, at(323));
        curve(mk, { scale: [[320, 1.4], [322, 1.4], [323, 1.12], [324, 1.07], [325, 1.05], [327, 1.035], [328, 1.025], [330, 1.015], [333, 1.008], [343, 1]] });
        curve(mk, { x: [[322, -12], [323, -14], [324, -14.5], [325, -12.5], [327, -9.5], [328, -7], [329, -5.5], [330, -4], [333, -2.5], [337, -1.5], [343, 0], [347, 0], [349, -1], [350, -2], [352, -4], [353, -7], [354, -16]] });

        // Wordmark types in one letter per source frame, accent first, white three source frames later.
        const letters = "benchlane".split("");
        const word = document.getElementById("ld-word");
        word.innerHTML = letters.map((ch) => `<span class="lt">${ch}</span>`).join("");
        const LT = Array.from(word.children);
        const T = [322, 323, 324, 325, 327, 328, 329, 330, 332];
        LT.forEach((el, i) => {
          tl.set(el, { opacity: 0, color: C.orange }, 0);
          tl.set(el, { opacity: 1 }, at(T[i]));
          tl.set(el, { color: "#fff" }, at(T[i]) + 3 / 24);
        });
        // drifts right a touch while typing, then squeezes into the mark, accelerating into the cut
        curve(word, { x: [[322, -6], [325, -5], [328, -3], [330, -2], [333, -1], [337, 0], [347, 0], [348, -2], [349, -4], [350, -8], [352, -14], [353, -24], [354, -50]] });
        tl.set("#ld-lock", { opacity: 0 }, at(355));

        // "Find the real builders": words land in place in accent, settle to white; the line pans left
        // the whole time (fast re-centre, slow drift, accelerating out).
        const ls = FX.line(document.getElementById("ld-line"), ["Find", "the", "real", { t: "builders", cls: "serif" }]);
        ls.forEach((sl) => tl.set(sl.firstElementChild, { opacity: 0 }, 0));
        [[0, 355, 359], [1, 357, 360], [2, 357, 360], [3, 358, 362]].forEach(([i, f, w]) => {
          const el = ls[i].firstElementChild;
          tl.set(el, { opacity: 1, color: C.orange }, at(f));
          tl.set(el, { color: "#fff" }, at(w));
        });
        curve("#ld-line", { x: [[355, 83.5], [356, 83.5], [357, 67.5], [358, 59.5], [359, 52.5], [360, 47.5], [362, 43.5], [363, 39.5], [364, 36.5], [365, 34.5], [367, 31.5], [368, 29.5], [369, 27.5], [370, 25.5], [372, 22.5], [373, 19.5], [374, 16.5], [375, 12.5], [377, 6.5], [378, -0.5], [379, -16.5], [380, -30]] });

        // a fresh timeline seeked to 0 skips its zero-time sets; prime it so frame 0 is correct
        tl.seek(0.001).seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["logo-dark"] = tl;
      })();
    </script>
  </div>
</template>
