<template id="icons-template">
  <div data-composition-id="icons" data-width="1920" data-height="1080" data-duration="2.70833">
    <div class="full dark"></div>
    <div id="ic-glow" class="full"></div>
    <div id="ic-field" class="full"></div>
    <div id="ic-sq" class="full"></div>
    <div id="ic-line" class="line"></div>

    <style>
      #ic-glow { background: radial-gradient(70% 45% at 50% 108%, rgba(120, 38, 16, 0.55), rgba(120, 38, 16, 0) 70%); }
      #ic-line { top: 509px; font-size: 47px; color: #fff; letter-spacing: -0.01em; }
      #ic-line .w0 { padding-right: 0.26em; }
      #ic-line .w0, #ic-line .w1, #ic-line .wi, #ic-line .ch { display: inline-block; }
      .ic-tile { position: absolute; left: 0; top: 0; width: 100px; height: 100px; }
      .ic-face { position: absolute; inset: 0; border-radius: 23%; overflow: hidden; }
      /* orange face: flat peach in faint vertical columns, dissolved cell by cell */
      .ic-or { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); }
      .ic-or > i { display: block; }
      .ic-ghost { position: absolute; left: 0; top: 0; width: 100px; height: 100px; border-radius: 23%; overflow: hidden; display: grid; grid-template-columns: repeat(6, 1fr); filter: brightness(0.5) blur(2px); }
      .ic-ghost > i { display: block; }
      /* resolved tile: near-black, thin pale outline, soft halo */
      .ic-ic { background: linear-gradient(165deg, #1a1411 0%, #0d0a08 55%, #0b0907 100%); border: 1.5px solid rgba(255, 206, 186, 0.3);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 0 28px rgba(234, 94, 57, 0.07); }
      .ic-ic .gl { position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; }
      .ic-ic .gl svg { width: 100%; height: 100%; display: block; }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const C = FX.C;

        // Tile paths sampled from the reference (local time, centre x, centre y, size; half-scale px).
        // The field sweeps clockwise around the line: fast as it lands, slow mid-way, accelerating out.
        const P = {
          devkit: [[0, 230, 255, 125], [0.1, 283, 220, 110], [0.2, 403, 165, 92], [0.3, 475, 140, 92], [0.4, 540, 122, 92], [0.55, 638, 96, 92], [0.7, 705, 82, 90], [1.0, 768, 72, 92], [1.4, 822, 66, 92], [2.0, 920, 58, 90], [2.3, 965, 55, 90], [2.7, 1025, 48, 90]],
          bot: [[0, 430, 170, 70], [0.1, 520, 140, 85], [0.2, 678, 103, 90], [0.3, 755, 90, 90], [0.4, 815, 82, 92], [0.55, 897, 75, 92], [0.7, 940, 75, 92], [1.0, 985, 80, 92], [1.4, 1060, 80, 92], [2.7, 1200, 80, 92]],
          atom: [[0, 812, 140, 90], [0.1, 865, 140, 92], [0.2, 918, 168, 90], [0.4, 920, 205, 100], [0.55, 900, 235, 130], [0.7, 868, 258, 140], [1.0, 823, 285, 148], [1.4, 773, 310, 160], [2.0, 657, 362, 180], [2.3, 575, 397, 185], [2.6, 443, 447, 185], [2.7, 395, 462, 185]],
          ripple: [[0, 835, 200, 100], [0.1, 840, 222, 110], [0.2, 802, 270, 140], [0.3, 760, 298, 155], [0.4, 718, 320, 165], [0.55, 640, 355, 180], [0.7, 580, 378, 185], [1.0, 513, 400, 188], [1.4, 450, 420, 188], [2.0, 313, 455, 188], [2.3, 228, 470, 185], [2.6, 100, 490, 185], [2.7, 52, 495, 185]],
          wave: [[0, 115, 330, 150], [0.1, 95, 280, 130], [0.2, 158, 268, 120], [0.3, 198, 242, 120], [0.4, 240, 218, 110], [0.55, 318, 183, 95], [0.7, 380, 160, 90], [1.0, 445, 138, 90], [1.4, 510, 118, 90], [2.0, 645, 82, 88], [2.3, 732, 62, 90], [2.6, 860, 38, 90], [2.7, 905, 30, 90]],
          chevrons: [[0, 90, 385, 170], [0.2, 40, 370, 170], [0.3, 25, 350, 160], [0.4, 40, 330, 155], [0.55, 60, 300, 140], [0.7, 90, 280, 140], [0.85, 120, 262, 135], [1.0, 135, 255, 130], [1.4, 186, 228, 118], [2.0, 302, 176, 98], [2.3, 384, 141, 90], [2.6, 516, 92, 90], [2.7, 565, 75, 90]],
          cube: [[0, 480, 370, 105], [0.1, 420, 395, 130], [0.2, 510, 380, 140], [0.3, 470, 400, 165], [0.4, 420, 410, 185], [0.55, 320, 440, 185], [0.7, 255, 450, 185], [1.0, 190, 460, 190], [1.4, 137, 470, 190], [2.0, 30, 480, 190], [2.6, -150, 500, 190], [2.7, -185, 505, 190]],
          bolt: [[0, 150, 410, 170], [0.1, 200, 425, 178], [0.2, 260, 440, 185], [0.3, 205, 445, 185], [0.4, 145, 440, 185], [0.55, 75, 440, 165], [0.7, 40, 440, 160], [1.0, 15, 430, 150], [1.4, -60, 440, 150], [2.7, -260, 450, 150]],
          dots: [[0, -200, 380, 150], [1.0, -80, 360, 150], [1.4, -10, 340, 150], [2.0, 40, 300, 150], [2.3, 72, 270, 140], [2.6, 158, 213, 115], [2.7, 195, 192, 112]],
          prism: [[0, 1180, 120, 150], [1.0, 1060, 170, 150], [1.4, 990, 200, 150], [2.0, 925, 235, 150], [2.3, 887, 268, 140], [2.6, 801, 325, 165], [2.7, 765, 345, 168]],
        };
        // when each orange tile resolves into its icon (late arrivals are resolved already)
        const FLIP = { devkit: 0.3, atom: 0.38, ripple: 0.5, chevrons: 0.5, bolt: 0.5, wave: 0.62, bot: 0.62, cube: 0.65 };

        // Catmull-Rom through the samples, written out as one set per frame so any frame seeks exactly.
        const sample = (k, t) => {
          let i = 0;
          while (i < k.length - 2 && t > k[i + 1][0]) i++;
          const p1 = k[i], p2 = k[i + 1], p0 = k[Math.max(0, i - 1)], p3 = k[Math.min(k.length - 1, i + 2)];
          const u = Math.min(1, Math.max(0, (t - p1[0]) / (p2[0] - p1[0])));
          const cr = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
          return [1, 2, 3].map((j) => cr(p0[j], p1[j], p2[j], p3[j]) * 2);
        };

        const field = document.getElementById("ic-field");
        const SF = 1 / 24; // one source frame
        const TINT = [[244, 168, 139], [238, 128, 94], [232, 112, 76], [242, 150, 118]];
        Object.keys(P).forEach((name, i) => {
          const tr = FX.rng(40 + i);
          const base = TINT[i % TINT.length];
          const cols = Array.from({ length: 6 }, () => 0.84 + tr() * 0.2);
          const cellCol = (k) => base.map((v) => Math.min(255, Math.round(v * cols[k % 6]))).join(",");
          // each cell bleeds 1px into its neighbours so no seams show between them
          const cells = Array.from({ length: 36 }, (_, k) => `<i style="background:rgb(${cellCol(k)});box-shadow:0 0 0 1.2px rgb(${cellCol(k)})"></i>`).join("");
          const el = document.createElement("div");
          el.className = "ic-tile";
          el.innerHTML = `<div class="ic-face ic-ic"><div class="gl">${FX.icons[name]}</div></div><div class="ic-face ic-or">${cells}</div>`;
          const flip = FLIP[name];
          // motion smear: a dark copy one source frame behind while the tile is still rushing in
          let ghost = null;
          if (flip != null) {
            ghost = document.createElement("div");
            ghost.className = "ic-ghost";
            ghost.innerHTML = Array.from({ length: 6 }, (_, k) => `<i style="background:rgb(${cellCol(k)})"></i>`).join("");
            field.appendChild(ghost);
          }
          field.appendChild(el);
          const ic = el.children[0], or = el.children[1];
          // positions on the reference's 24 fps grid
          for (let k = 0; k <= 65; k++) {
            const t = k * SF;
            const [x, y, s] = sample(P[name], t);
            tl.set(el, { x: x - 50, y: y - 50, scale: s / 100 }, t);
            if (ghost && k <= 5) {
              const [gx, gy, gs] = sample(P[name], Math.max(0, t - 0.8 * SF));
              tl.set(ghost, { x: gx - 50, y: gy - 50, scale: gs / 100, opacity: [0.6, 0.5, 0.35, 0.22, 0.1, 0.04][k] }, t);
            }
          }
          if (ghost) tl.set(ghost, { opacity: 0 }, 6 * SF);
          if (flip != null) {
            // lands dim, brightens over three source frames, then dissolves cell by cell into the icon tile
            tl.set(el, { opacity: 0.45 }, 0);
            tl.set(el, { opacity: 0.75 }, SF);
            tl.set(el, { opacity: 1 }, 3 * SF);
            tl.set(ic, { opacity: 0 }, 0);
            const f0 = Math.round(flip * 24);
            tl.set(ic, { opacity: 1 }, f0 * SF);
            const dr = FX.rng(70 + i);
            Array.from(or.children).forEach((c, k) => {
              // columns go roughly left to right with jitter, like the reference's blocky wipe
              const step = Math.min(3, Math.floor((k % 6) / 2 + dr() * 1.6));
              tl.set(c, { opacity: 1 }, 0);
              tl.set(c, { opacity: 0.55 }, (f0 + step) * SF);
              tl.set(c, { opacity: 0 }, (f0 + step + 1) * SF);
            });
          } else {
            tl.set(or, { opacity: 0 }, 0);
          }
        });

        // "alongside AI" (curves measured off the reference; frame numbers are reference frames)
        const B = 54;
        const line = document.getElementById("ic-line");
        line.innerHTML = `<span class="w0"><span class="wi">${"alongside".split("").map((c) => `<span class="ch">${c}</span>`).join("")}</span></span><span class="w1 accent"><span class="wi">AI</span></span>`;
        const w0 = line.querySelector(".w0"), w1 = line.querySelector(".w1");
        // first word lands ~27px low with its letters scattered, turns white, then a long settle
        tl.set(w0, { opacity: 1, color: C.orange }, 0);
        tl.set(w0, { color: "#fff" }, FX.at(57, B));
        const lr = FX.rng(3);
        line.querySelectorAll(".ch").forEach((c) => {
          const d = (lr() - 0.3) * 0.5;
          tl.set(c, { y: d + "em" }, 0);
          tl.set(c, { y: d * 0.3 + "em" }, FX.at(55, B));
          tl.set(c, { y: 0 }, FX.at(57, B));
        });
        FX.curve(tl, w0, { y: [[54, 27], [55, 23], [57, 17], [58, 14], [59, 11.5], [62, 7], [63, 6.5], [64, 5], [65, 4], [67, 3], [69, 2], [72, 1], [74, 0]] }, { base: B });
        tl.set(w1, { opacity: 0 }, 0);
        tl.set(w1, { opacity: 1 }, FX.at(60, B));
        FX.curve(tl, w1, { y: [[60, 14], [62, 12], [63, 10], [64, 8], [65, 7], [67, 5], [69, 3], [72, 1], [74, 0.5], [77, 0]] }, { base: B });
        // exit: first word flies up, "AI" drops, both accelerating into the cut
        FX.curve(tl, w0.firstElementChild, { y: [[128, 0], [129, -2], [130, -4], [132, -9], [133, -17], [134, -28], [135, -45]] }, { base: B });
        FX.curve(tl, w1.firstElementChild, { y: [[128, 0], [129, 1], [130, 4], [132, 8.5], [133, 17], [134, 39.5], [135, 55]] }, { base: B });

        FX.randomSquares(document.getElementById("ic-sq"), tl, {
          seed: 9, count: 16, x0: 120, x1: 1800, y0: 120, y1: 960, size: 18,
          t0: 0.45, t1: 2.7, stagger: 0.5, minOn: 0.2, maxOn: 0.9, minOff: 0.1, maxOff: 0.6,
        });

        // a fresh timeline seeked to 0 skips its zero-time sets; prime it so frame 0 is correct
        tl.seek(0.001).seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["icons"] = tl;
      })();
    </script>
  </div>
</template>
