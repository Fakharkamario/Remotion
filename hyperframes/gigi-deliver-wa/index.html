<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>gigi delivery</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/ref-keys.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f4f4f6; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f4f4f6; font-family: "Inter", system-ui, sans-serif; color: #26272b; }
      .layer { position: absolute; inset: 0; }
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }
      #bg { background: radial-gradient(120% 95% at 45% 35%, #ffffff 0%, #f5f5f7 50%, #e9e9ed 100%); }
      /* the messenger wallpaper sits behind the chat and lifts away with it */
      #doodle { background: #efe7de url("assets/img/doodle.jpg") repeat; background-size: 700px auto; background-blend-mode: multiply; }
      .blob { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(110px); }

      #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
      /* bubbles from the launch video: frosted white incoming, brand-blue outgoing, tail on the newest */
      /* messenger look: rounded white bubbles with time stamps, ours in pale green with read ticks */
      .bub { position: absolute; left: 0; top: 0; height: 120px; border-radius: 30px; white-space: nowrap; padding: 0 150px 0 40px; background: #ffffff;
        box-shadow: 0 2px 2px rgba(11,20,26,.10), 0 8px 24px rgba(11,20,26,.06);
        font-size: 50px; font-weight: 400; letter-spacing: -0.01em; line-height: 116px; color: #111b21; transform-origin: 0 50%; }
      .bub .tail { position: absolute; left: -10px; bottom: -2px; width: 38px; height: 33px; overflow: visible; display: none; }
      .bub.last .tail { display: block; }
      .bub .tail path { fill: #ffffff; }
      .bub .w { display: inline-block; white-space: pre; }
      .bub .ts { position: absolute; right: 30px; bottom: 18px; font-size: 24px; line-height: 1; color: #8696a0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
      .bub .ts svg { width: 32px; height: 22px; }
      .bub.blue { background: #d9fdd3; color: #111b21; transform-origin: 100% 50%; padding-right: 180px; box-shadow: 0 2px 2px rgba(11,20,26,.10), 0 8px 24px rgba(11,20,26,.06); }
      .bub.blue .tail { left: auto; right: -10px; transform: scaleX(-1); display: block; }
      .bub.blue .tail path { fill: #d9fdd3; }
      .bub.notail .tail { display: none !important; }
      .bub .dots { display: flex; gap: 12px; align-items: center; height: 120px; }
      .bub .dots i { width: 22px; height: 22px; border-radius: 50%; background: #9fbf9a; display: block; }
      .badge { position: absolute; width: 62px; height: 62px; border-radius: 50%; background: #fff; display: grid; place-items: center;
        box-shadow: 0 6px 16px rgba(30,32,40,.1), 0 1px 3px rgba(30,32,40,.06); }
      .badge img { width: 38px; height: 38px; }
      .badge::after { content: ""; position: absolute; left: -10px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }

      /* the video message: thumbnail in our pale-green bubble frame, play button, length */
      #card { position: absolute; left: 0; top: 0; border-radius: 34px; background: #d9fdd3; padding: 10px; transform-origin: 100% 100%;
        box-shadow: 0 2px 2px rgba(11,20,26,.10), 0 8px 24px rgba(11,20,26,.06); }
      #card .th { position: relative; width: 100%; height: 100%; border-radius: 26px; overflow: hidden; background: #131217; }
      #card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%); }
      #card .pl { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(11,20,26,.55); display: grid; place-items: center; backdrop-filter: blur(4px); }
      #card .pl svg { width: 60px; height: 60px; margin-left: 6px; }
      #card .len { position: absolute; left: 24px; bottom: 18px; display: flex; align-items: center; gap: 10px; color: #fff; font-size: 26px; font-weight: 500; }
      #card .len svg { width: 34px; height: 34px; }
      .bub.cap { padding-left: 40px; }
      .bub .emo { width: 50px; height: 50px; vertical-align: -6px; }

      /* composer */
      #composer { position: absolute; left: 0; top: 0; }
      #composer .plus { position: absolute; left: 0; top: 0; width: 104px; height: 104px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; color: #55565c;
        box-shadow: 0 10px 28px rgba(30,32,40,.07), 0 2px 6px rgba(30,32,40,.05); }
      #composer .plus svg { width: 40px; height: 40px; }
      #composer .barc { position: absolute; left: 130px; top: -8px; width: 1020px; height: 120px; border-radius: 60px; background: #ffffff; display: flex; align-items: center; padding: 0 30px 0 44px;
        box-shadow: 0 14px 36px rgba(30,32,40,.07), 0 3px 10px rgba(30,32,40,.045), 0 0 0 1px rgba(255,255,255,.9); }
      #composer .att { flex: none; height: 92px; margin: 0 22px 0 -30px; padding: 0 26px 0 8px; border-radius: 46px; background: #f0f2f5; display: flex; align-items: center; gap: 16px; transform-origin: 0 50%; }
      #composer .att img { width: 120px; height: 76px; border-radius: 38px; object-fit: cover; }
      #composer .att span { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; }
      #composer .att b { font-size: 30px; font-weight: 600; color: #111b21; }
      #composer .att small { font-size: 21px; color: #667781; font-weight: 500; }
      #composer .tx { flex: 1; font-size: 44px; font-weight: 500; color: #26272b; white-space: nowrap; overflow: hidden; letter-spacing: -0.012em; }
      #composer .tx .paste { border-radius: 6px; }
      #composer .tx .caret { display: inline-block; width: 3px; height: 50px; background: #2f93fb; vertical-align: -9px; margin-left: 2px; }
      #composer .send { width: 64px; height: 64px; display: grid; place-items: center; }
      #composer .send svg { width: 46px; height: 46px; }

      #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
      #cursor svg { position: absolute; left: -12px; top: -12px; width: 92px; height: 92px; overflow: visible; filter: drop-shadow(0 4px 8px rgba(20,110,230,.25)); }
      #wash { pointer-events: none; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(110,180,255,.85) 36%, rgba(205,190,255,.8) 52%, rgba(190,240,210,.75) 66%, rgba(255,255,255,0) 86%); background-size: 320% 100%; filter: blur(24px); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="4.8667" data-width="1920" data-height="1080">
      <div class="fontwarm"><span style="font-weight:500">Aa</span><span style="font-weight:600">Aa</span></div>
      <div id="stage" class="layer"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
