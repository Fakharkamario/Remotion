          if (f >= 64) {
            const bo = f <= 67 ? (68 - f) * 30 : 0;
            g.fillStyle = K.mix("#22100C", "#F6EEEC", l);
            if (f >= 68) g.fillRect(B[0], B[1], B[2], B[3]);
            const ig = g.createLinearGradient(B[0], B[1], B[0], B[1] + 262);
            ig.addColorStop(0, K.mix("#1C2034", "#E8ECF4", l)); ig.addColorStop(1, K.mix("#16241E", "#E4F2EA", l));
            g.fillStyle = ig; g.fillRect(B[0], B[1], B[2], 262);
            g.save();
            g.beginPath(); g.rect(B[0], B[1], B[2], 262); g.clip();
            g.strokeStyle = K.rgba(K.mix("#2EC07A", "#6ADCA8", l), 0.85); g.lineWidth = 2.4;
            for (let k = 0; k < 7; k++) { g.beginPath(); g.arc(B[0] + B[2] + 30, B[1] + 262 + 60, 90 + k * 24, Math.PI * 1.03, Math.PI * 1.5); g.stroke(); }
            g.restore();
            K.text(g, "Futures", B[0] + 28, B[1] + 318 + bo, { size: 24, weight: 600, color: ink, ls: -0.01 });
            if (f >= 67) {
              K.text(g, "Trade perpetuals on majors.", B[0] + 28, B[1] + 360 + bo, { size: 21, weight: 400, color: sub, ls: 0 });
              K.text(g, "Deep books, tight spreads.", B[0] + 28, B[1] + 402 + bo, { size: 21, weight: 400, color: sub, ls: 0 });
            }
            if (f >= 68) { g.fillStyle = K.rgba(K.mix("#9A8A82", "#C8BCB6", l), 0.75); g.fillRect(B[0] + B[2] - 116, B[1] + B[3] - 54, 96, 36); }
          }
          // C: Vaults
          if (f >= 72) {
            const off = COFF[f] || 0, y = Cc[1] + off;
            g.fillStyle = K.mix("#1E0B08", "#F6ECE8", l);
            g.fillRect(Cc[0], y, Cc[2], Cc[3]);
            g.fillStyle = K.mix("#1A0806", "#EEE2DE", l); g.fillRect(Cc[0], y, 380, Cc[3]);
            if (f >= 77) {
              // frosted image with a faint grid
              const rg = g.createRadialGradient(Cc[0] + 240, y + 190, 0, Cc[0] + 240, y + 190, 200);
              rg.addColorStop(0, K.rgba("#C8B6A8", 0.45)); rg.addColorStop(1, K.rgba("#C8B6A8", 0));
              g.fillStyle = rg; g.fillRect(Cc[0], y, 380, Cc[3]);
              g.save(); g.beginPath(); g.rect(Cc[0], y, 380, Cc[3]); g.clip();
              K.grid(g, { cell: 46, ox: Cc[0], oy: y, color: "#8A6A60", alpha: 0.25, width: 1, x0: Cc[0], x1: Cc[0] + 380, y0: y, y1: y + Cc[3] });
              g.restore();
            }
            K.text(g, "Vaults", Cc[0] + 424, y + 36, { size: 22, weight: 600, color: K.mix("#B8A49A", "#3A2A24", l), ls: -0.01 });
            K.text(g, "Put idle balances to work.", Cc[0] + 424, y + 78, { size: 20, weight: 400, color: K.mix("#8A766E", "#6A564C", l), ls: 0 });
            g.fillStyle = K.rgba("#9A8A82", 0.6); g.fillRect(Cc[0] + Cc[2] - 180, y + Cc[3] - 62, 160, 40);
          }
        }
        function outlines(g, f, l) {
          const col = K.mix("#FF4A24", "#F23A14", l);
          const R = (r, a, dy) => { g.strokeStyle = K.rgba(col, a); g.lineWidth = 4 + 10 * l; g.strokeRect(r[0], r[1] + (dy || 0), r[2], r[3]); };
          if (f >= 66) R(LAY.a, 1);
          if (f >= 70) R(LAY.b, f >= 82 ? 0.75 : 1);
          if (f >= 77) R(LAY.c, 1, CLINE[f] || 0);
          if (f >= 61 && f <= 65) {
            // the selection boxes that wire the cards up
            g.strokeStyle = K.rgba(col, 0.8); g.lineWidth = 3;
            g.strokeRect(LAY.a[0], LAY.a[1] + 60, LAY.a[2], LAY.a[3] - 60);
          }
        }

        // ---------------------------------------------------------- cursor
        const CUR = {
          61: [1736, 832, 22], 62: [1700, 940, 20], 63: [1276, 880, 13], 64: [1050, 762, 8], 65: [976, 728, 5.5], 66: [936, 704, 4.5],
          67: [926, 690, 4.4], 68: [910, 682, 4.5], 69: [912, 672, 4.6], 70: [900, 664, 4.8], 71: [906, 650, 5], 72: [904, 648, 5],
          73: [906, 636, 5], 74: [910, 630, 5], 75: [916, 620, 5], 76: [920, 608, 5], 77: [926, 602, 5], 78: [924, 590, 5],
          79: [936, 584, 5], 80: [940, 582, 5], 81: [946, 572, 5], 82: [940, 574, 5], 83: [950, 570, 5], 84: [956, 564, 5.1],
          85: [976, 556, 5.2], 86: [1000, 530, 5.5], 87: [1056, 430, 6.5], 88: [1066, 422, 7], 89: [1146, 442, 7.5], 90: [1240, 456, 8.5],
          91: [1286, 474, 9], 92: [1300, 482, 9], 93: [1316, 492, 9], 94: [1320, 480, 9], 95: [1326, 480, 9], 96: [1336, 472, 9],
          97: [1340, 472, 9], 98: [1336, 472, 9], 99: [1300, 486, 9], 100: [1260, 532, 9.5], 101: [1176, 572, 9.5], 102: [1236, 550, 9.5],
          103: [1286, 524, 9.5], 104: [1300, 512, 9.5], 105: [1306, 512, 9.5], 106: [1320, 490, 9.5], 107: [1326, 490, 9.5], 108: [1324, 492, 9.5],
          109: [1326, 492, 9.5], 110: [1330, 496, 9.5], 111: [1326, 500, 9.5], 112: [1320, 512, 9.6], 113: [1316, 512, 9.8], 114: [1300, 510, 10],
          115: [1276, 510, 10.5], 116: [1220, 502, 11],
        };
        // pixel clouds: [x, y, radius, cell]
        const CLOUD = {
          61: [[1156, 612, 130, 16], [1560, 1000, 240, 22]], 62: [[1360, 660, 190, 18], [1700, 900, 200, 20]], 63: [[1276, 640, 80, 14], [1776, 900, 230, 16]],
          64: [[1580, 812, 270, 18]], 65: [[1096, 812, 120, 14], [1676, 912, 200, 16]], 66: [[1000, 740, 60, 12], [1360, 900, 210, 16]],
          67: [[1086, 790, 95, 12]], 68: [[980, 742, 62, 10]], 69: [[930, 700, 26, 9]],
          88: [[1010, 470, 40, 10]], 89: [[1090, 470, 34, 10]], 90: [[1080, 420, 40, 10]], 91: [[1220, 470, 34, 10]],
          100: [[1300, 520, 60, 12]], 101: [[1260, 540, 60, 12]], 102: [[1300, 510, 50, 12]], 109: [[1250, 500, 26, 9]], 110: [[1240, 500, 30, 9]],
        };
        function cursor(ctx, f, l) {
          const c = CUR[f];
          if (!c) return;
          const [x, y, p] = c;
          const rot = f >= 100 ? -1.57 : f >= 86 ? -0.85 : f >= 66 ? -0.35 : f >= 64 ? -0.55 : -0.75;
          // measured points are the hand's centre; the sprite is anchored at the fingertip
          const ax = x - Math.cos(rot) * 2.5 * p + Math.sin(rot) * 7 * p, ay = y - Math.sin(rot) * 2.5 * p - Math.cos(rot) * 7 * p;
          const dark = f >= 101 && f <= 104;
          K.glow(ctx, (g) => {
            (CLOUD[f] || []).forEach(([cx, cy, r, cell], i) => K.pixelCloud(g, cx, cy, r, cell, 11 + f * 3 + i, "#FF8238", 1));
            if (f >= 66) { g.fillStyle = "#FF7A30"; g.fillRect(x - p * 6, y - p * 5, p * 10, p * 10); }
          }, { blur: 14, alpha: 0.8 });
          if (!dark) K.ember(ctx, x, y, p * 16, "#FF7A30", 0.55);
          K.glow(ctx, (g) => {
            K.hand(g, ax, ay, p, { fill: dark ? "#14100E" : "#FFFFFF", line: dark ? "#FFFFFF" : "#1A0A05", rot });
          }, { blur: 12, alpha: dark ? 0.2 : 0.75, mode: dark ? "source-over" : "lighter" });
        }

        // --------------------------------------------------------- render
        function drawDash(ctx, f, l) {
          const cam = camera(f);
          const lay = K.buf("dashLayer"), lg = lay.getContext("2d");
          dashboard(lg, f, l);
          const ol = K.buf("dashOutline"), og = ol.getContext("2d");
          outlines(og, f, l);
          const alpha = f <= 65 ? K.inv(60, 66, f) * 0.85 + 0.15 : 1;
          if (cam.sim) {
            const [s, tx, ty] = cam.sim;
            ctx.save(); ctx.globalAlpha = alpha; ctx.setTransform(s, 0, 0, s, tx, ty); ctx.drawImage(lay, 0, 0); ctx.restore();
            K.glow(ctx, (g) => { g.setTransform(s, 0, 0, s, tx, ty); g.drawImage(ol, 0, 0); }, { blur: 22, alpha: 1, passes: 3 });
          } else {
            const P = (u, v) => cam.map(u * K.W, v * K.H);
            K.drawQuad(ctx, lay, K.W, K.H, P);
            K.glow(ctx, (g) => K.drawQuad(g, ol, K.W, K.H, P), l > 0.25 ? { blur: 34, alpha: 0.95, passes: 2, mode: "source-over" } : { blur: 24, alpha: 1, passes: 3 });
          }
        }

        K.mount("dash", 54, 64, (ctx, f, cv) => {
          const l = LIGHT[f] || 0;
          K.fill(ctx, BG[f] || (f >= 57 && f <= 65 ? "#1E0907" : "#140F0B"));
          if (f <= 56) {
            if (f <= 55) burst(ctx, f);
            else { K.grid(ctx, { cell: 256, ox: 960, oy: 540, color: "#E8C8C0", alpha: 0.8, width: 1.4 }); network(ctx, f, true); }
          } else {
            if (f <= 66) K.ember(ctx, 960, 560, 1100, "#C8401C", f <= 62 ? 0.2 : 0.18);
            else K.ember(ctx, 900, 520, 900, "#B83A1C", 0.28 * (1 - l));
            if (f <= 63) {
              // the dark grid behind the network
              K.glow(ctx, (g) => K.grid(g, { cell: 230, ox: 960, oy: 540, color: "#C8382A", alpha: 0.5, width: 2 }), { blur: 6, alpha: 0.35 });
            }
            if (f >= 61 && f <= 115) drawDash(ctx, f, l);
            if (f === 116) {
              // the camera has panned off the card onto a dark grid
              ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 1180, 1080); ctx.clip();
              K.glow(ctx, (g) => K.grid(g, { cell: 144, ox: 100, oy: 112, color: "#D03A2A", alpha: 0.7, width: 2 }), { blur: 6, alpha: 0.6 });
              ctx.restore();
              drawDash(ctx, f, l);
            }
            network(ctx, f, false);
          }
          cursor(ctx, f, l);
          if (BLUR[f]) K.defocus(cv, BLUR[f]);
          if (l > 0.3) K.vignette(ctx, 0, "rgba(220,60,30,0.25)");
          K.bloom(cv, l > 0.3 ? 0.12 : 0.3, 70);
          K.vignette(ctx, f <= 56 || l > 0.3 ? 0.06 : 0.38);
          K.grain(ctx, f, 0.06);
        });
      })();
    </script>
  </div>
</template>
