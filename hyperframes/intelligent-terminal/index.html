<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>your intelligent trading terminal</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/three.min.js"></script>
    <script src="assets/slider3d.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f9f8f4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f9f8f4; font-family: "Inter", system-ui, sans-serif; }
      .layer { position: absolute; inset: 0; }
      /* keeps the fonts loaded before the first frame is drawn */
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }
    </style>
    <link rel="stylesheet" href="assets/scene.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="7.666667" data-width="1920" data-height="1080">
      <div class="fontwarm"><span style="font-weight:400">Aa</span><span style="font-weight:500">Aa</span><span style="font-weight:550">Aa</span><span style="font-weight:560">Aa</span><span style="font-weight:600">Aa</span></div>
      <div id="stage" class="layer"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
