<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>tallo promo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e2e1e7; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #e2e1e7; font-family: "Inter", system-ui, sans-serif; color: #1b1c20; }
      .layer { position: absolute; inset: 0; }
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }
      @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
      .emo { font-family: "Noto Color Emoji", sans-serif; }

      /* backgrounds */
      canvas.full { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #flat { background: #e7e6eb; }
      #dark { background: #131418; }

      /* kinetic lines */
      .kline { position: absolute; left: 0; top: 540px; white-space: nowrap; font-weight: 540; letter-spacing: -0.02em; line-height: 1; display: none; transform-origin: 50% 50%; }
      .kword { position: relative; display: inline-block; white-space: pre; transform-origin: 0% 70%; }
      .kword .lt { display: inline-block; white-space: pre; }
      .arcs { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }

      /* phone */
      #phoneWrap .view { perspective: 1500px; perspective-origin: 940px 500px; }
      #rig, #chipRig { position: absolute; left: 0; top: 0; width: 380px; height: 790px; transform-style: preserve-3d; }
      .seg { position: absolute; left: 0; top: 0; height: 32px; backface-visibility: hidden; }
      .face { position: absolute; inset: 0; border-radius: 64px; backface-visibility: hidden; }
      .front { transform: translateZ(20px); background: linear-gradient(140deg, #9cc3dc, #4f84aa 30%, #2d5e84 70%, #6a9cc0); padding: 5px; }
      .bezel { width: 100%; height: 100%; border-radius: 59px; background: #07090c; padding: 11px; }
      .back { transform: rotateY(180deg) translateZ(20px); background: linear-gradient(200deg, #9fc4dc, #5d8fb4 55%, #3f6f94); }
      .back::after { content: ""; position: absolute; right: 30px; top: 30px; width: 160px; height: 160px; border-radius: 44px; background: linear-gradient(160deg, #a9cbe0, #6f9dbf); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25), 0 4px 14px rgba(0,0,0,.2); }
      .screen { position: relative; width: 100%; height: 100%; border-radius: 49px; overflow: hidden;
        background:
          radial-gradient(circle at 12% 58%, #9fe3f0 0 15%, #62c3e6 15.4% 27%, #2f93cf 27.4% 40%, #1b6db0 40.4% 54%, transparent 54.4%),
          radial-gradient(circle at 92% 18%, #b5e9f4 0 12%, #74c8ea 12.4% 22%, #3b9ad4 22.4% 33%, transparent 33.4%),
          radial-gradient(circle at 70% 100%, #1d5f9c 0 30%, transparent 30.4%),
          linear-gradient(172deg, #7ccbe8 0%, #2c86c4 45%, #0f467d 100%); }
      .screen::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 35%); }
      .island { position: absolute; left: 50%; top: 15px; width: 108px; height: 32px; margin-left: -54px; border-radius: 16px; background: #000; z-index: 2; }
      .island::after { content: ""; position: absolute; right: 12px; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: #1b2633; }
      .sbar { position: absolute; top: 20px; left: 30px; right: 26px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 650; color: #fff; z-index: 2; }
      .home { position: absolute; left: 18px; right: 18px; top: 70px; display: grid; grid-template-columns: repeat(4, 62px); justify-content: space-between; row-gap: 14px; }
      .widget { grid-column: span 2; grid-row: span 2; height: 158px; border-radius: 22px; background: rgba(255,255,255,.28); position: relative; color: #fff; }
      .widget .ring { position: absolute; left: 18px; top: 18px; width: 56px; height: 56px; border-radius: 50%; border: 5px solid #34d27a; display: grid; place-items: center; }
      .widget .ring::after { content: ""; width: 14px; height: 22px; border-radius: 4px; border: 2.5px solid #fff; }
      .widget b { position: absolute; left: 18px; bottom: 16px; font-size: 26px; font-weight: 650; }
      .ic { display: flex; flex-direction: column; align-items: center; gap: 5px; }
      .ic i { width: 62px; height: 62px; border-radius: 15px; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
      .ic i svg { width: 60%; height: 60%; }
      .ic span { font-size: 10.5px; color: #fff; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
      .dock { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 92px; border-radius: 36px; background: rgba(255,255,255,.3); display: flex; justify-content: space-around; align-items: center; }
      .dock .ic span { display: none; }
      .chip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 14px; height: 88px; padding: 0 28px 0 22px; background: rgba(255,255,255,.96); border-radius: 15px; box-shadow: 0 14px 34px rgba(30,60,90,.16), 0 2px 5px rgba(30,60,90,.12); font-size: 40px; font-weight: 500; letter-spacing: -0.015em; color: #16171a; white-space: nowrap; }
      .chip .emo { font-size: 38px; line-height: 1; }

      /* bills list */
      #tlist { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      #tlist .ttl { position: absolute; left: 0; top: -45px; font-size: 75px; font-weight: 700; letter-spacing: -0.025em; white-space: pre; line-height: 90px; }
      #tlist .ttl span { display: inline-block; }
      #tlist .row { position: absolute; left: 0; height: 60px; display: flex; align-items: center; font-size: 37px; font-weight: 500; letter-spacing: -0.012em; white-space: nowrap; }
      #tlist .ck { width: 52px; height: 52px; border-radius: 50%; margin-right: 48px; flex: none; display: grid; place-items: center; }
      #tlist .ck.on { background: #edb53a; }
      #tlist .ck.off { box-shadow: inset 0 0 0 2.5px #c4c4ca; }
      #tlist .ck svg { width: 30px; height: 30px; }

      /* calendar */
      .num { position: absolute; left: 0; top: 0; font-weight: 520; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; color: #17181b; }
      #dot { position: absolute; left: 0; top: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 520; letter-spacing: -0.03em; line-height: 1; }
      #dot svg { width: 56%; height: 56%; }

      /* cards */
      #cards { perspective: 1800px; perspective-origin: 960px 540px; }
      .card { position: absolute; left: 0; top: 0; width: 640px; height: 640px; border-radius: 30px; overflow: hidden; background: #232428; box-shadow: 0 30px 80px rgba(0,0,0,.4), inset 0 0 0 1.5px rgba(255,255,255,.045); }
      .card .band { position: absolute; left: 0; right: 0; top: 0; height: 43%; background: #2c2d32; }
      .card .in { position: absolute; inset: 0; }
      .card svg { position: absolute; left: 62px; top: 292px; width: 66px; height: 66px; }
      .card b { position: absolute; left: 66px; top: 392px; font-size: 62px; font-weight: 500; letter-spacing: -0.02em; color: #f2f2f4; }

      /* logo + wordmark */
      #icon { position: absolute; left: 0; top: 0; overflow: hidden; background: #fff; }
      #iconBg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #tile { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; background: #fff; border-radius: 22%; }
      #tile svg { position: absolute; left: 18%; top: 18%; width: 64%; height: 64%; }
      #wordmark { position: absolute; left: 960px; top: 540px; font-size: 196px; font-weight: 700; letter-spacing: -0.035em; color: #fff; white-space: nowrap; line-height: 1;
        text-shadow: 0 0 14px rgba(255,255,255,.7), 0 0 44px rgba(255,255,255,.45), 0 0 120px rgba(220,225,232,.35); }
      #glow { position: absolute; left: 960px; top: 540px; width: 1300px; height: 640px; margin: -320px 0 0 -650px; border-radius: 50%; background: radial-gradient(closest-side, rgba(160,165,175,.32), rgba(160,165,175,.12) 55%, rgba(160,165,175,0)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="14.6667" data-width="1920" data-height="1080">
      <div class="fontwarm"><span style="font-weight:540">Aa</span><span style="font-weight:700">Aa</span><span class="emo">🏠</span></div>
      <div id="stage" class="layer"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
