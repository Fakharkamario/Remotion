<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>gigi type</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0d0f14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d0f14; font-family: "Inter", system-ui, sans-serif; }
      .layer { position: absolute; inset: 0; }
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; font-weight: 700; }
      .rise { position: absolute; left: 0; top: 0; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%;
        background: radial-gradient(closest-side, #eef3f8 0%, #eef3f8 48%, rgba(238,243,248,.55) 72%, rgba(238,243,248,0) 100%); }
      .grp { position: absolute; inset: 0; transform-origin: 960px 540px; }
      /* the type: Inter bold, tight; lines laid out whole, words pop in place */
      .row { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 700; letter-spacing: -0.045em; line-height: 1.3; display: none; color: #fff; }
      .row.haze, .row.bloom { color: #243248; }
      .row.dark .t { text-shadow: 0 0 0.25em rgba(255,255,255,.28); }
      .wd { display: inline-block; margin: 0 0.11em; transform-origin: 50% 70%; position: relative; }
      .wd .t { display: inline-block; }
      .wd.fast .t { font-weight: 800; letter-spacing: -0.02em; transform: scaleX(0.9); background: linear-gradient(90deg, #2f93fb, #6fd0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
      /* the dragged words: thin navy box with corner handles, gradient-filled text */
      .bx { padding: 0 0.08em; outline: 2px solid rgba(36,50,72,.75); outline-offset: 0; line-height: 1.1; }
      .bx .t { background: linear-gradient(90deg, #2f93fb, #5cb4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .bx.box2 .t { background: linear-gradient(90deg, #6ab8ff, #8a6cff); -webkit-background-clip: text; background-clip: text; }
      .bx .hd { position: absolute; left: -5px; top: -5px; width: 9px; height: 9px; background: #243248; }
      .bx .hd.r { left: auto; right: -5px; } .bx .hd.b { top: auto; bottom: -5px; }
      .cur { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .cur svg { position: absolute; left: -12px; top: -12px; width: 64px; height: 64px; overflow: visible; filter: drop-shadow(0 3px 6px rgba(20,40,80,.25)); transform: rotate(-12deg); }
      .cur b { position: absolute; left: -16px; top: 40px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; color: #fff; font-size: 20px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 3px 8px rgba(20,40,80,.25); }
      /* the profile card */
      .pcard { position: absolute; left: 50%; top: 50%; display: flex; align-items: center; gap: 44px; padding: 44px 120px 44px 44px; border-radius: 60px; background: #1c1c1e;
        box-shadow: 0 40px 90px rgba(20,24,40,.28), 0 10px 24px rgba(20,24,40,.16), inset 0 1px 0 rgba(255,255,255,.06); transform-origin: 50% 50%; }
      .pcard { overflow: hidden; }
      .pcard .sheen { position: absolute; left: 0; top: -20%; width: 260px; height: 140%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.14), rgba(255,255,255,0)); pointer-events: none; }
      .pcard .av { width: 220px; height: 220px; border-radius: 50%; display: block; }
      .pcard .nm { font-size: 86px; font-weight: 700; color: #fff; letter-spacing: -0.03em; display: flex; align-items: center; gap: 18px; white-space: nowrap; line-height: 1.1; }
      .pcard .bd svg { width: 72px; height: 72px; display: block; }
      .pcard .hn { font-size: 56px; color: #8b8b91; margin-top: 6px; letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="9.2" data-width="1920" data-height="1080">
      <div class="fontwarm">Aa <b style="font-weight:850">Aa</b></div>
      <div id="stage" class="layer"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
