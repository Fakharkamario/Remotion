<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>GOAT Funded Perps opener</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/opener.js"></script>
    <style>
      @font-face { font-family: "Altform"; src: url("assets/fonts/altform-regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Altform"; src: url("assets/fonts/altform-semibold.woff2") format("woff2"); font-weight: 600; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Altform", sans-serif; }
      .layer { position: absolute; inset: 0; }
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }
      #world { transform-origin: 60% 46%; }
      /* the room: warm amber key light washing the left wall, dark everywhere else */
      #wall { background:
        radial-gradient(ellipse 34% 90% at 20% 50%, rgba(128,84,30,0.72) 0%, rgba(84,54,18,0.5) 45%, rgba(22,14,6,0) 85%),
        linear-gradient(90deg, rgba(60,40,14,0.35) 0%, rgba(90,60,20,0.32) 30%, rgba(0,0,0,0) 55%),
        linear-gradient(180deg, #0c0906 0%, #080604 60%, #040302 100%); }
      #cam1, #cam2 { transform-origin: 62% 45%; }
      /* the screen sits behind the subject's focus plane: soft, glowing, with glass on top */
      .mon { position: absolute; left: 708px; top: 150px; width: 1110px; height: 682px; background: #020303; border: 7px solid #08090a; border-radius: 6px;
        box-shadow: 0 0 160px 30px rgba(50,190,130,0.11), 0 0 2px rgba(255,255,255,0.08); transform: perspective(2200px) rotateY(-5deg); transform-origin: 20% 50%; }
      .mon canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #chart { filter: blur(2.4px) saturate(1.15) brightness(1.05); }
      #bloom { mix-blend-mode: screen; filter: blur(14px); opacity: 0.85; }
      .mon .glass { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.025) 100%); }
      .far { position: absolute; left: 1880px; top: 120px; width: 160px; height: 620px; filter: blur(5px) brightness(0.75); }
      .far canvas { width: 100%; height: 100%; }
      /* light from the screen spilling into the room around the subject */
      #spill { background: radial-gradient(ellipse 36% 44% at 66% 46%, rgba(60,180,120,0.10), rgba(0,0,0,0) 70%); mix-blend-mode: screen; }
      /* the photo graded into the scene, then relit: shadow side, warm key rim, screen light wrapping the edges */
      .person { position: absolute; left: 470px; top: 150px; width: 1220px; }
      .person img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
      .person img.base { position: relative; filter: brightness(0.66) contrast(1.32) saturate(0.85) sepia(0.2) blur(0.6px); }
      .person img.shade { opacity: 0.9; }
      .person img.rimw { mix-blend-mode: screen; opacity: 0.85; filter: blur(1px); }
      .person img.rims { mix-blend-mode: screen; opacity: 0.22; filter: blur(4px); }
      /* a little atmosphere between the lens and the subject */
      #haze { background: radial-gradient(ellipse 60% 50% at 24% 46%, rgba(160,110,50,0.10), rgba(0,0,0,0) 70%); mix-blend-mode: screen; }
      /* copy: warm white with a soft bloom, as in the reference */
      .copy { position: absolute; left: 152px; top: 318px; color: #F4EDE2; white-space: nowrap; text-shadow: 0 0 22px rgba(255,226,186,0.28); }
      .copy span { display: inline-block; }
      .copy .l1 { font-weight: 400; font-size: 76px; line-height: 1.12; letter-spacing: -0.012em; }
      .copy .l2 { font-weight: 400; font-size: 100px; line-height: 1.12; letter-spacing: -0.012em; color: #F6A03A; margin-top: 2px; text-shadow: 0 0 30px rgba(246,160,58,0.5), 0 0 8px rgba(246,160,58,0.35); }
      #dark { background: #000; opacity: 0; }
      #vig { background: radial-gradient(ellipse 78% 82% at 52% 48%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.72) 100%); }
      #grain { background-size: 320px 320px; mix-blend-mode: overlay; opacity: 0.16; }
      .bar { position: absolute; left: 0; right: 0; height: 62px; background: #000; }
      .bar.top { top: 0; } .bar.bot { bottom: 0; height: 58px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="2.266667" data-width="1920" data-height="1080">
      <div class="fontwarm"><span style="font-family:Altform;font-weight:400">Aa</span><span style="font-family:Altform;font-weight:600">Aa</span></div>
      <div id="stage" class="layer"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount(document.getElementById("stage"));
    </script>
  </body>
</html>
