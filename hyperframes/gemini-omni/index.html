<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Gemini Omni short</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/words.js"></script>
    <script src="assets/env.js"></script>
    <script src="assets/cutouts.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-wght.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-normal-400.woff2") format("woff2"); font-style: normal; font-display: block; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-italic-400.woff2") format("woff2"); font-style: italic; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-wght.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Inter", system-ui, sans-serif; color: #fff; }
      .layer { position: absolute; inset: 0; }
      .camlayer { will-change: transform, clip-path; }
      #cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 0 0; filter: contrast(1.04) saturate(1.06); }
      #cut img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; display: none; filter: contrast(1.04) saturate(1.06); }
      .fontwarm { position: absolute; left: -9999px; top: 0; font-size: 20px; }
    </style>
    <link rel="stylesheet" href="assets/scene.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="54.8" data-width="1080" data-height="1920">
      <div class="fontwarm">
        <span style="font-weight:400">Aa1</span><span style="font-weight:600">Aa1</span><span style="font-weight:800">Aa1</span><span style="font-weight:900">Aa1</span>
        <span style="font-family:'Instrument Serif'">Aa1</span><span style="font-family:'Instrument Serif';font-style:italic">Aa1</span>
        <span style="font-family:'JetBrains Mono'">Aa1</span><span style="font-family:'JetBrains Mono';font-weight:700">Aa1</span>
      </div>
      <!-- graphics behind the take, the take, words behind him, his cutout, graphics, captions -->
      <div id="back" class="layer"></div>
      <div id="cam" class="layer camlayer">
        <video id="aroll" src="assets/aroll.mp4" data-start="0" data-duration="54.8" data-track-index="0" muted playsinline></video>
      </div>
      <div id="behind" class="layer"></div>
      <div id="cut" class="layer camlayer"></div>
      <div id="stage" class="layer"></div>
      <div id="caps" class="layer"></div>
      <div id="fade" class="layer" style="background:#000;opacity:0"></div>
      <audio id="soundtrack" src="assets/audio.m4a" data-start="0" data-duration="54.8" data-track-index="30" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = SCENE.mount({
        back: document.getElementById("back"),
        cam: document.getElementById("cam"),
        video: document.getElementById("aroll"),
        behind: document.getElementById("behind"),
        cut: document.getElementById("cut"),
        stage: document.getElementById("stage"),
        caps: document.getElementById("caps"),
        fade: document.getElementById("fade"),
      });
    </script>
  </body>
</html>
