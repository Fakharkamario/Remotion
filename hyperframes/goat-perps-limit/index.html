<!doctype html>

  <head>

    <style>

      @font-face { font-family: "Altform"; src: url("assets/fonts/altform-regular.woff2") format("woff2"); font-weight: 400 500; font-display: block; }
      @font-face { font-family: "Altform"; src: url("assets/fonts/altform-semibold.woff2") format("woff2"); font-weight: 600 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050607; }

      .persp { position: absolute; inset: 0; perspective: 2300px; perspective-origin: 50% 46%; }
      .rig { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
      .win { position: absolute; border-radius: 18px; background: linear-gradient(180deg, #121417, #0D0F12); border: 1.5px solid rgba(230,236,245,0.09);

      .win .bar b { color: #EDEFF2; font-weight: 600; }
      .win .bar .up { color: #3FCB7E; } .win .bar .tag { margin-left: auto; padding: 4px 10px; border-radius: 8px; background: rgba(236,139,27,0.14); color: #F6A03A; font-weight: 600; font-size: 14px; }

      .seg { display: flex; gap: 8px; padding: 5px; border-radius: 12px; background: rgba(0,0,0,0.35); }
      .seg span { flex: 1; text-align: center; padding: 12px 0; border-radius: 9px; font-size: 19px; font-weight: 600; color: #7D838B; }
      .seg .on { --k: 0; color: rgb(calc(125 + 105 * var(--k)), calc(131 + 52 * var(--k)), calc(139 - 96 * var(--k)));

      .trace { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); overflow: visible; pointer-events: none; }
      .trace rect { fill: none; stroke: #FFD98A; stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(246,190,80,0.9)) drop-shadow(0 0 16px rgba(215,160,43,0.6)); }
      .brk { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-radius: 12px; background: rgba(236,139,27,0.08); border: 1px solid rgba(236,139,27,0.28); font-size: 18px; color: #C9A77A; }
      .brk b { font-size: 24px; color: #FFB65C; font-weight: 600; }
      .pricepill { position: absolute; right: 0; padding: 5px 10px; border-radius: 7px 0 0 7px; font-size: 15px; font-weight: 600; transform: translateY(-50%); white-space: nowrap; }
      .lim-label { position: absolute; left: 22px; transform: translateY(-120%); display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 10px;
        background: rgba(30,20,8,0.92); border: 1.5px solid rgba(246,160,58,0.55); color: #FFC27A; font-size: 17px; font-weight: 600; white-space: nowrap; box-shadow: 0 0 24px rgba(236,139,27,0.25); }
      .lim-label i { font-style: normal; color: #8E7A62; font-weight: 400; }

        radial-gradient(ellipse 60% 60% at 88% 96%, rgba(150,112,24,0.5), rgba(0,0,0,0) 70%),

      .slant { position: absolute; left: -400px; top: -300px; width: 2900px; height: 1800px; transform-origin: 50% 50%; }

      .slant .btn { position: absolute; padding: 16px 30px; border-radius: 14px; font-size: 24px; font-weight: 600; color: rgba(255,215,130,0.32); background: rgba(215,183,43,0.10); border: 1.5px solid rgba(215,183,43,0.22); filter: blur(1px); }
      .slant .num { position: absolute; font-family: "MD Nichrome", sans-serif; font-size: 40px; color: rgba(215,183,43,0.28); filter: blur(0.6px); }
      .wheel { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .wline { position: absolute; left: 1000px; top: 0; width: 2px; height: 1080px; margin-left: -1px; background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.12) 30%, rgba(255,255,255,0.12) 70%, rgba(255,255,255,0)); }
      .marker { position: absolute; left: 790px; top: 540px; width: 0; height: 0; border-style: solid; border-width: 19px 0 19px 32px; border-color: transparent transparent transparent #F7F4EE; transform: translate(-50%, -50%);
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.35)); }
      .pillw { position: absolute; left: 862px; top: 540px; transform-origin: 0 50%; }
      .pill { --f: 1; position: relative; transform: translateY(-50%); padding: 12px 26px 14px; border-radius: 14px; font-size: 54px; font-weight: 600; white-space: nowrap; letter-spacing: -0.005em; }
      .pill.gold { background: linear-gradient(180deg, #F6DE7E, #D7B72B); color: #1C1604; box-shadow: 0 0 calc(50px * var(--f)) rgba(215,183,43, calc(0.55 * var(--f))); }
      .pill.white { background: linear-gradient(180deg, #FFFFFF, #DADDE2); color: #15171B; box-shadow: 0 0 calc(46px * var(--f)) rgba(255,255,255, calc(0.35 * var(--f))); }
      .pill.green { background: linear-gradient(180deg, #7CF0AE, #34C878); color: #062114; box-shadow: 0 0 calc(50px * var(--f)) rgba(60,210,130, calc(0.5 * var(--f))); }
      .pill .strike { position: absolute; left: 14px; right: 14px; top: 50%; height: 5px; margin-top: -1px; border-radius: 3px; background: #1C1E22; transform-origin: 0 50%; transform: scaleX(0); }

      #grain { background-size: 320px 320px; mix-blend-mode: overlay; opacity: 0.12; pointer-events: none; }
